name: Notify Services on Release Change

on:
  workflow_call:
    secrets:
      ARTCRAFT_SERVICES_DISPATCH_TOKEN:
        description: Token with contents:write on storytold/artcraft-services to trigger repository_dispatch
        required: false

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Dispatch release-changed event to artcraft-services
        env:
          DISPATCH_TOKEN: ${{ secrets.ARTCRAFT_SERVICES_DISPATCH_TOKEN }}
          EVENT_ACTION: ${{ github.event.action }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "::warning::ARTCRAFT_SERVICES_DISPATCH_TOKEN is not configured; skipping artcraft-services rebuild dispatch."
            exit 0
          fi
          if [ "${RELEASE_PRERELEASE:-}" = "true" ]; then prerelease=true; else prerelease=false; fi
          # Serialize with jq so a tag containing a quote or backslash cannot break the JSON body.
          jq -n \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg action "${EVENT_ACTION}" \
            --arg tag "${RELEASE_TAG}" \
            --argjson prerelease "${prerelease}" \
            '{event_type: "craft-release-changed", client_payload: {repo: $repo, action: $action, tag: $tag, prerelease: $prerelease}}' |
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/storytold/artcraft-services/dispatches" \
            --data-binary @-
