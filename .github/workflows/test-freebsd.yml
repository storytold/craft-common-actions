name: Shared FreeBSD workflow tests

# The suite covers every workflow and action, not only FreeBSD, so a change to any of them runs it.
on:
  pull_request:
    paths:
      - .github/workflows/**
      - actions/**
      - tests/**
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - actions/**
      - tests/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            archive.ubuntu.com:80
            azure.archive.ubuntu.com:80
            security.ubuntu.com:80
            archive.ubuntu.com:443
            azure.archive.ubuntu.com:443
            security.ubuntu.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install YAML parser
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml tcsh rpm debsigs dpkg-dev skopeo
      - name: Exercise failing tests, package validation and required fonts
        run: /usr/bin/python3 -m unittest discover -s tests -v
