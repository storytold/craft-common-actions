name: Push verified nightly Flatpak OCI tags
# Separate from nightly-release.yml so nightly-release.yml needs no packages: write permission
# and an OCI registry failure cannot affect release history or future nightly admissions.
on:
  workflow_call:
    inputs:
      tooling-revision:
        type: string
        required: true
      release_id:
        type: string
        required: true
      publication_signing_sha256:
        type: string
        required: true
      publication_checksums_sha256:
        type: string
        required: true
      release_tag:
        type: string
        required: true
      version:
        type: string
        required: true
      source_commit:
        type: string
        required: true
      producer_run_id:
        type: string
        required: true
      producer_run_attempt:
        type: string
        required: true
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
permissions:
  contents: read
  packages: write
  actions: read
jobs:
  push-oci:
    if: >-
      github.repository == 'storytold/photocraft' && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/release' && github.ref_type == 'branch'
    # This repository owns one set of floating OCI tags. Never let a second
    # writer publish while this job is rechecking freshness and copying tags.
    concurrency:
      group: craft-nightly-oci-photocraft
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Check out only the actual release execution source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-source
          persist-credentials: false
      - name: Check out only the defining shared workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nightly-tools
          persist-credentials: false
      - name: Bind immutable defining workflow
        env:
          TOOLING_REVISION: ${{ inputs.tooling-revision }}
          DEFINING_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git -C .release-source rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -I -B -c "import os,re; p=os.environ['TOOLING_REVISION']; assert re.fullmatch('[0-9a-f]{40}',p) and p!='0'*40; assert os.environ['DEFINING_REPOSITORY']=='storytold/craft-common-actions'; assert os.environ['DEFINING_SHA']==p"
      - name: Resolve verified release target and exact producer package artifact IDs
        id: target
        env:
          TOOLING_REVISION: ${{ inputs.tooling-revision }}
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import os, sys
          sys.path.insert(0, ".nightly-tools/scripts")
          import nightly_feed as n
          import nightly_release_request as r
          policy = n.bounded_json(".release-source/.github/nightly-signing-policy.json")
          r.validate_policy(policy)
          n.require(policy["signer_tooling_revision"] == os.environ["TOOLING_REVISION"], "policy signer_tooling_revision mismatch")
          enabled = "oci" in r.policy_linux_package_formats(policy)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"oci-enabled={'true' if enabled else 'false'}\n")
          PY
      - name: Fetch release metadata from GitHub REST API
        id: release-meta
        if: steps.target.outputs.oci-enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ inputs.release_id }}
          RECEIPT_SHA256: ${{ inputs.publication_signing_sha256 }}
          CHECKSUM_SHA256: ${{ inputs.publication_checksums_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs.producer_run_attempt }}
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import json, os, sys
          from pathlib import Path
          from urllib.parse import quote
          sys.path.insert(0, ".nightly-tools/scripts")
          import nightly_feed as n
          import nightly_oci as oci
          env = os.environ
          repo, rel_id, tag = env["GITHUB_REPOSITORY"], int(env["RELEASE_ID"]), env["RELEASE_TAG"]
          n.positive(rel_id, "publisher release ID")
          release = oci.gh_json(repo, f"releases/{rel_id}")
          policy = n.bounded_json(".release-source/.github/nightly-signing-policy.json")
          request, support = oci.release_bindings(
              release, policy, env["RECEIPT_SHA256"], repository=repo, release_id=rel_id, tag=tag,
              version=env["RELEASE_VERSION"], source_commit=env["SOURCE_COMMIT"],
              producer_run_id=int(env["PRODUCER_RUN_ID"]), producer_run_attempt=int(env["PRODUCER_RUN_ATTEMPT"]),
              signer_run_id=int(env["GITHUB_RUN_ID"]), signer_run_attempt=int(env["GITHUB_RUN_ATTEMPT"]),
              signer_source_commit=env["GITHUB_SHA"],
          )
          ref = oci.gh_json(repo, "git/ref/tags/" + quote(tag, safe=""))
          target = ref.get("object", {})
          n.require(target.get("type") == "commit" and target.get("sha") == env["SOURCE_COMMIT"],
                    "immutable release tag commit differs from publisher")
          bindings = oci.verified_release_assets(release, support, env["CHECKSUM_SHA256"], repository=repo)
          oci.download_release_evidence(repo, bindings, ".release-evidence")
          ids = oci.verify_producer_artifacts(repo, request, policy)
          # Do not retain the full REST asset array, only the needed verified identity.
          metadata = {k: release[k] for k in ("id", "tag_name", "target_commitish", "draft", "prerelease", "html_url", "body")}
          with Path(".release.json").open("x", encoding="utf-8") as out:
              json.dump({"release": metadata, "support": support}, out)
          with open(env["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for arch, artifact_id in ids.items():
                  out.write(f"artifact-id-{arch}={artifact_id}\n")
          PY
      - name: Install skopeo
        if: steps.target.outputs.oci-enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
      - name: Download exact authenticated Linux x86_64 package artifact
        if: steps.target.outputs.oci-enabled == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.producer_run_id }}
          artifact-ids: ${{ steps.release-meta.outputs.artifact-id-x86_64 }}
          path: .linux-packages
          merge-multiple: true
          digest-mismatch: error
      - name: Download exact authenticated Linux aarch64 package artifact
        if: steps.target.outputs.oci-enabled == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.producer_run_id }}
          artifact-ids: ${{ steps.release-meta.outputs.artifact-id-aarch64 }}
          path: .linux-packages
          merge-multiple: true
          digest-mismatch: error
      - name: Verify release target, SHA256SUMS.txt, and .oci.sig before pushing OCI tags
        if: steps.target.outputs.oci-enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ inputs.release_id }}
          RECEIPT_SHA256: ${{ inputs.publication_signing_sha256 }}
          CHECKSUM_SHA256: ${{ inputs.publication_checksums_sha256 }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs.producer_run_attempt }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          import os, sys
          sys.path.insert(0, ".nightly-tools/scripts")
          import nightly_oci as oci
          import nightly_feed as n
          policy = n.bounded_json(".release-source/.github/nightly-signing-policy.json")
          fingerprint = policy["platforms"]["linux-x86_64"]["trust"]["fingerprint"]
          metadata = n.bounded_json(".release.json")
          rel_id = int(os.environ["RELEASE_ID"])
          oci.verify_and_push_oci(
              release=metadata["release"],
              release_support=metadata["support"],
              evidence_dir=".release-evidence",
              checksum_sha256=os.environ["CHECKSUM_SHA256"],
              repository=os.environ["GITHUB_REPOSITORY"],
              tag=os.environ["RELEASE_TAG"],
              version=os.environ["RELEASE_VERSION"],
              source_commit=os.environ["SOURCE_COMMIT"],
              release_id=rel_id,
              package_dir=".linux-packages",
              public_key=".release-source/.github/nightly-linux-signing-key.asc",
              fingerprint=fingerprint,
              environment=os.environ,
              producer_run_id=int(os.environ["PRODUCER_RUN_ID"]),
              producer_run_attempt=int(os.environ["PRODUCER_RUN_ATTEMPT"]),
          )
          PY
