name: house-rules test

on:
  pull_request:
    paths:
      - actions/house-rules/**
      - tests/test_house_rules.py
      - .github/workflows/house-rules.yml
      - .github/workflows/test-house-rules.yml
  push:
    branches: [main]
    paths:
      - actions/house-rules/**
      - tests/test_house_rules.py
      - .github/workflows/house-rules.yml
      - .github/workflows/test-house-rules.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.amazontrust.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            api.github.com:443
            github.com:443
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: House-rules unit tests
        run: python3 -m unittest tests/test_house_rules.py
