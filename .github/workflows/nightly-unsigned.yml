name: Unsigned nightly producer (every listed platform, one run)
# Reusable only. Main application code never runs with signing keys or OIDC.
on:
  workflow_call:
    inputs:
      tooling-revision:
        type: string
        required: true
      app-name:
        type: string
        default: photocraft
      manual-actors:
        type: string
        default: '[]'
      craft-fonts-ref:
        type: string
        default: bfcbf714e45a3ea8e98f88ab2b7971372a576414
      platforms:
        description: "Reviewed literal JSON list of platforms this caller builds; the release signer still requires every admitted platform"
        type: string
        default: '["windows-x86_64"]'
      linux-package-formats:
        description: "Reviewed literal JSON list of Linux distro package formats to build alongside linux-x86_64; default none keeps the tarball path independent"
        type: string
        default: '[]'
    outputs:
      unsigned-artifact-id:
        value: ${{ jobs.build.outputs.artifact-id }}
      unsigned-sha256:
        value: ${{ jobs.attest.outputs.unsigned-sha256 }}
permissions:
  contents: read
env:
  TOOLING_REVISION: ${{ inputs.tooling-revision }}
  NIGHTLY_MANUAL_ACTORS: ${{ inputs.manual-actors }}
  # Every shared script derives the app's names from its reviewed registry row (scripts/nightly_app.py).
  NIGHTLY_APP: ${{ inputs.app-name }}
jobs:
  admit-app:
    # The allowlist: only a reviewed nightly-apps.json row with targets, for its own repository,
    # on its default branch. Every other job runs only when this says ok.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ok: ${{ steps.admit.outputs.ok }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Bind immutable defining workflow before any shared code
        env:
          DEFINING_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_SHA: ${{ job.workflow_sha }}
        run: |
          python3 -I -B -c "import os,re; p=os.environ['TOOLING_REVISION']; assert re.fullmatch('[0-9a-f]{40}',p) and p!='0'*40; assert os.environ['DEFINING_REPOSITORY']=='storytold/craft-common-actions'; assert os.environ['DEFINING_SHA']==p"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nightly-tools
          persist-credentials: false
      - name: Admit only a reviewed registry app on its own repository's main
        id: admit
        run: |
          set -euo pipefail
          test "$(git -C .nightly-tools rev-parse HEAD)" = "$TOOLING_REVISION"
          python3 -I -B .nightly-tools/scripts/nightly_app.py admit --app-name "$NIGHTLY_APP" \
            --repository "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" | tee -a "$GITHUB_OUTPUT"

  git-sources:
    needs: [admit-app]
    if: needs.admit-app.outputs.ok == 'true' && github.ref == 'refs/heads/main'
    name: Git dependencies come from storytold
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Git dependencies come from storytold
        run: |
          set -euo pipefail
          test -f Cargo.lock || { echo "Cargo.lock is missing"; exit 1; }
          # Source replacement, patches and path overrides in cargo config never show up
          # in Cargo.lock. Parsed rather than grepped: TOML has many spellings of one key.
          # Cargo still reads the legacy .cargo/config.
          python3 - <<'PY'
          import os, sys, tomllib
          for path in (".cargo/config", ".cargo/config.toml"):
              if not os.path.exists(path):
                  continue
              config = tomllib.load(open(path, "rb"))
              replaced = [name for name, source in config.get("source", {}).items()
                          if isinstance(source, dict) and "replace-with" in source]
              if replaced or "patch" in config or "paths" in config:
                  print(f"{path} replaces, patches or overrides a source")
                  sys.exit(1)
          PY
          # Check locked git origins first: cargo metadata resolves and can fetch them.
          python3 - <<'PY'
          import sys, tomllib
          lock = tomllib.load(open("Cargo.lock", "rb"))
          bad = sorted({p["source"] for p in lock.get("package", [])
                        if p.get("source", "").startswith("git+")
                        and not p["source"].startswith("git+https://github.com/storytold/")})
          if bad:
              print("Git dependencies outside github.com/storytold:", *bad, sep="\n")
              sys.exit(1)
          PY
          # Fails when Cargo.lock is out of date with the manifests.
          cargo metadata --locked --format-version 1 > /dev/null


  select-platforms:
    needs: [admit-app]
    # Validate the caller's list once. Build jobs then match exact array elements; a bare
    # JSON string such as "not-linux-x86_64" can never substring-match a platform.
    if: needs.admit-app.outputs.ok == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      platforms: ${{ steps.select.outputs.platforms }}
      linux-package-formats: ${{ steps.select-packages.outputs.formats }}
    steps:
      - name: Require a JSON array of distinct supported platform IDs
        id: select
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          python3 -I -B - <<'PY'
          import json, os, sys
          supported = {'linux-x86_64', 'macos-aarch64', 'windows-x86_64'}
          try:
              value = json.loads(os.environ['PLATFORMS'])
          except ValueError:
              sys.exit('platforms must be a JSON array of supported platform IDs')
          if not (isinstance(value, list) and value and all(isinstance(item, str) and item in supported for item in value)):
              sys.exit('platforms must be a non-empty JSON array of supported platform IDs')
          if len(set(value)) != len(value):
              sys.exit('platforms must not repeat a platform')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('platforms='+json.dumps(sorted(value), separators=(',', ':'))+'\n')
          PY
      - name: Validate optional Linux package formats
        id: select-packages
        env:
          PLATFORMS: ${{ steps.select.outputs.platforms }}
          LINUX_PACKAGE_FORMATS: ${{ inputs.linux-package-formats }}
        run: |
          python3 -I -B - <<'PY'
          import json, os, sys
          supported = {'deb', 'rpm', 'appimage', 'flatpak', 'oci', 'arch'}
          platforms = json.loads(os.environ['PLATFORMS'])
          try:
              fmts = json.loads(os.environ['LINUX_PACKAGE_FORMATS'])
          except ValueError:
              sys.exit('linux-package-formats must be a JSON array')
          if not (isinstance(fmts, list) and all(isinstance(f, str) and f in supported for f in fmts) and len(set(fmts)) == len(fmts)):
              sys.exit('linux-package-formats must be a JSON array of distinct supported formats')
          if fmts and 'linux-x86_64' not in platforms:
              sys.exit('linux-package-formats requires linux-x86_64 in platforms')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('formats='+json.dumps(sorted(fmts), separators=(',', ':'))+'\n')
          PY

  build:
    needs: [admit-app, git-sources, select-platforms]
    if: needs.admit-app.outputs.ok == 'true' && github.ref == 'refs/heads/main' && contains(fromJSON(needs.select-platforms.outputs.platforms), 'windows-x86_64')
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      unsigned-sha256: ${{ steps.seal.outputs.unsigned-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind immutable defining workflow before any shared code
        shell: pwsh
        env:
          DEFINING_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_SHA: ${{ job.workflow_sha }}
        run: |
          python -I -B -c "import os,re; p=os.environ['TOOLING_REVISION']; assert re.fullmatch('[0-9a-f]{40}',p) and p!='0'*40; assert os.environ['DEFINING_REPOSITORY']=='storytold/craft-common-actions'; assert os.environ['DEFINING_SHA']==p"
          if ($LASTEXITCODE -ne 0) { throw 'unreviewed defining workflow' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nightly-tools
          persist-credentials: false
      - name: Prepare exact original-run identity without editing source
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ((git -C .nightly-tools rev-parse HEAD) -cne $env:TOOLING_REVISION) { throw 'tooling checkout differs' }
          python -I -B .nightly-tools/scripts/nightly_release_entry.py main-plan --platform windows-x86_64 --output .unsigned-plan
          if ($LASTEXITCODE -ne 0) { throw 'unsigned producer identity refused' }
      - uses: storytold/craft-common-actions/actions/checkout-craft-fonts@f5141455aac7b2eb4708aa259d8ffcdf10fde939
        with:
          ref: ${{ inputs.craft-fonts-ref }}
      - uses: storytold/craft-common-actions/actions/checkout-craft-i18n@f5141455aac7b2eb4708aa259d8ffcdf10fde939
      - id: rust
        uses: storytold/craft-common-actions/actions/rust-channel@f5141455aac7b2eb4708aa259d8ffcdf10fde939
        with:
          targets: x86_64-pc-windows-msvc
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          targets: ${{ steps.rust.outputs.targets }}
          components: ${{ steps.rust.outputs.components }}
      # No platform secrets, environment, OIDC permission, cache, or version mutation.
      - name: Compile unsigned package only
        shell: pwsh
        env:
          NIGHTLY_VERSION: ${{ steps.plan.outputs.version }}
          NIGHTLY_SOURCE_COMMIT: ${{ steps.plan.outputs.source-commit }}
          NIGHTLY_BUILD_DATE: ${{ steps.plan.outputs.build-date }}
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: '1'
          DIST: dist
        run: |
          # The app's own <PREFIX>_BUILD_CHANNEL/VERSION/BUILD_SHA/BUILD_DATE, for this step only.
          $identity = python -I -B .nightly-tools/scripts/nightly_app.py env --app-name $env:NIGHTLY_APP --version $env:NIGHTLY_VERSION --sha $env:NIGHTLY_SOURCE_COMMIT --date $env:NIGHTLY_BUILD_DATE
          if ($LASTEXITCODE -ne 0) { throw 'nightly build identity refused' }
          foreach ($line in $identity) { $name, $value = $line -split '=', 2; Set-Item -LiteralPath "env:$name" -Value $value }
          pwsh -NoProfile -File packaging/windows/package.ps1 -Arch x64 -Nightly -BuildOnly
          if ($LASTEXITCODE -ne 0) { throw 'unsigned compiler failed' }
      - name: Smoke only in the credentialless compiler job
        shell: pwsh
        env:
          EXACT_VERSION: ${{ steps.plan.outputs.version }}
          EXACT_ASSET: ${{ steps.plan.outputs.unsigned-asset }}
        run: |
          $unpack = Join-Path $env:RUNNER_TEMP 'nightly-compiler-smoke'
          $profile = Join-Path $env:RUNNER_TEMP 'nightly-compiler-profile'
          Expand-Archive -LiteralPath (Join-Path 'dist' $env:EXACT_ASSET) -DestinationPath $unpack
          $gui = python -I -B .nightly-tools/scripts/nightly_app.py path --app-name $env:NIGHTLY_APP --platform windows-x86_64 --kind binary
          if ($LASTEXITCODE -ne 0) { throw 'no reviewed Windows GUI name' }
          python -B .nightly-tools/scripts/nightly_smoke.py --app $env:NIGHTLY_APP --executable (Join-Path $unpack $gui) --profile-root $profile --version $env:EXACT_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'unsigned GUI smoke failed' }
      - name: Seal only the exact unsigned compiler bytes
        id: seal
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -I -B .nightly-tools/scripts/nightly_release_entry.py main-seal --platform windows-x86_64 --directory dist --plan .unsigned-plan/plan.json --output .unsigned-handoff
          if ($LASTEXITCODE -ne 0) { throw 'compiler handoff refused' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: nightly-unsigned-windows-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: .unsigned-handoff/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    outputs:
      unsigned-sha256: ${{ steps.subject.outputs.unsigned-sha256 }}
    steps:
      # Fresh runner: no app checkout, hooks, payload execution or restored cache.
      - name: Bind defining workflow without loading application code
        env:
          DEFINING_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_SHA: ${{ job.workflow_sha }}
        run: |
          python3 -I -B -c "import os,re; p=os.environ['TOOLING_REVISION']; assert re.fullmatch('[0-9a-f]{40}',p) and p!='0'*40; assert os.environ['DEFINING_REPOSITORY']=='storytold/craft-common-actions'; assert os.environ['DEFINING_SHA']==p"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nightly-tools
          persist-credentials: false
      - name: Require the actual compiler artifact ID and independent compiler hash
        env:
          COMPILER_ARTIFACT: ${{ needs.build.outputs.artifact-id }}
          COMPILER_SHA256: ${{ needs.build.outputs.unsigned-sha256 }}
        run: |
          test "$(git -C .nightly-tools rev-parse HEAD)" = "$TOOLING_REVISION"
          python3 -B .nightly-tools/scripts/nightly_artifacts.py download-contract --artifact-id "$COMPILER_ARTIFACT" --expected-sha256 "$COMPILER_SHA256"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: .unsigned
          merge-multiple: true
          digest-mismatch: error
      - name: Independently hash the exact compiler payload and recompute its source identity
        id: subject
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMPILER_SHA256: ${{ needs.build.outputs.unsigned-sha256 }}
        run: |
          python3 -I -B .nightly-tools/scripts/nightly_release_entry.py main-subject --platform windows-x86_64 --directory .unsigned
      - name: Attest actual independently hashed unsigned payload, never a caller digest
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f
        with:
          subject-path: ${{ steps.subject.outputs.subject-path }}
  build-macos:
    needs: [admit-app, git-sources, select-platforms]
    if: needs.admit-app.outputs.ok == 'true' && github.ref == 'refs/heads/main' && contains(fromJSON(needs.select-platforms.outputs.platforms), 'macos-aarch64')
    # Same larger Arm runner as the stable macOS build; no secrets, environment, OIDC or cache.
    runs-on: macos-15-xlarge
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      unsigned-sha256: ${{ steps.seal.outputs.unsigned-sha256 }}
    steps:
      - name: Select Python for nightly helpers
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind immutable defining workflow before any shared code
        shell: bash
        env:
          DEFINING_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_SHA: ${{ job.workflow_sha }}
        run: |
          python3 -I -B -c "import os,re; p=os.environ['TOOLING_REVISION']; assert re.fullmatch('[0-9a-f]{40}',p) and p!='0'*40; assert os.environ['DEFINING_REPOSITORY']=='storytold/craft-common-actions'; assert os.environ['DEFINING_SHA']==p"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nightly-tools
          persist-credentials: false
      - name: Prepare exact original-run identity without editing source
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C .nightly-tools rev-parse HEAD)" = "$TOOLING_REVISION"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = arm64
          python3 -I -B .nightly-tools/scripts/nightly_release_entry.py main-plan --platform macos-aarch64 --output .unsigned-plan
      - uses: storytold/craft-common-actions/actions/checkout-craft-fonts@f5141455aac7b2eb4708aa259d8ffcdf10fde939
        with:
          ref: ${{ inputs.craft-fonts-ref }}
      - uses: storytold/craft-common-actions/actions/checkout-craft-i18n@f5141455aac7b2eb4708aa259d8ffcdf10fde939
      - id: rust
        uses: storytold/craft-common-actions/actions/rust-channel@f5141455aac7b2eb4708aa259d8ffcdf10fde939
        with:
          targets: aarch64-apple-darwin
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          targets: ${{ steps.rust.outputs.targets }}
          components: ${{ steps.rust.outputs.components }}
      # No platform secrets, environment, OIDC permission, cache, or version mutation.
      # The app-owned script builds the GUI-only nightly app; Developer ID comes later.
      - name: Compile unsigned package only
        shell: bash
        env:
          NIGHTLY_VERSION: ${{ steps.plan.outputs.version }}
          NIGHTLY_SOURCE_COMMIT: ${{ steps.plan.outputs.source-commit }}
          NIGHTLY_BUILD_DATE: ${{ steps.plan.outputs.build-date }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/nightly-targets
          DIST: ${{ runner.temp }}/nightly-dist/macos-aarch64
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: '1'
        run: |
          set -euo pipefail
          # The app's own <PREFIX>_BUILD_CHANNEL/VERSION/BUILD_SHA/BUILD_DATE, for this step only.
          identity="$(python3 -I -B .nightly-tools/scripts/nightly_app.py env --app-name "$NIGHTLY_APP" --export \
            --version "$NIGHTLY_VERSION" --sha "$NIGHTLY_SOURCE_COMMIT" --date "$NIGHTLY_BUILD_DATE")"
          eval "$identity"
          bash packaging/macos/nightly.sh --arch aarch64
      - name: Smoke only in the credentialless compiler job
        shell: bash
        env:
          EXACT_VERSION: ${{ steps.plan.outputs.version }}
          BUILT_ASSET: ${{ steps.plan.outputs.built-asset }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/nightly-dist/macos-aarch64/$BUILT_ASSET"
          python3 -B .nightly-tools/scripts/nightly_unix.py inventory --app "$NIGHTLY_APP" \
            --platform macos-aarch64 --version "$EXACT_VERSION" --archive "$archive"
          python3 -B .nightly-tools/scripts/nightly_unix.py unpack-private --app "$NIGHTLY_APP" \
            --platform macos-aarch64 --version "$EXACT_VERSION" --archive "$archive" \
            --output "$RUNNER_TEMP/nightly-compiler-smoke"
          gui="$(python3 -I -B .nightly-tools/scripts/nightly_app.py path --app-name "$NIGHTLY_APP" --platform macos-aarch64 --kind binary)"
          python3 -B .nightly-tools/scripts/nightly_smoke.py --app "$NIGHTLY_APP" \
            --executable "$RUNNER_TEMP/nightly-compiler-smoke/$gui" \
            --profile-root "$RUNNER_TEMP/nightly-compiler-profile" --version "$EXACT_VERSION"
      - name: Seal only the exact unsigned compiler bytes
        id: seal
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B .nightly-tools/scripts/nightly_release_entry.py main-seal --platform macos-aarch64 --directory "$RUNNER_TEMP/nightly-dist/macos-aarch64" --plan .unsigned-plan/plan.json --output .unsigned-handoff
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: nightly-unsigned-macos-aarch64-${{ github.run_id }}-${{ github.run_attempt }}
          path: .unsigned-handoff/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  attest-macos:
    needs: build-macos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      # Fresh runner: no app checkout, hooks, payload execution or restored cache.
      - name: Bind defining workflow without loading application code
        env:
          DEFINING_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_SHA: ${{ job.workflow_sha }}
        run: |
          python3 -I -B -c "import os,re; p=os.environ['TOOLING_REVISION']; assert re.fullmatch('[0-9a-f]{40}',p) and p!='0'*40; assert os.environ['DEFINING_REPOSITORY']=='storytold/craft-common-actions'; assert os.environ['DEFINING_SHA']==p"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nightly-tools
          persist-credentials: false
      - name: Require the actual compiler artifact ID and independent compiler hash
        env:
          COMPILER_ARTIFACT: ${{ needs.build-macos.outputs.artifact-id }}
          COMPILER_SHA256: ${{ needs.build-macos.outputs.unsigned-sha256 }}
        run: |
          test "$(git -C .nightly-tools rev-parse HEAD)" = "$TOOLING_REVISION"
          python3 -B .nightly-tools/scripts/nightly_artifacts.py download-contract --artifact-id "$COMPILER_ARTIFACT" --expected-sha256 "$COMPILER_SHA256"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-macos.outputs.artifact-id }}
          path: .unsigned
          merge-multiple: true
          digest-mismatch: error
      - name: Independently hash the exact compiler payload and recompute its source identity
        id: subject
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMPILER_SHA256: ${{ needs.build-macos.outputs.unsigned-sha256 }}
        run: |
          python3 -I -B .nightly-tools/scripts/nightly_release_entry.py main-subject --platform macos-aarch64 --directory .unsigned
      - name: Attest actual independently hashed unsigned payload, never a caller digest
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f
        with:
          subject-path: ${{ steps.subject.outputs.subject-path }}
  build-linux:
    # Linux joins the same producer run as Windows (one release, every admitted platform).
    # Off unless the caller lists linux-x86_64; no secrets, environment, OIDC, cache or version mutation.
    needs: [admit-app, git-sources, select-platforms]
    if: contains(fromJSON(needs.select-platforms.outputs.platforms), 'linux-x86_64') && needs.admit-app.outputs.ok == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      unsigned-sha256: ${{ steps.seal.outputs.unsigned-sha256 }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - name: Select Python for nightly helpers
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind immutable defining workflow before any shared code
        env:
          DEFINING_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_SHA: ${{ job.workflow_sha }}
        run: |
          python3 -I -B -c "import os,re; p=os.environ['TOOLING_REVISION']; assert re.fullmatch('[0-9a-f]{40}',p) and p!='0'*40; assert os.environ['DEFINING_REPOSITORY']=='storytold/craft-common-actions'; assert os.environ['DEFINING_SHA']==p"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nightly-tools
          persist-credentials: false
      - name: Prepare exact original-run identity without editing source
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C .nightly-tools rev-parse HEAD)" = "$TOOLING_REVISION"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = x86_64
          python3 -I -B .nightly-tools/scripts/nightly_release_entry.py main-plan --platform linux-x86_64 --output .unsigned-plan
      - uses: storytold/craft-common-actions/actions/checkout-craft-fonts@f5141455aac7b2eb4708aa259d8ffcdf10fde939
        with:
          ref: ${{ inputs.craft-fonts-ref }}
      - uses: storytold/craft-common-actions/actions/checkout-craft-i18n@f5141455aac7b2eb4708aa259d8ffcdf10fde939
      - uses: storytold/craft-common-actions/actions/install-linux-deps@f5141455aac7b2eb4708aa259d8ffcdf10fde939
        with:
          deb-arch: amd64
          nfpm-version: 2.47.0
      - id: rust
        uses: storytold/craft-common-actions/actions/rust-channel@f5141455aac7b2eb4708aa259d8ffcdf10fde939
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          targets: ${{ steps.rust.outputs.targets }}
          components: ${{ steps.rust.outputs.components }}
      - name: Compile unsigned package only
        env:
          NIGHTLY_VERSION: ${{ steps.plan.outputs.version }}
          NIGHTLY_SOURCE_COMMIT: ${{ steps.plan.outputs.source-commit }}
          NIGHTLY_BUILD_DATE: ${{ steps.plan.outputs.build-date }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/nightly-targets
          DIST: ${{ runner.temp }}/nightly-dist/linux-x86_64
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: '1'
        run: |
          set -euo pipefail
          # The app's own <PREFIX>_BUILD_CHANNEL/VERSION/BUILD_SHA/BUILD_DATE, for this step only.
          identity="$(python3 -I -B .nightly-tools/scripts/nightly_app.py env --app-name "$NIGHTLY_APP" --export \
            --version "$NIGHTLY_VERSION" --sha "$NIGHTLY_SOURCE_COMMIT" --date "$NIGHTLY_BUILD_DATE")"
          eval "$identity"
          bash packaging/linux/nightly.sh --arch x86_64
      - name: Inventory and smoke only in the credentialless compiler job
        env:
          EXACT_VERSION: ${{ steps.plan.outputs.version }}
          EXACT_ASSET: ${{ steps.plan.outputs.asset }}
        run: |
          set -euo pipefail
          python3 -B .nightly-tools/scripts/nightly_unix.py unpack-private \
            --app "$NIGHTLY_APP" --platform linux-x86_64 \
            --version "$EXACT_VERSION" --archive "$RUNNER_TEMP/nightly-dist/linux-x86_64/$EXACT_ASSET" \
            --output "$RUNNER_TEMP/nightly-compiler-smoke"
          # The ELF itself, in the Launcher's profile form; the tar's entrypoint may be a launcher script.
          gui="$(python3 -I -B .nightly-tools/scripts/nightly_app.py path --app-name "$NIGHTLY_APP" --platform linux-x86_64 --kind binary)"
          python3 -B .nightly-tools/scripts/nightly_smoke.py --app "$NIGHTLY_APP" \
            --executable "$RUNNER_TEMP/nightly-compiler-smoke/$gui" \
            --profile-root "$RUNNER_TEMP/nightly-compiler-profile" --version "$EXACT_VERSION"
      - name: Seal only the exact unsigned compiler bytes
        id: seal
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B .nightly-tools/scripts/nightly_release_entry.py main-seal --platform linux-x86_64 --directory "$RUNNER_TEMP/nightly-dist/linux-x86_64" --plan .unsigned-plan/plan.json --output .unsigned-handoff
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: nightly-unsigned-linux-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: .unsigned-handoff/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  attest-linux:
    needs: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    outputs:
      unsigned-sha256: ${{ steps.subject.outputs.unsigned-sha256 }}
    steps:
      # Fresh runner: no app checkout, hooks, payload execution or restored cache.
      - name: Bind defining workflow without loading application code
        env:
          DEFINING_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_SHA: ${{ job.workflow_sha }}
        run: |
          python3 -I -B -c "import os,re; p=os.environ['TOOLING_REVISION']; assert re.fullmatch('[0-9a-f]{40}',p) and p!='0'*40; assert os.environ['DEFINING_REPOSITORY']=='storytold/craft-common-actions'; assert os.environ['DEFINING_SHA']==p"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nightly-tools
          persist-credentials: false
      - name: Require the actual compiler artifact ID and independent compiler hash
        env:
          COMPILER_ARTIFACT: ${{ needs.build-linux.outputs.artifact-id }}
          COMPILER_SHA256: ${{ needs.build-linux.outputs.unsigned-sha256 }}
        run: |
          test "$(git -C .nightly-tools rev-parse HEAD)" = "$TOOLING_REVISION"
          python3 -B .nightly-tools/scripts/nightly_artifacts.py download-contract --artifact-id "$COMPILER_ARTIFACT" --expected-sha256 "$COMPILER_SHA256"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-linux.outputs.artifact-id }}
          path: .unsigned
          merge-multiple: true
          digest-mismatch: error
      - name: Independently hash the exact compiler payload and recompute its source identity
        id: subject
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMPILER_SHA256: ${{ needs.build-linux.outputs.unsigned-sha256 }}
        run: python3 -I -B .nightly-tools/scripts/nightly_release_entry.py main-subject --platform linux-x86_64 --directory .unsigned
      - name: Attest actual independently hashed unsigned payload, never a caller digest
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f
        with:
          subject-path: ${{ steps.subject.outputs.subject-path }}

  build-linux-packages:
    name: Linux packages ${{ matrix.arch }}
    needs: [admit-app, git-sources, select-platforms]
    if: contains(fromJSON(needs.select-platforms.outputs.platforms), 'linux-x86_64') && needs.select-platforms.outputs.linux-package-formats != '[]' && needs.admit-app.outputs.ok == 'true' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, deb: amd64, target: x86_64-unknown-linux-gnu }
          - { arch: aarch64, runner: ubuntu-22.04-arm, deb: arm64, target: aarch64-unknown-linux-gnu }
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - name: Select Python for nightly helpers
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind immutable defining workflow before any shared code
        env:
          DEFINING_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_SHA: ${{ job.workflow_sha }}
        run: |
          python3 -I -B -c "import os,re; p=os.environ['TOOLING_REVISION']; assert re.fullmatch('[0-9a-f]{40}',p) and p!='0'*40; assert os.environ['DEFINING_REPOSITORY']=='storytold/craft-common-actions'; assert os.environ['DEFINING_SHA']==p"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nightly-tools
          persist-credentials: false
      - name: Prepare exact original-run identity
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C .nightly-tools rev-parse HEAD)" = "$TOOLING_REVISION"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -I -B .nightly-tools/scripts/nightly_release_entry.py main-plan --platform linux-x86_64 --output .unsigned-plan
      - name: Derive the app's nightly Linux package names
        id: names
        env:
          APP_NAME: ${{ inputs.app-name }}
        run: python3 -I -B .nightly-tools/scripts/nightly_app.py names --app-name "$APP_NAME" >> "$GITHUB_OUTPUT"
      - name: Export the app's build variables
        uses: storytold/craft-common-actions/actions/export-app-build-env@f5141455aac7b2eb4708aa259d8ffcdf10fde939
        with:
          app-name: ${{ inputs.app-name }}
          version: ${{ steps.plan.outputs.version }}
          date: ${{ steps.plan.outputs.build-date }}
      - uses: storytold/craft-common-actions/actions/checkout-craft-fonts@f5141455aac7b2eb4708aa259d8ffcdf10fde939
        with:
          ref: ${{ inputs.craft-fonts-ref }}
      - uses: storytold/craft-common-actions/actions/checkout-craft-i18n@f5141455aac7b2eb4708aa259d8ffcdf10fde939
      - uses: storytold/craft-common-actions/actions/install-linux-deps@f5141455aac7b2eb4708aa259d8ffcdf10fde939
        with:
          deb-arch: ${{ matrix.deb }}
          nfpm-version: 2.47.0
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils librsvg2-common skopeo
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - id: rust
        uses: storytold/craft-common-actions/actions/rust-channel@f5141455aac7b2eb4708aa259d8ffcdf10fde939
        with:
          targets: ${{ matrix.target }}
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          targets: ${{ steps.rust.outputs.targets }}
          components: ${{ steps.rust.outputs.components }}
      - name: Build and package (AppImage, deb, rpm, tar.gz) in isolated nightly mode
        env:
          NIGHTLY_VERSION: ${{ steps.plan.outputs.version }}
          NIGHTLY_SOURCE_COMMIT: ${{ steps.plan.outputs.source-commit }}
          NIGHTLY_BUILD_DATE: ${{ steps.plan.outputs.build-date }}
          LINUX_PACKAGE_FORMATS: ${{ needs.select-platforms.outputs.linux-package-formats }}
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: '1'
        run: |
          set -euo pipefail
          # The app's own <PREFIX>_BUILD_CHANNEL/VERSION/BUILD_SHA/BUILD_DATE, for this step only.
          identity="$(python3 -I -B .nightly-tools/scripts/nightly_app.py env --app-name "$NIGHTLY_APP" --export --with-override \
            --version "$NIGHTLY_VERSION" --sha "$NIGHTLY_SOURCE_COMMIT" --date "$NIGHTLY_BUILD_DATE")"
          eval "$identity"
          pkg_formats="$(python3 -I -B -c "import json,os; fmts=set(json.loads(os.environ['LINUX_PACKAGE_FORMATS'])); out=[f for f in ('appimage','deb','rpm') if f in fmts]; out.append('tar'); print(' '.join(out))")"
          arch_tar_args=()
          if python3 -I -B -c "import json,os,sys; sys.exit(0 if 'arch' in json.loads(os.environ['LINUX_PACKAGE_FORMATS']) else 1)"; then
            # This private handoff contains the Arch-only launcher; other formats use dist/release.
            arch_tar_args=(--arch-tar-dir dist/arch-nightly)
          fi
          packaging/linux/package.sh --formats "$pkg_formats" "${arch_tar_args[@]}"
      - name: Build Flatpak bundle and OCI layout
        if: contains(fromJSON(needs.select-platforms.outputs.linux-package-formats), 'flatpak') || contains(fromJSON(needs.select-platforms.outputs.linux-package-formats), 'oci')
        env:
          NIGHTLY_VERSION: ${{ steps.plan.outputs.version }}
          NIGHTLY_SOURCE_COMMIT: ${{ steps.plan.outputs.source-commit }}
          NIGHTLY_BUILD_DATE: ${{ steps.plan.outputs.build-date }}
          VERSION: ${{ steps.plan.outputs.version }}
          ARCH: ${{ matrix.arch }}
          LINUX_PACKAGE_FORMATS: ${{ needs.select-platforms.outputs.linux-package-formats }}
          APP_NAME: ${{ inputs.app-name }}
        run: |
          set -euo pipefail
          # The app's own <PREFIX>_BUILD_CHANNEL/VERSION/BUILD_SHA/BUILD_DATE, for this step only.
          identity="$(python3 -I -B .nightly-tools/scripts/nightly_app.py env --app-name "$NIGHTLY_APP" --export \
            --version "$NIGHTLY_VERSION" --sha "$NIGHTLY_SOURCE_COMMIT" --date "$NIGHTLY_BUILD_DATE")"
          eval "$identity"
          shopt -s nullglob
          tarballs=()
          for f in dist/release/*-"${VERSION}"-linux-"${ARCH}".tar.gz; do
            case "${f##*/}" in *-cli-*|*-server-*) ;; *) tarballs+=("$f") ;; esac
          done
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::expected one app tarball for ${VERSION} in dist/release, found ${#tarballs[@]}: ${tarballs[*]}"
            exit 1
          fi
          base="$(basename "${tarballs[0]}" .tar.gz)"
          if python3 -I -B -c "import json,os,sys; sys.exit(0 if 'oci' in json.loads(os.environ['LINUX_PACKAGE_FORMATS']) else 1)"; then
            test -x packaging/linux/flatpak-oci.sh || { echo "::error::packaging/linux/flatpak-oci.sh is missing or not executable"; exit 1; }
            packaging/linux/flatpak-oci.sh "${tarballs[0]}"
            test -d "dist/release/$base-oci" || { echo "::error::expected OCI layout dist/release/$base-oci not found"; exit 1; }
            ref_label="$(python3 -I -B - "dist/release/$base-oci" "dist/release/$base.oci-manifest.json" <<'PY'
          import hashlib, json, pathlib, shutil, sys
          layout, out = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          index = json.loads((layout / "index.json").read_text(encoding="utf-8"))
          manifests = index.get("manifests", [])
          assert len(manifests) == 1, f"expected 1 OCI manifest, got {len(manifests)}"
          digest = manifests[0]["digest"]
          assert digest.startswith("sha256:") and len(digest) == 71
          blob = layout / "blobs" / "sha256" / digest.split(":", 1)[1]
          shutil.copyfile(blob, out)
          assert hashlib.sha256(out.read_bytes()).hexdigest() == digest.split(":", 1)[1]
          manifest_obj = json.loads(blob.read_bytes())
          cfg_hex = manifest_obj["config"]["digest"].split(":", 1)[1]
          cfg_obj = json.loads((layout / "blobs" / "sha256" / cfg_hex).read_bytes())
          print(cfg_obj.get("config", {}).get("Labels", {}).get("org.flatpak.ref", ""))
          PY
            )"
            # The nightly Flatpak app ID comes from the app name, never a hard-coded app.
            python3 -I -B .nightly-tools/scripts/nightly_app.py check --app-name "$APP_NAME" --kind flatpak --value "$ref_label"
            if python3 -I -B -c "import json,os,sys; sys.exit(0 if 'flatpak' not in json.loads(os.environ['LINUX_PACKAGE_FORMATS']) else 1)"; then
              rm -f "dist/release/$base.flatpak"
            fi
          else
            packaging/linux/flatpak-bundle.sh --no-test "${tarballs[0]}"
          fi
          if python3 -I -B -c "import json,os,sys; sys.exit(0 if 'flatpak' in json.loads(os.environ['LINUX_PACKAGE_FORMATS']) else 1)"; then
            test -f "dist/release/$base.flatpak" && test -s "dist/release/$base.flatpak" || {
              echo "::error::expected Flatpak bundle dist/release/$base.flatpak not found or empty"
              exit 1
            }
          fi
      - name: Find tarball for Arch package
        id: tarball
        if: contains(fromJSON(needs.select-platforms.outputs.linux-package-formats), 'arch')
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          shopt -s nullglob
          tarballs=()
          for f in dist/arch-nightly/*-"${VERSION}"-linux-"${ARCH}".tar.gz; do
            case "${f##*/}" in *-cli-*|*-server-*) ;; *) tarballs+=("$f") ;; esac
          done
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::expected one app tarball for ${VERSION} in dist/arch-nightly, found ${#tarballs[@]}: ${tarballs[*]}"
            exit 1
          fi
          echo "path=${tarballs[0]}" >> "$GITHUB_OUTPUT"
      - name: Build x86_64 Arch package with reviewed tooling revision and smoke-test side-by-side install
        if: matrix.arch == 'x86_64' && contains(fromJSON(needs.select-platforms.outputs.linux-package-formats), 'arch')
        env:
          TARBALL: ${{ steps.tarball.outputs.path }}
          TARGET_ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.plan.outputs.version }}
          GITHUB_ACTION_PATH: ${{ github.workspace }}/.nightly-tools/actions/arch-package
          APP: ${{ steps.names.outputs.app }}
          ARCH_PKG: ${{ steps.names.outputs.arch }}
          ARCH_STABLE_PKG: ${{ steps.names.outputs.arch-stable }}
        run: |
          set -euo pipefail
          bash .nightly-tools/actions/arch-package/run.sh
          smoke_dir="$(mktemp -d .arch-side-by-side.XXXXXX)"
          trap 'rm -rf "$PWD/$smoke_dir"' EXIT
          # The container's non-root builder has a different UID from the runner.
          chmod 0755 "$smoke_dir"
          # The stable fixture must use the ordinary payload, not the Arch nightly launcher.
          cp "dist/release/${APP}-${VERSION}-linux-x86_64.tar.gz" "$smoke_dir/${APP}-0.0.1-linux-x86_64.tar.gz"
          chmod 0644 "$smoke_dir/${APP}-0.0.1-linux-x86_64.tar.gz"
          TARBALL="$smoke_dir/${APP}-0.0.1-linux-x86_64.tar.gz" \
            TARGET_ARCH="x86_64" \
            OUTPUT_DIR="$smoke_dir/out" \
            PKGREL="1" \
            ARCH_LICENSE="LicenseRef-Proprietary" \
            bash .nightly-tools/actions/arch-package/run.sh
          cp "dist/release/${APP}-${VERSION}-linux-x86_64.pkg.tar.zst" "$smoke_dir/out/"
          docker run --rm -v "$PWD/$smoke_dir/out:/pkgs:ro" -e APP -e ARCH_PKG -e ARCH_STABLE_PKG \
            archlinux:base-devel@sha256:949ecb1661609ab7e8f6854ba03efd62792e7a796313738e94b040c095c20d91 \
            bash -euxc 'pacman -U --noconfirm --assume-installed glibc=2.39 --assume-installed gcc-libs=14.1 --assume-installed hicolor-icon-theme=0.18 --assume-installed libxkbcommon=1.7 --assume-installed libxkbcommon-x11=1.7 --assume-installed vulkan-icd-loader=1.3 "/pkgs/$APP-0.0.1-linux-x86_64.pkg.tar.zst" /pkgs/"$APP"-*-nightly.*-linux-x86_64.pkg.tar.zst && pacman -Qi "$ARCH_STABLE_PKG" "$ARCH_PKG" && test -x "/usr/bin/$APP" && test -x "/usr/bin/$APP-nightly"'
          rm -rf "$smoke_dir"
          trap - EXIT
      - name: Upload aarch64 tarball handoff for Arch package job
        if: matrix.arch == 'aarch64' && contains(fromJSON(needs.select-platforms.outputs.linux-package-formats), 'arch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-linux-arch-aarch64-tarball-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.tarball.outputs.path }}
          if-no-files-found: error
          retention-days: 14
      - name: Smoke-test x86_64 nightly binary channel isolation before removing tarball
        if: matrix.arch == 'x86_64'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          APP: ${{ steps.names.outputs.app }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pkg-smoke"
          tar -xzf dist/release/"${APP}"-"${VERSION}"-linux-x86_64.tar.gz -C "$RUNNER_TEMP/pkg-smoke" --strip-components=1
          python3 -B .nightly-tools/scripts/nightly_smoke.py --app "$NIGHTLY_APP" \
            --executable "$RUNNER_TEMP/pkg-smoke/bin/${APP}" \
            --profile-root "$RUNNER_TEMP/pkg-smoke-profile" --version "$VERSION"
      - name: Remove duplicate unsigned tarballs after packaging
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          shopt -s nullglob
          rm -f dist/release/*-"${VERSION}"-linux-"${ARCH}".tar.gz
      - name: Verify built Linux package versions and nightly identities
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          ARCH: ${{ matrix.arch }}
          APP_NAME: ${{ inputs.app-name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          names=(python3 -I -B .nightly-tools/scripts/nightly_app.py check --app-name "$APP_NAME")
          for f in dist/release/*; do
            name="$(basename "$f")"
            case "$name" in
              *-"${VERSION}"-linux-"${ARCH}".deb)
                value="$(dpkg-deb -f "$f" Package)" || { echo "::error::could not read the deb Package of $name"; exit 1; }
                "${names[@]}" --kind deb --value "$value" || { echo "::error::$name has the wrong deb Package"; exit 1; }
                ;;
              *-"${VERSION}"-linux-"${ARCH}".rpm)
                value="$(rpm -qp --qf '%{NAME}' "$f")" || { echo "::error::could not read the rpm Name of $name"; exit 1; }
                "${names[@]}" --kind rpm --value "$value" || { echo "::error::$name has the wrong rpm Name"; exit 1; }
                ;;
              *-"${VERSION}"-linux-"${ARCH}".pkg.tar.zst)
                # A separate assignment keeps pipefail: a read or decompression error after partial output refuses.
                value="$(tar --zstd -xOf "$f" .PKGINFO | sed -n 's/^pkgname = //p')" || { echo "::error::could not read .PKGINFO of $name"; exit 1; }
                "${names[@]}" --kind arch --value "$value" || { echo "::error::$name has the wrong pkgname"; exit 1; }
                ;;
              *-"${VERSION}"-linux-"${ARCH}".*) ;;
              *-"${VERSION}"-linux-"${ARCH}"-oci) ;;
              *) echo "::error::unexpected package or version mismatch in $name (expected *-${VERSION}-linux-${ARCH}.*)"; exit 1 ;;
            esac
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.arch == 'x86_64' || needs.select-platforms.outputs.linux-package-formats != '["arch"]'
        with:
          name: nightly-linux-packages-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  build-linux-arch-arm:
    name: Arch Linux aarch64
    needs: [admit-app, select-platforms, build-linux-packages]
    if: contains(fromJSON(needs.select-platforms.outputs.platforms), 'linux-x86_64') && contains(fromJSON(needs.select-platforms.outputs.linux-package-formats), 'arch') && needs.admit-app.outputs.ok == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind immutable defining workflow before shared packaging code
        env:
          DEFINING_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_SHA: ${{ job.workflow_sha }}
        run: |
          python3 -I -B -c "import os,re; p=os.environ['TOOLING_REVISION']; assert re.fullmatch('[0-9a-f]{40}',p) and p!='0'*40; assert os.environ['DEFINING_REPOSITORY']=='storytold/craft-common-actions'; assert os.environ['DEFINING_SHA']==p"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nightly-tools
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-linux-arch-aarch64-tarball-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/linux
          if-no-files-found: error
          digest-mismatch: error
      - name: Find aarch64 tarball
        id: tarball
        run: |
          test "$(git -C .nightly-tools rev-parse HEAD)" = "$TOOLING_REVISION"
          shopt -s nullglob
          tarballs=()
          for f in dist/linux/*-linux-aarch64.tar.gz; do
            case "${f##*/}" in *-cli-*|*-server-*) ;; *) tarballs+=("$f") ;; esac
          done
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::expected one aarch64 tarball in dist/linux, found ${#tarballs[@]}: ${tarballs[*]}"
            exit 1
          fi
          echo "path=${tarballs[0]}" >> "$GITHUB_OUTPUT"
      - name: Build aarch64 Arch package with reviewed tooling revision
        env:
          TARBALL: ${{ steps.tarball.outputs.path }}
          TARGET_ARCH: aarch64
          GITHUB_ACTION_PATH: ${{ github.workspace }}/.nightly-tools/actions/arch-package
          APP_NAME: ${{ inputs.app-name }}
        run: |
          set -euo pipefail
          bash .nightly-tools/actions/arch-package/run.sh
          for f in dist/release/*.pkg.tar.zst; do
            # A separate assignment keeps pipefail: a read or decompression error after partial output refuses.
            value="$(tar --zstd -xOf "$f" .PKGINFO | sed -n 's/^pkgname = //p')" || { echo "::error::could not read .PKGINFO of $f"; exit 1; }
            python3 -I -B .nightly-tools/scripts/nightly_app.py check --app-name "$APP_NAME" \
              --kind arch --value "$value" || { echo "::error::$f has the wrong pkgname"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-linux-arch-aarch64-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

  attest-linux-packages:
    needs: [admit-app, select-platforms, build-linux-packages, build-linux-arch-arm]
    if: >-
      !cancelled() && contains(fromJSON(needs.select-platforms.outputs.platforms), 'linux-x86_64') &&
      needs.select-platforms.outputs.linux-package-formats != '[]' &&
      needs.build-linux-packages.result == 'success' &&
      (!contains(fromJSON(needs.select-platforms.outputs.linux-package-formats), 'arch') || needs.build-linux-arch-arm.result == 'success') &&
      needs.admit-app.outputs.ok == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      # Fresh runner: no app checkout, hooks, payload execution or restored cache.
      - name: Bind defining workflow without loading application code
        env:
          DEFINING_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_SHA: ${{ job.workflow_sha }}
        run: |
          python3 -I -B -c "import os,re; p=os.environ['TOOLING_REVISION']; assert re.fullmatch('[0-9a-f]{40}',p) and p!='0'*40; assert os.environ['DEFINING_REPOSITORY']=='storytold/craft-common-actions'; assert os.environ['DEFINING_SHA']==p"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nightly-tools
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-linux-packages-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: .linux-packages
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: >-
          contains(fromJSON(needs.select-platforms.outputs.linux-package-formats), 'deb') ||
          contains(fromJSON(needs.select-platforms.outputs.linux-package-formats), 'rpm') ||
          contains(fromJSON(needs.select-platforms.outputs.linux-package-formats), 'appimage') ||
          contains(fromJSON(needs.select-platforms.outputs.linux-package-formats), 'flatpak') ||
          contains(fromJSON(needs.select-platforms.outputs.linux-package-formats), 'oci')
        with:
          name: nightly-linux-packages-aarch64-${{ github.run_id }}-${{ github.run_attempt }}
          path: .linux-packages
          merge-multiple: true
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: contains(fromJSON(needs.select-platforms.outputs.linux-package-formats), 'arch')
        with:
          name: nightly-linux-arch-aarch64-${{ github.run_id }}-${{ github.run_attempt }}
          path: .linux-packages
          merge-multiple: true
          digest-mismatch: error
      - name: Inventory Linux package payloads for attestation
        id: subject
        env:
          GH_TOKEN: ${{ github.token }}
          LINUX_PACKAGE_FORMATS: ${{ needs.select-platforms.outputs.linux-package-formats }}
        run: |
          test "$(git -C .nightly-tools rev-parse HEAD)" = "$TOOLING_REVISION"
          python3 -I -B .nightly-tools/scripts/nightly_release_entry.py main-packages-subject --platform linux-x86_64 --directory .linux-packages --formats "$LINUX_PACKAGE_FORMATS"
      - name: Attest Linux package payloads
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f
        with:
          subject-path: ${{ steps.subject.outputs.subject-path }}
