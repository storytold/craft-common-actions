name: "Nix"

on:
  workflow_call:
    inputs:
      extra-args:
        description: "Extra arguments to pass to nix flake check (shell-style quoting, no shell expansion)"
        type: string
        required: false
        default: "--no-build --all-systems"

permissions:
  contents: read

jobs:
  eval:
    name: eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Check flake evaluation
        shell: bash
        env:
          NIX_EXTRA_ARGS: ${{ inputs.extra-args }}
        run: |
          if [ -f flake.nix ]; then
            python3 - <<'PY'
          import os
          import shlex

          os.execvp("nix", ["nix", "flake", "check", *shlex.split(os.environ["NIX_EXTRA_ARGS"])])
          PY
          else
            echo "No flake.nix present in this repository; skipping check."
          fi
