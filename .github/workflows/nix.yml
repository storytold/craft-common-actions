name: "Nix"

on:
  workflow_call:
    inputs:
      extra-args:
        description: "Extra arguments to pass to nix flake check (shell-style quoting, no shell expansion)"
        type: string
        required: false
        default: "--no-build --all-systems"

permissions:
  contents: read

jobs:
  eval:
    name: eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Check flake evaluation
        shell: bash
        env:
          NIX_EXTRA_ARGS: ${{ inputs.extra-args }}
        run: |
          if [ -f flake.nix ]; then
            python3 - <<'PY'
          import os
          import shlex

          os.execvp("nix", ["nix", "flake", "check", *shlex.split(os.environ["NIX_EXTRA_ARGS"])])
          PY
          else
            echo "No flake.nix present in this repository; skipping check."
          fi
