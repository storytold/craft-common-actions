name: Native Cargo runner fixtures
on:
  pull_request:
    paths:
      - scripts/cargo_runner_fixture.py
      - tests/test_cargo_runner_fixture.py
      - .github/workflows/cargo-runner-fixtures.yml
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exercise Cargo runtime contract and synthetic failures
        run: |
          timeout 180s rustup toolchain install 1.100.0 --profile minimal
          export RUSTUP_TOOLCHAIN=1.100.0
          RUN_NATIVE_CARGO_FIXTURE=1 FIXTURE_EXPECTED_RUST_VERSION=1.100.0 python3 -m unittest discover -s tests -p test_cargo_runner_fixture.py -v
  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare the native fixture host
        uses: step-security/freebsd-vm@a2f5754275f7b0d5cea7f2762c9960727950f128
        with:
          release: '15.1'
          usesh: 'true'
          cpu: '4'
          mem: '12288'
          copyback: 'false'
          prepare: pkg install -y python3 curl
      - name: Exercise Cargo runtime contract and synthetic failures on FreeBSD
        shell: freebsd {0}
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 --retry 2 --connect-timeout 15 --max-time 60 -fsS https://sh.rustup.rs -o /tmp/fixture-install-rustup.sh
          timeout 180s sh /tmp/fixture-install-rustup.sh -y --profile minimal --default-toolchain 1.100.0 --no-modify-path
          export PATH="$HOME/.cargo/bin:$PATH" RUSTUP_TOOLCHAIN=1.100.0
          RUN_NATIVE_CARGO_FIXTURE=1 FIXTURE_EXPECTED_RUST_VERSION=1.100.0 python3 -m unittest discover -s tests -p test_cargo_runner_fixture.py -v
