name: Launcher qualification contract

on:
  workflow_call:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject incomplete or stale qualification evidence
        run: python3 -m unittest discover -s packaging/e2e -p 'test_*.py' -v
