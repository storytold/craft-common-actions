name: Private nightly Windows artifact

# Source-only E1-E5 candidate. This workflow only builds a same-run artifact.
# Deliberate extraction of the existing Windows setup, NOT a full release matrix.
on:
  workflow_call:
    secrets:
      WINDOWS_CERTIFICATE:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_SIGNING_ENDPOINT:
        required: false
      AZURE_SIGNING_ACCOUNT:
        required: false
      AZURE_CERT_PROFILE:
        required: false
    inputs:
      manual-actors:
        description: "Reviewed literal JSON logins in caller source; accidental-use guard only; empty disables manual runs and re-runs"
        type: string
        default: '[]'
      tooling-revision:
        description: "Reviewed published shared-tooling SHA; must match the app-owned publication policy"
        type: string
        required: true
      identity-artifact-id:
        type: string
        required: true
      identity-sha256:
        type: string
        required: true
      app-name:
        required: true
        type: string
      version:
        required: true
        type: string
      craft-fonts-ref:
        required: false
        type: string
        default: bfcbf714e45a3ea8e98f88ab2b7971372a576414
      production-signing:
        description: "Opt in to production-signed nightly artifacts (and their publication). Off unless the caller sets true; a caller existing is not consent to sign."
        type: boolean
        default: false
      windows-publisher-subject:
        description: "Reviewed literal exact Authenticode publisher subject in caller source (public); empty refuses Windows signing"
        type: string
        default: ''

    outputs:
      artifact-id:
        description: Exact immutable Windows upload ID from the producing job
        value: ${{ jobs.windows.outputs.artifact-id }}
      zip-sha256:
        description: Independent final signed ZIP SHA256 computed before upload
        value: ${{ jobs.windows.outputs.zip-sha256 }}
      asset:
        description: Exact producer-selected asset name
        value: ${{ jobs.windows.outputs.asset }}
      unsigned-sha256:
        description: Original unsigned build producer hash (not the publishable hash)
        value: ${{ jobs.windows.outputs.unsigned-sha256 }}
      receipt-artifact-id:
        value: ${{ jobs.windows.outputs.receipt-artifact-id }}
      receipt-sha256:
        value: ${{ jobs.windows.outputs.receipt-sha256 }}

permissions:
  contents: read

env:
  TOOLING_REVISION: ${{ inputs.tooling-revision }}
  NIGHTLY_REVIEWED_POLICY_SHA256: ${{ vars.NIGHTLY_REVIEWED_POLICY_SHA256 }}

jobs:
  signing-config:
    if: >-
      inputs.production-signing == true && inputs.app-name == 'photocraft' && github.repository == 'storytold/photocraft' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && github.run_attempt == '1') ||
       ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
        contains(fromJSON(inputs.manual-actors), github.triggering_actor)))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: nightly-signing
    permissions:
      contents: read
    steps:
      - name: Require signing configuration before any build (presence only)
        env:
          PFX_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID != '' }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID != '' }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT != '' }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT != '' }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE != '' }}
          PUBLISHER: ${{ inputs.windows-publisher-subject }}
        run: |
          python3 -I -B - <<'PY'
          import os
          pfx=os.environ['PFX_CERT']=='true' and os.environ['PFX_PASSWORD']=='true'
          azure=all(os.environ[name]=='true' for name in ('AZURE_TENANT_ID','AZURE_CLIENT_ID','AZURE_CLIENT_SECRET','AZURE_SIGNING_ENDPOINT','AZURE_SIGNING_ACCOUNT','AZURE_CERT_PROFILE'))
          assert pfx or (os.environ['PFX_CERT']!='true' and azure), 'complete PFX pair or Azure signing configuration required; no unsigned fallback'
          assert os.environ['PUBLISHER'] and not any(c in os.environ['PUBLISHER'] for c in '\r\n\0'), 'exact reviewed Windows publisher subject required'
          PY

  git-sources:
    needs: signing-config
    name: Git dependencies come from storytold
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Git dependencies come from storytold
        run: |
          set -euo pipefail
          test -f Cargo.lock || { echo "Cargo.lock is missing"; exit 1; }
          # Source replacement, patches and path overrides in cargo config never show up
          # in Cargo.lock. Parsed rather than grepped: TOML has many spellings of one key.
          # Cargo still reads the legacy .cargo/config.
          python3 - <<'PY'
          import os, sys, tomllib
          for path in (".cargo/config", ".cargo/config.toml"):
              if not os.path.exists(path):
                  continue
              config = tomllib.load(open(path, "rb"))
              replaced = [name for name, source in config.get("source", {}).items()
                          if isinstance(source, dict) and "replace-with" in source]
              if replaced or "patch" in config or "paths" in config:
                  print(f"{path} replaces, patches or overrides a source")
                  sys.exit(1)
          PY
          # Check locked git origins first: cargo metadata resolves and can fetch them.
          python3 - <<'PY'
          import sys, tomllib
          lock = tomllib.load(open("Cargo.lock", "rb"))
          bad = sorted({p["source"] for p in lock.get("package", [])
                        if p.get("source", "").startswith("git+")
                        and not p["source"].startswith("git+https://github.com/storytold/")})
          if bad:
              print("Git dependencies outside github.com/storytold:", *bad, sep="\n")
              sys.exit(1)
          PY
          # Fails when Cargo.lock is out of date with the manifests.
          cargo metadata --locked --format-version 1 > /dev/null


  build:
    if: >-
      inputs.app-name == 'photocraft' && github.repository == 'storytold/photocraft' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && github.run_attempt == '1') ||
       ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
        contains(fromJSON(inputs.manual-actors), github.triggering_actor)))
    needs: git-sources
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      zip-sha256: ${{ steps.seal.outputs.sha256 }}
      asset: ${{ steps.unsigned.outputs.asset }}
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Check out exact application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind app-reviewed tooling to the defining job before shared checkout
        shell: bash
        env:
          DEFINING_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          python -I -B - <<'PY'
          import json, os, pathlib, re
          pin=os.environ['TOOLING_REVISION']
          assert re.fullmatch('[0-9a-f]{40}',pin) and pin!='0'*40, 'reviewed immutable tooling SHA required'
          assert os.environ['DEFINING_WORKFLOW_REPOSITORY']=='storytold/craft-common-actions', 'unexpected defining workflow repository'
          assert os.environ['DEFINING_WORKFLOW_SHA']==pin, 'app-reviewed input must equal the defining job workflow SHA'
          path=pathlib.Path('.github/nightly-publication-policy.json')
          assert path.is_file() and not path.is_symlink(), 'app publication policy unresolved'
          with path.open('rb') as stream: data=stream.read(262145)
          assert len(data)<=262144, 'publication policy exceeds bound'
          def unique(pairs):
              result={}
              for key,value in pairs:
                  if key in result: raise ValueError('duplicate app-policy key')
                  result[key]=value
              return result
          config=json.loads(data,object_pairs_hook=unique)
          assert config.get('schema') in ('craft-nightly-publication-policy/v1','craft-nightly-publication-policy/v2') and config.get('tooling_revision')==pin, 'tooling pin differs from app-reviewed policy'
          if config['schema'].endswith('/v2'):
              import hashlib
              expected=os.environ.get('NIGHTLY_REVIEWED_POLICY_SHA256','')
              digest=hashlib.sha256(json.dumps(config,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
              assert re.fullmatch('[0-9a-f]{64}',expected) and digest==expected, 'independent reviewed baseline policy digest required'
          PY
      - name: Check out the defining job's own immutable tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nightly-tools
          persist-credentials: false
      - name: Verify exact tooling checkout
        shell: bash
        run: test "$(git -C .nightly-tools rev-parse HEAD)" = "$TOOLING_REVISION"
      - name: Admit scheduled first attempt or reviewed current manual actor before credentials or mutation
        shell: bash
        env:
          NIGHTLY_MANUAL_ACTORS: ${{ inputs.manual-actors }}
        run: python -I -B .nightly-tools/scripts/nightly_invocation.py
      - name: Require exact numeric IDs and independent producer hashes before download
        shell: bash
        env:
          IDENTITY_ID: ${{ inputs.identity-artifact-id }}
          IDENTITY_SHA256: ${{ inputs.identity-sha256 }}
        run: |
          set -euo pipefail
          python -B .nightly-tools/scripts/nightly_artifacts.py download-contract --artifact-id "$IDENTITY_ID" --expected-sha256 "$IDENTITY_SHA256"
      - name: Download exact identity artifact ID, never a name replacement
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.identity-artifact-id }}
          path: .nightly-input
          merge-multiple: true
          digest-mismatch: error
      - name: Verify independent identity producer bytes before adapter/build logic
        shell: bash
        env:
          IDENTITY_SHA256: ${{ inputs.identity-sha256 }}
        run: python -B .nightly-tools/scripts/nightly_artifacts.py verify --kind identity --directory .nightly-input --expected-sha256 "$IDENTITY_SHA256"
      - name: Validate the reviewed adapter and exact identity before building
        id: contract
        shell: pwsh
        env:
          APP_NAME: ${{ inputs.app-name }}
          PREPARED_VERSION: ${{ inputs.version }}
        run: |
          python -B .nightly-tools/scripts/nightly_windows.py check `
            --registry .nightly-tools/nightly-apps.json --app "$env:APP_NAME" `
            --identity .nightly-input/nightly-identity.json --policy .nightly-input/nightly-producer-policy.json --version "$env:PREPARED_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'nightly identity/adapter validation failed' }
      - name: Check out craft-fonts
        if: inputs.craft-fonts-ref != ''
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: ${{ inputs.craft-fonts-ref }}
      - name: Check out craft-i18n
        uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main
      - id: rust
        uses: storytold/craft-common-actions/actions/rust-channel@main
        with:
          targets: x86_64-pc-windows-msvc
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          targets: ${{ steps.rust.outputs.targets }}
          components: ${{ steps.rust.outputs.components }}
      # No cache restore/save, version mutation, WiX or signing keys in this build job.
      # App-owned -BuildOnly emits only .unsigned.zip and refuses credential variables.
      - name: Build unsigned handoff only; signing keys are forbidden here
        id: unsigned
        shell: pwsh
        env:
          PHOTOCRAFT_BUILD_CHANNEL: nightly-v1
          PHOTOCRAFT_VERSION: ${{ steps.contract.outputs.version }}
          PHOTOCRAFT_BUILD_SHA: ${{ steps.contract.outputs.source_commit }}
          PHOTOCRAFT_BUILD_DATE: ${{ steps.contract.outputs.build_date }}
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
          DIST: dist
          FINAL_ASSET: ${{ steps.contract.outputs.asset }}
        run: |
          $asset = $env:FINAL_ASSET -replace '\.zip$', '.unsigned.zip'
          "asset=$asset" >> $env:GITHUB_OUTPUT
          pwsh -File packaging/windows/package.ps1 -Arch x64 -Nightly -BuildOnly
          if ($LASTEXITCODE -ne 0) { throw 'app-owned nightly build/package failed' }
      # Exact packaged GUI bytes, a fresh temp profile and no build-version env.
      # This is quality coverage, not E3 profile/IPC/updater qualification.
      - name: Smoke packaged GUI version and nightly flavor
        shell: pwsh
        env:
          EXACT_NIGHTLY_VERSION: ${{ steps.contract.outputs.version }}
          EXACT_NIGHTLY_ASSET: ${{ steps.unsigned.outputs.asset }}
        run: |
          $unpack = Join-Path $env:RUNNER_TEMP "nightly-smoke-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $profile = Join-Path $env:RUNNER_TEMP "nightly-smoke-profile-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          Expand-Archive -LiteralPath (Join-Path 'dist' $env:EXACT_NIGHTLY_ASSET) -DestinationPath $unpack
          python -B .nightly-tools/scripts/nightly_smoke.py --executable (Join-Path $unpack 'photocraft.exe') --profile-root $profile --version $env:EXACT_NIGHTLY_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'packaged nightly version/flavor smoke failed' }
      - name: Hash the original ZIP in its producing job before upload
        id: seal
        shell: pwsh
        env:
          ASSET: ${{ steps.unsigned.outputs.asset }}
        run: |
          python -B .nightly-tools/scripts/nightly_artifacts.py seal --kind zip --directory dist --asset "$env:ASSET"
          if ($LASTEXITCODE -ne 0) { throw 'original ZIP producer hash failed' }
      - name: Retain only the dedicated same-run nightly ZIP
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-nightly-windows-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/${{ steps.unsigned.outputs.asset }}
          if-no-files-found: error
          retention-days: 14

  # Fresh runner: never compile or execute downloaded payload with signing keys.
  windows:
    if: >-
      inputs.production-signing == true && inputs.app-name == 'photocraft' && github.repository == 'storytold/photocraft' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && github.run_attempt == '1') ||
       ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
        contains(fromJSON(inputs.manual-actors), github.triggering_actor)))
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    environment: nightly-signing
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      zip-sha256: ${{ steps.seal.outputs.sha256 }}
      asset: ${{ steps.contract.outputs.asset }}
      unsigned-sha256: ${{ needs.build.outputs.zip-sha256 }}
      receipt-artifact-id: ${{ steps.receipt.outputs.artifact-id }}
      receipt-sha256: ${{ steps.sign.outputs.receipt-sha256 }}
    permissions:
      contents: read
    env:
      NIGHTLY_WINDOWS_PUBLISHER_SUBJECT: ${{ inputs.windows-publisher-subject }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Check out exact application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind app-reviewed tooling to the defining job before shared checkout
        shell: bash
        env:
          DEFINING_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          python -I -B - <<'PY'
          import json, os, pathlib, re
          pin=os.environ['TOOLING_REVISION']
          assert re.fullmatch('[0-9a-f]{40}',pin) and pin!='0'*40, 'reviewed immutable tooling SHA required'
          assert os.environ['DEFINING_WORKFLOW_REPOSITORY']=='storytold/craft-common-actions', 'unexpected defining workflow repository'
          assert os.environ['DEFINING_WORKFLOW_SHA']==pin, 'app-reviewed input must equal the defining job workflow SHA'
          path=pathlib.Path('.github/nightly-publication-policy.json')
          assert path.is_file() and not path.is_symlink(), 'app publication policy unresolved'
          with path.open('rb') as stream: data=stream.read(262145)
          assert len(data)<=262144, 'publication policy exceeds bound'
          def unique(pairs):
              result={}
              for key,value in pairs:
                  if key in result: raise ValueError('duplicate app-policy key')
                  result[key]=value
              return result
          config=json.loads(data,object_pairs_hook=unique)
          assert config.get('schema') in ('craft-nightly-publication-policy/v1','craft-nightly-publication-policy/v2') and config.get('tooling_revision')==pin, 'tooling pin differs from app-reviewed policy'
          if config['schema'].endswith('/v2'):
              import hashlib
              expected=os.environ.get('NIGHTLY_REVIEWED_POLICY_SHA256','')
              digest=hashlib.sha256(json.dumps(config,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
              assert re.fullmatch('[0-9a-f]{64}',expected) and digest==expected, 'independent reviewed baseline policy digest required'
          PY
      - name: Check out the defining job's own immutable tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nightly-tools
          persist-credentials: false
      - name: Verify exact tooling checkout
        shell: bash
        run: test "$(git -C .nightly-tools rev-parse HEAD)" = "$TOOLING_REVISION"
      - name: Admit scheduled first attempt or reviewed current manual actor before credentials or mutation
        shell: bash
        env:
          NIGHTLY_MANUAL_ACTORS: ${{ inputs.manual-actors }}
        run: python -I -B .nightly-tools/scripts/nightly_invocation.py
      - name: Require exact numeric IDs and independent producer hashes before download
        shell: bash
        env:
          IDENTITY_ID: ${{ inputs.identity-artifact-id }}
          IDENTITY_SHA256: ${{ inputs.identity-sha256 }}
        run: |
          set -euo pipefail
          python -B .nightly-tools/scripts/nightly_artifacts.py download-contract --artifact-id "$IDENTITY_ID" --expected-sha256 "$IDENTITY_SHA256"
      - name: Download exact identity artifact ID, never a name replacement
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.identity-artifact-id }}
          path: .nightly-input
          merge-multiple: true
          digest-mismatch: error
      - name: Verify independent identity producer bytes before adapter/build logic
        shell: bash
        env:
          IDENTITY_SHA256: ${{ inputs.identity-sha256 }}
        run: python -B .nightly-tools/scripts/nightly_artifacts.py verify --kind identity --directory .nightly-input --expected-sha256 "$IDENTITY_SHA256"
      - name: Validate the reviewed adapter and exact identity before building
        id: contract
        shell: pwsh
        env:
          APP_NAME: ${{ inputs.app-name }}
          PREPARED_VERSION: ${{ inputs.version }}
        run: |
          python -B .nightly-tools/scripts/nightly_windows.py check `
            --registry .nightly-tools/nightly-apps.json --app "$env:APP_NAME" `
            --identity .nightly-input/nightly-identity.json --policy .nightly-input/nightly-producer-policy.json --version "$env:PREPARED_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'nightly identity/adapter validation failed' }
      - name: Require exact original unsigned upload ID and hash
        shell: bash
        env:
          UNSIGNED_ID: ${{ needs.build.outputs.artifact-id }}
          UNSIGNED_SHA256: ${{ needs.build.outputs.zip-sha256 }}
        run: python -B .nightly-tools/scripts/nightly_artifacts.py download-contract --artifact-id "$UNSIGNED_ID" --expected-sha256 "$UNSIGNED_SHA256"
      - name: Download only the original unsigned producer ZIP
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: .nightly-unsigned
          merge-multiple: true
          digest-mismatch: error
      - name: Sign with the existing app backend and independently verify final ZIP
        id: sign
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          IDENTITY_SHA256: ${{ inputs.identity-sha256 }}
          UNSIGNED_SHA256: ${{ needs.build.outputs.zip-sha256 }}
          ASSET: ${{ steps.contract.outputs.asset }}
          UNSIGNED_ASSET: ${{ needs.build.outputs.asset }}
          EXACT_VERSION: ${{ steps.contract.outputs.version }}
        run: |
          python -B .nightly-tools/scripts/nightly_signing.py sign --platform windows-x86_64 `
            --registry .nightly-tools/nightly-apps.json --source . --version "$env:EXACT_VERSION" `
            --identity-directory .nightly-input --identity-sha256 "$env:IDENTITY_SHA256" `
            --archive ".nightly-unsigned/$env:UNSIGNED_ASSET" --unsigned-sha256 "$env:UNSIGNED_SHA256" `
            --asset "$env:ASSET" --output ".nightly-signed/$env:ASSET" --receipt-directory .nightly-signing
          if ($LASTEXITCODE -ne 0) { throw 'required nightly signing/verification refused' }
      - name: Hash final signed ZIP after all byte-changing signing operations
        id: seal
        shell: pwsh
        env:
          ASSET: ${{ steps.contract.outputs.asset }}
        run: |
          python -B .nightly-tools/scripts/nightly_artifacts.py seal --kind zip --directory .nightly-signed --asset "$env:ASSET"
          if ($LASTEXITCODE -ne 0) { throw 'signed ZIP hash failed' }
      - name: Upload final signed ZIP only
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          include-hidden-files: true
          name: signed-nightly-windows-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: .nightly-signed/${{ steps.contract.outputs.asset }}
          if-no-files-found: error
          retention-days: 14
      - name: Upload independently hash-bound signing receipt
        id: receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          include-hidden-files: true
          name: nightly-signing-windows-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: .nightly-signing/nightly-signing.json
          if-no-files-found: error
          retention-days: 14
