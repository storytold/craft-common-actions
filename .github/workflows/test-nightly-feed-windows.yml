name: nightly feed reads on Windows

# A real-platform smoke test for bounded_bytes/bounded_json, which run in the signer's Windows
# validate job (windows-latest, Python 3.13) on the workspace volume. The files have the shapes that
# job reads: written in the workspace, written by another process, checked out by git, extracted the
# way download-artifact extracts. It also records whether the path and handle stats agree on the
# runner image, and runs the same tests against the strict-comparison build so the drift, when this
# runner exposes it, is visible in the same run.
on:
  pull_request:
    paths:
      - scripts/nightly_feed.py
      - tests/test_nightly_feed_windows.py
      - tests/test_nightly_feed.py
      - .github/workflows/test-nightly-feed-windows.yml
  push:
    branches: [main]
    paths:
      - scripts/nightly_feed.py
      - tests/test_nightly_feed_windows.py
      - tests/test_nightly_feed.py
      - .github/workflows/test-nightly-feed-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reads:
    name: real-file reads (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    env:
      NIGHTLY_FEED_TEST_ROOT: ${{ github.workspace }}/.feed-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.13 (as the signer)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Make an artifact to download
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/up"
          printf '%s' '{"artifact": "downloaded"}' > "$RUNNER_TEMP/up/artifact.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feed-read-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/up/artifact.json
          retention-days: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: feed-read-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.downloaded
      - name: Record the volume and whether path and handle stats agree here
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then fsutil fsinfo volumeinfo D: | head -5 || true; fi
          python -I -B - <<'EOF'
          import os
          fields = ("st_dev", "st_ino", "st_size", "st_mtime_ns", "st_ctime_ns")
          for path in ("nightly-apps.json", ".downloaded/artifact.json"):
              with open(path, "rb") as stream:
                  handle = os.fstat(stream.fileno())
              entry = os.lstat(path)
              agree = all(getattr(entry, k) == getattr(handle, k) for k in fields)
              print(path, "lstat and fstat agree:", agree, {k: getattr(entry, k) for k in fields})
          EOF
      - name: This commit's code on real files (must pass)
        shell: bash
        env:
          NIGHTLY_FEED_DOWNLOADED: ${{ github.workspace }}/.downloaded/artifact.json
        run: python -I -B -m unittest discover -s tests -p test_nightly_feed_windows.py -v
      - name: The strict comparison on the same tests (evidence, not a gate)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_FEED_DOWNLOADED: ${{ github.workspace }}/.downloaded/artifact.json
        run: |
          # 644556de is the diagnostics-only build: the strict five-field comparison. Whether it
          # refuses here says whether this runner exposes the drift on this run.
          gh api "repos/storytold/craft-common-actions/contents/scripts/nightly_feed.py?ref=644556debe518ff6963c8d08b92a69aa6cabb534" --jq .content | base64 -d > "$RUNNER_TEMP/nightly_feed_strict.py"
          if NIGHTLY_FEED_MODULE="$RUNNER_TEMP/nightly_feed_strict.py" python -I -B -m unittest discover -s tests -p test_nightly_feed_windows.py -v 2>&1 | tee "$RUNNER_TEMP/strict.log"; then
            echo "strict comparison: passed here (drift not observed on this run)"
          else
            echo "strict comparison: refused here (the drift occurred, as in the signer)"
          fi
