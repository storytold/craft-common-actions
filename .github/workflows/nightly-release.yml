name: Release-ref nightly signer
# No push, schedule, workflow_run or workflow_dispatch entry point here.
# Only the protected app caller can satisfy the real release-ref admission.
# One release carries every admitted platform: all sign/verify jobs must succeed.
on:
  workflow_call:
    inputs:
      tooling-revision:
        type: string
        required: true
      producer_run_id:
        type: string
        required: true
      producer_run_attempt:
        type: string
        required: true
      publish-linux-packages:
        description: "Opt in to signing and publishing Linux distro packages (.deb, .rpm, .pkg.tar.zst, .AppImage, .flatpak) and Flatpak OCI tags"
        type: boolean
        default: false
    secrets:
      ARTCRAFT_SERVICES_DISPATCH_TOKEN:
        required: false
      LINUX_SIGNING_KEY:
        required: false
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
permissions:
  contents: read
concurrency:
  group: craft-release-ref-signer-photocraft
  cancel-in-progress: false
  queue: max
env:
  TOOLING_REVISION: ${{ inputs.tooling-revision }}
jobs:
  validate:
    if: github.repository == 'storytold/photocraft' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release' && github.ref_type == 'branch'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      checks: read
      attestations: read
    outputs:
      admitted: ${{ steps.admit.outputs.admitted }}
      platforms: ${{ steps.admit.outputs.platforms }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      bundle-sha256: ${{ steps.validate.outputs.bundle-sha256 }}
    steps:
      - name: Check out only the actual release execution source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-source
          persist-credentials: false
      - name: Bind protected policy and actual immutable defining workflow
        shell: pwsh
        env:
          DEFINING_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_SHA: ${{ job.workflow_sha }}
        run: |
          if ((git -C .release-source rev-parse HEAD) -cne $env:GITHUB_SHA) { throw 'release source differs from real execution SHA' }
          python -I -B -c "import os,json,re; p=os.environ['TOOLING_REVISION']; assert re.fullmatch('[0-9a-f]{40}',p) and p!='0'*40; assert os.environ['DEFINING_REPOSITORY']=='storytold/craft-common-actions'; assert os.environ['DEFINING_SHA']==p; config=json.load(open('.release-source/.github/nightly-signing-policy.json')); assert config['schema']=='craft-nightly-release-policy/v3'; assert config['signer_tooling_revision']==p"
          if ($LASTEXITCODE -ne 0) { throw 'protected policy/tooling binding refused' }
      - name: Check out only the defining shared workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nightly-tools
          persist-credentials: false
      - name: Snapshot exact-C quality before artifact work
        id: admit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          PRODUCER_RUN_ATTEMPT: ${{ inputs.producer_run_attempt }}
        run: |
          python -I -B .nightly-tools/scripts/nightly_release_entry.py admit --source .release-source --producer-run-id "$env:PRODUCER_RUN_ID" --producer-run-attempt "$env:PRODUCER_RUN_ATTEMPT" --output .admission
          if ($LASTEXITCODE -ne 0) { throw 'producer/quality admission refused' }
      # One exact authenticated artifact ID per admitted platform, each into its own directory.
      - name: Download exact authenticated Windows producer artifact; verify transport ZIP digest
        if: steps.admit.outputs.admitted == 'true' && contains(fromJSON(steps.admit.outputs.platforms), 'windows-x86_64')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.producer_run_id }}
          artifact-ids: ${{ steps.admit.outputs.artifact-id-windows-x86_64 }}
          path: .unsigned/windows-x86_64
          merge-multiple: true
          digest-mismatch: error
      - name: Download exact authenticated macOS producer artifact; verify transport ZIP digest
        if: steps.admit.outputs.admitted == 'true' && contains(fromJSON(steps.admit.outputs.platforms), 'macos-aarch64')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.producer_run_id }}
          artifact-ids: ${{ steps.admit.outputs.artifact-id-macos-aarch64 }}
          path: .unsigned/macos-aarch64
          merge-multiple: true
          digest-mismatch: error
      - name: Download exact authenticated Linux producer artifact; verify transport ZIP digest
        if: steps.admit.outputs.admitted == 'true' && contains(fromJSON(steps.admit.outputs.platforms), 'linux-x86_64')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.producer_run_id }}
          artifact-ids: ${{ steps.admit.outputs.artifact-id-linux-x86_64 }}
          path: .unsigned/linux-x86_64
          merge-multiple: true
          digest-mismatch: error
      - name: Verify every unsigned payload with trusted patched gh, then revalidate admission
        if: steps.admit.outputs.admitted == 'true'
        id: validate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -I -B .nightly-tools/scripts/nightly_release_entry.py validate --source .release-source --state .admission --directory .unsigned --output .validated
          if ($LASTEXITCODE -ne 0) { throw 'cryptographic unsigned provenance or retained quality refused' }
      - name: Upload only trusted validator handoff
        if: steps.admit.outputs.admitted == 'true'
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-release-validated-${{ github.run_id }}-${{ github.run_attempt }}
          path: .validated/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  sign-windows:
    needs: validate
    if: needs.validate.outputs.admitted == 'true' && contains(fromJSON(needs.validate.outputs.platforms), 'windows-x86_64') && github.repository == 'storytold/photocraft' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release' && github.ref_type == 'branch'
    runs-on: windows-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      actions: read
      checks: read
      attestations: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      bundle-sha256: ${{ steps.sign.outputs.bundle-sha256 }}
    steps:
      - name: Check out only the actual release execution source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-source
          persist-credentials: false
      - name: Bind protected policy and actual immutable defining workflow
        shell: pwsh
        env:
          DEFINING_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_SHA: ${{ job.workflow_sha }}
        run: |
          if ((git -C .release-source rev-parse HEAD) -cne $env:GITHUB_SHA) { throw 'release source differs from real execution SHA' }
          python -I -B -c "import os,json,re; p=os.environ['TOOLING_REVISION']; assert re.fullmatch('[0-9a-f]{40}',p) and p!='0'*40; assert os.environ['DEFINING_REPOSITORY']=='storytold/craft-common-actions'; assert os.environ['DEFINING_SHA']==p; config=json.load(open('.release-source/.github/nightly-signing-policy.json')); assert config['schema']=='craft-nightly-release-policy/v3'; assert config['signer_tooling_revision']==p"
          if ($LASTEXITCODE -ne 0) { throw 'protected policy/tooling binding refused' }
      - name: Check out only the defining shared workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nightly-tools
          persist-credentials: false
      - name: Download only the trusted same-run validator artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-id }}
          path: .validated
          merge-multiple: true
          digest-mismatch: error
      - name: Recheck real ref, quality, pause and freshness before raw signing-secret exports
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BUNDLE_SHA256: ${{ needs.validate.outputs.bundle-sha256 }}
        run: |
          python -I -B .nightly-tools/scripts/nightly_release_entry.py guard --source .release-source --platform windows-x86_64 --directory .validated --expected-sha256 "$env:EXPECTED_BUNDLE_SHA256"
          if ($LASTEXITCODE -ne 0) { throw 'pre-secret signing gate refused' }
      - name: Sign data only through protected existing Windows adapter
        id: sign
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BUNDLE_SHA256: ${{ needs.validate.outputs.bundle-sha256 }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: |
          python -I -B .nightly-tools/scripts/nightly_release_entry.py sign --source .release-source --platform windows-x86_64 --directory .validated --expected-sha256 "$env:EXPECTED_BUNDLE_SHA256" --output .signed
          if ($LASTEXITCODE -ne 0) { throw 'mandatory native signing/verification refused' }
      - name: Upload only finite signed bytes and two-role receipts
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-release-signed-windows-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: .signed/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  sign-macos:
    needs: validate
    if: needs.validate.outputs.admitted == 'true' && contains(fromJSON(needs.validate.outputs.platforms), 'macos-aarch64') && github.repository == 'storytold/photocraft' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release' && github.ref_type == 'branch'
    # Same Apple route and `release` environment as the stable macOS job.
    runs-on: macos-15
    timeout-minutes: 120
    environment: release
    permissions:
      contents: read
      actions: read
      checks: read
      attestations: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      bundle-sha256: ${{ steps.sign.outputs.bundle-sha256 }}
    steps:
      - name: Select Python for nightly helpers
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Check out only the actual release execution source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-source
          persist-credentials: false
      - name: Bind protected policy and actual immutable defining workflow
        shell: bash
        env:
          DEFINING_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git -C .release-source rev-parse HEAD)" = "$GITHUB_SHA" || { echo 'release source differs from real execution SHA'; exit 1; }
          python3 -I -B -c "import os,json,re; p=os.environ['TOOLING_REVISION']; assert re.fullmatch('[0-9a-f]{40}',p) and p!='0'*40; assert os.environ['DEFINING_REPOSITORY']=='storytold/craft-common-actions'; assert os.environ['DEFINING_SHA']==p; config=json.load(open('.release-source/.github/nightly-signing-policy.json')); assert config['schema']=='craft-nightly-release-policy/v3'; assert config['signer_tooling_revision']==p"
      - name: Check out only the defining shared workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nightly-tools
          persist-credentials: false
      - name: Download only the trusted same-run validator artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-id }}
          path: .validated
          merge-multiple: true
          digest-mismatch: error
      - name: Recheck real ref, quality, pause and freshness before raw signing-secret exports
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BUNDLE_SHA256: ${{ needs.validate.outputs.bundle-sha256 }}
        run: python3 -I -B .nightly-tools/scripts/nightly_release_entry.py guard --source .release-source --platform macos-aarch64 --directory .validated --expected-sha256 "$EXPECTED_BUNDLE_SHA256"
      - name: Sign, notarize and staple data only through the protected app macOS adapter
        id: sign
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BUNDLE_SHA256: ${{ needs.validate.outputs.bundle-sha256 }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python3 -I -B .nightly-tools/scripts/nightly_release_entry.py sign --source .release-source --platform macos-aarch64 --directory .validated --expected-sha256 "$EXPECTED_BUNDLE_SHA256" --output .signed
      - name: Upload only finite signed bytes and two-role receipts
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-release-signed-macos-aarch64-${{ github.run_id }}-${{ github.run_attempt }}
          path: .signed/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  verify-macos:
    needs: [validate, sign-macos]
    if: needs.validate.outputs.admitted == 'true' && contains(fromJSON(needs.validate.outputs.platforms), 'macos-aarch64') && github.repository == 'storytold/photocraft' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release' && github.ref_type == 'branch'
    # Fresh runner, NO release environment or platform secrets.
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      checks: read
      attestations: read
    outputs:
      final-sha256: ${{ steps.verify.outputs.final-sha256 }}
      asset: ${{ steps.verify.outputs.asset }}
    steps:
      - name: Select Python for nightly helpers
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Check out only the actual release execution source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-source
          persist-credentials: false
      - name: Bind protected policy and actual immutable defining workflow
        shell: bash
        env:
          DEFINING_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git -C .release-source rev-parse HEAD)" = "$GITHUB_SHA" || { echo 'release source differs from real execution SHA'; exit 1; }
          python3 -I -B -c "import os,json,re; p=os.environ['TOOLING_REVISION']; assert re.fullmatch('[0-9a-f]{40}',p) and p!='0'*40; assert os.environ['DEFINING_REPOSITORY']=='storytold/craft-common-actions'; assert os.environ['DEFINING_SHA']==p; config=json.load(open('.release-source/.github/nightly-signing-policy.json')); assert config['schema']=='craft-nightly-release-policy/v3'; assert config['signer_tooling_revision']==p"
      - name: Check out only the defining shared workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nightly-tools
          persist-credentials: false
      - name: Download only exact signer-produced macOS artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign-macos.outputs.artifact-id }}
          path: .signed/macos-aarch64
          merge-multiple: true
          digest-mismatch: error
      - name: Independently verify Developer ID, team, runtime, timestamp, staple and Gatekeeper
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BUNDLE_SHA256: ${{ needs.sign-macos.outputs.bundle-sha256 }}
        run: python3 -I -B .nightly-tools/scripts/nightly_release_entry.py verify-platform --source .release-source --platform macos-aarch64 --directory .signed/macos-aarch64 --expected-sha256 "$EXPECTED_BUNDLE_SHA256"
  smoke-macos:
    needs: [validate, sign-macos, verify-macos]
    if: needs.validate.outputs.admitted == 'true' && contains(fromJSON(needs.validate.outputs.platforms), 'macos-aarch64') && github.repository == 'storytold/photocraft' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release' && github.ref_type == 'branch'
    # The only job that runs signed payload code: no environment, secrets, tokens or
    # outputs the publisher consumes. Hardened runtime only applies once signed.
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Select Python for nightly helpers
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Check out only the actual release execution source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-source
          persist-credentials: false
      - name: Bind protected policy and actual immutable defining workflow
        shell: bash
        env:
          DEFINING_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git -C .release-source rev-parse HEAD)" = "$GITHUB_SHA" || { echo 'release source differs from real execution SHA'; exit 1; }
          python3 -I -B -c "import os,json,re; p=os.environ['TOOLING_REVISION']; assert re.fullmatch('[0-9a-f]{40}',p) and p!='0'*40; assert os.environ['DEFINING_REPOSITORY']=='storytold/craft-common-actions'; assert os.environ['DEFINING_SHA']==p; config=json.load(open('.release-source/.github/nightly-signing-policy.json')); assert config['schema']=='craft-nightly-release-policy/v3'; assert config['signer_tooling_revision']==p"
      - name: Download only exact signer-produced macOS artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign-macos.outputs.artifact-id }}
          path: .signed/macos-aarch64
          merge-multiple: true
          digest-mismatch: error
      - name: Launch the exact verified signed app once, secret-free, through the app verifier
        shell: bash
        env:
          ASSET: ${{ needs.verify-macos.outputs.asset }}
          FINAL_SHA256: ${{ needs.verify-macos.outputs.final-sha256 }}
        run: |
          set -euo pipefail
          [[ "$ASSET" =~ ^photocraft-[0-9A-Za-z.-]+-macos-aarch64-nightly[.]zip$ ]]
          final="$PWD/.signed/macos-aarch64/$ASSET"
          test -f "$final" && test ! -L "$final"
          test "$(shasum -a 256 "$final" | cut -d' ' -f1)" = "$FINAL_SHA256"
          team="$(git -C .release-source show HEAD:.github/nightly-signing-policy.json | python3 -I -c "import json,re,sys; t=json.load(sys.stdin)['platforms']['macos-aarch64']['trust']['apple_team_id']; assert re.fullmatch('[A-Z0-9]{10}',t); print(t)")"
          bash .release-source/packaging/macos/nightly-verify.sh --input "$final" --expect signed --team "$team"
  sign-linux:
    # Linux signs on Ubuntu with the existing stable LINUX_SIGNING_KEY in the release environment,
    # exposed only to the single sign step. Never builds, extracts or runs the payload.
    needs: validate
    if: >-
      needs.validate.outputs.admitted == 'true' && contains(fromJSON(needs.validate.outputs.platforms), 'linux-x86_64') &&
      github.repository == 'storytold/photocraft' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release' && github.ref_type == 'branch'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      actions: read
      checks: read
      attestations: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      bundle-sha256: ${{ steps.sign.outputs.bundle-sha256 }}
      final-sha256: ${{ steps.sign.outputs.final-sha256 }}
    steps:
      - name: Select Python for nightly helpers
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check out only the actual release execution source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-source
          persist-credentials: false
      - name: Bind protected policy and actual immutable defining workflow
        env:
          DEFINING_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git -C .release-source rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -I -B -c "import os,json,re; p=os.environ['TOOLING_REVISION']; assert re.fullmatch('[0-9a-f]{40}',p) and p!='0'*40; assert os.environ['DEFINING_REPOSITORY']=='storytold/craft-common-actions'; assert os.environ['DEFINING_SHA']==p; config=json.load(open('.release-source/.github/nightly-signing-policy.json')); assert config['schema']=='craft-nightly-release-policy/v3'; assert config['signer_tooling_revision']==p; assert 'linux-x86_64' in config['platforms']"
      - name: Check out only the defining shared workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nightly-tools
          persist-credentials: false
      - name: Download only the trusted same-run validator artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-id }}
          path: .validated
          merge-multiple: true
          digest-mismatch: error
      - name: Recheck real ref, quality, pause and freshness before the signing secret is exposed
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BUNDLE_SHA256: ${{ needs.validate.outputs.bundle-sha256 }}
        run: python3 -I -B .nightly-tools/scripts/nightly_release_entry.py guard --platform linux-x86_64 --source .release-source --directory .validated --expected-sha256 "$EXPECTED_BUNDLE_SHA256"
      - name: Sign data only with the existing stable OpenPGP key (detached .asc)
        id: sign
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BUNDLE_SHA256: ${{ needs.validate.outputs.bundle-sha256 }}
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
        run: python3 -I -B .nightly-tools/scripts/nightly_release_entry.py sign --platform linux-x86_64 --source .release-source --directory .validated --expected-sha256 "$EXPECTED_BUNDLE_SHA256" --output .signed
      - name: Upload only finite signed bytes, detached signature support and receipts
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-release-signed-linux-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: .signed/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  verify-linux:
    # Fresh keyless runner: no release environment or secrets. gpgv trusts only the
    # reviewed key in release source and the policy fingerprint, never the release asset.
    needs: [validate, sign-linux]
    if: >-
      needs.sign-linux.result == 'success' && contains(fromJSON(needs.validate.outputs.platforms), 'linux-x86_64') &&
      github.repository == 'storytold/photocraft' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release' && github.ref_type == 'branch'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
      attestations: read
    outputs:
      final-sha256: ${{ steps.verify.outputs.final-sha256 }}
    steps:
      - name: Select Python for nightly helpers
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check out only the actual release execution source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-source
          persist-credentials: false
      - name: Bind protected policy and actual immutable defining workflow
        env:
          DEFINING_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$(git -C .release-source rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -I -B -c "import os,json,re; p=os.environ['TOOLING_REVISION']; assert re.fullmatch('[0-9a-f]{40}',p) and p!='0'*40; assert os.environ['DEFINING_REPOSITORY']=='storytold/craft-common-actions'; assert os.environ['DEFINING_SHA']==p; config=json.load(open('.release-source/.github/nightly-signing-policy.json')); assert config['schema']=='craft-nightly-release-policy/v3'; assert config['signer_tooling_revision']==p; assert 'linux-x86_64' in config['platforms']"
      - name: Check out only the defining shared workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nightly-tools
          persist-credentials: false
      - name: Download only the exact signer-produced Linux artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign-linux.outputs.artifact-id }}
          path: .signed/linux-x86_64
          merge-multiple: true
          digest-mismatch: error
      - name: Independently verify the detached signature, exact bytes and published key without credentials
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BUNDLE_SHA256: ${{ needs.sign-linux.outputs.bundle-sha256 }}
        run: python3 -I -B .nightly-tools/scripts/nightly_release_entry.py verify-platform --platform linux-x86_64 --source .release-source --directory .signed/linux-x86_64 --expected-sha256 "$EXPECTED_BUNDLE_SHA256"
  publish:
    name: Publish signed nightly
    needs: [validate, sign-windows, sign-macos, verify-macos, smoke-macos, sign-linux, verify-linux]
    # !cancelled() (not always()) so a skipped NON-admitted platform cannot block while a cancel
    # still stops release writes; every admitted
    # platform's jobs must have succeeded, and the bridge refuses a missing digest too.
    if: >-
      !cancelled() && needs.validate.result == 'success' && needs.validate.outputs.admitted == 'true' &&
      (!contains(fromJSON(needs.validate.outputs.platforms), 'windows-x86_64') || needs.sign-windows.result == 'success') &&
      (!contains(fromJSON(needs.validate.outputs.platforms), 'macos-aarch64') || (needs.sign-macos.result == 'success' && needs.verify-macos.result == 'success' && needs.smoke-macos.result == 'success')) &&
      (!contains(fromJSON(needs.validate.outputs.platforms), 'linux-x86_64') || (needs.sign-linux.result == 'success' && needs.verify-linux.result == 'success')) &&
      github.repository == 'storytold/photocraft' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release' && github.ref_type == 'branch'
    runs-on: windows-latest
    # Every step has its own bound and the job budget exceeds their sum, so a slow
    # step fails as a step: the tolerant ownership upload can never time the job out.
    timeout-minutes: 95
    # Fresh Windows verifier, but NO release environment or platform secrets.
    permissions:
      contents: write
      actions: read
      checks: read
      attestations: write
      id-token: write
    steps:
      - name: Check out only the actual release execution source
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-source
          persist-credentials: false
      - name: Bind protected policy and actual immutable defining workflow
        timeout-minutes: 5
        shell: pwsh
        env:
          DEFINING_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_SHA: ${{ job.workflow_sha }}
        run: |
          if ((git -C .release-source rev-parse HEAD) -cne $env:GITHUB_SHA) { throw 'release source differs from real execution SHA' }
          python -I -B -c "import os,json,re; p=os.environ['TOOLING_REVISION']; assert re.fullmatch('[0-9a-f]{40}',p) and p!='0'*40; assert os.environ['DEFINING_REPOSITORY']=='storytold/craft-common-actions'; assert os.environ['DEFINING_SHA']==p; config=json.load(open('.release-source/.github/nightly-signing-policy.json')); assert config['schema']=='craft-nightly-release-policy/v3'; assert config['signer_tooling_revision']==p"
          if ($LASTEXITCODE -ne 0) { throw 'protected policy/tooling binding refused' }
      - name: Check out only the defining shared workflow revision
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nightly-tools
          persist-credentials: false
      - name: Download only exact signer-produced Windows artifact ID
        timeout-minutes: 10
        if: contains(fromJSON(needs.validate.outputs.platforms), 'windows-x86_64')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign-windows.outputs.artifact-id }}
          path: .signed/windows-x86_64
          merge-multiple: true
          digest-mismatch: error
      - name: Download only exact signer-produced macOS artifact ID
        timeout-minutes: 10
        if: contains(fromJSON(needs.validate.outputs.platforms), 'macos-aarch64')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign-macos.outputs.artifact-id }}
          path: .signed/macos-aarch64
          merge-multiple: true
          digest-mismatch: error
      - name: Download only exact signer-produced Linux artifact ID
        timeout-minutes: 10
        if: contains(fromJSON(needs.validate.outputs.platforms), 'linux-x86_64')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.sign-linux.outputs.artifact-id }}
          path: .signed/linux-x86_64
          merge-multiple: true
          digest-mismatch: error
      - name: Revalidate actual producer, natively verify Windows and bind each fresh platform verifier
        timeout-minutes: 15
        id: final
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_BUNDLE_SHA256_WINDOWS_X86_64: ${{ needs.sign-windows.outputs.bundle-sha256 }}
          SIGNED_BUNDLE_SHA256_MACOS_AARCH64: ${{ needs.sign-macos.outputs.bundle-sha256 }}
          VERIFIED_FINAL_SHA256_MACOS_AARCH64: ${{ needs.verify-macos.outputs.final-sha256 }}
          SIGNED_BUNDLE_SHA256_LINUX_X86_64: ${{ needs.sign-linux.outputs.bundle-sha256 }}
          VERIFIED_FINAL_SHA256_LINUX_X86_64: ${{ needs.verify-linux.outputs.final-sha256 }}
        run: |
          python -I -B .nightly-tools/scripts/nightly_release_entry.py final --source .release-source --directory .signed
          if ($LASTEXITCODE -ne 0) { throw 'fresh native signature or publication preflight refused' }
      - name: Attest actual final signed-output bytes from trusted publisher
        timeout-minutes: 5
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f
        with:
          subject-path: ${{ steps.final.outputs.subject-path }}
      - name: Publish the signed nightly and preserve ownership
        timeout-minutes: 15
        id: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_BUNDLE_SHA256_WINDOWS_X86_64: ${{ needs.sign-windows.outputs.bundle-sha256 }}
          SIGNED_BUNDLE_SHA256_MACOS_AARCH64: ${{ needs.sign-macos.outputs.bundle-sha256 }}
          VERIFIED_FINAL_SHA256_MACOS_AARCH64: ${{ needs.verify-macos.outputs.final-sha256 }}
          SIGNED_BUNDLE_SHA256_LINUX_X86_64: ${{ needs.sign-linux.outputs.bundle-sha256 }}
          VERIFIED_FINAL_SHA256_LINUX_X86_64: ${{ needs.verify-linux.outputs.final-sha256 }}
        run: |
          python -I -B .nightly-tools/scripts/nightly_release_entry.py publish --source .release-source --directory .signed --combined .combined --packet .packet --ownership .ownership
          if ($LASTEXITCODE -ne 0) { throw 'publication stopped; reconcile any public state before retrying' }
      - name: Retain only finalized ownership evidence
        timeout-minutes: 5
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-ownership-v2-photocraft-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ownership/ownership.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

  publish-linux-packages:
    name: Sign and publish Linux packages
    needs: [validate, publish]
    if: >-
      inputs.publish-linux-packages && !cancelled() &&
      needs.validate.result == 'success' && needs.validate.outputs.admitted == 'true' &&
      needs.publish.result == 'success' &&
      github.repository == 'storytold/photocraft' && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/release' && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out only the actual release execution source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-source
          persist-credentials: false
      - name: Bind protected policy and actual immutable defining workflow
        shell: bash
        env:
          DEFINING_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_SHA: ${{ job.workflow_sha }}
        run: |
          test "$(git -C .release-source rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -I -B - <<'PY'
          import json, os, re
          p = os.environ['TOOLING_REVISION']
          assert re.fullmatch('[0-9a-f]{40}', p) and p != '0'*40
          assert os.environ['DEFINING_REPOSITORY'] == 'storytold/craft-common-actions'
          assert os.environ['DEFINING_SHA'] == p
          config = json.load(open('.release-source/.github/nightly-signing-policy.json'))
          assert config['schema']=='craft-nightly-release-policy/v3'
          assert config['signer_tooling_revision'] == p
          PY
      - name: Check out only the defining shared workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nightly-tools
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.producer_run_id }}
          name: nightly-linux-packages-x86_64-${{ inputs.producer_run_id }}-${{ inputs.producer_run_attempt }}
          path: .linux-packages
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.producer_run_id }}
          name: nightly-linux-packages-aarch64-${{ inputs.producer_run_id }}-${{ inputs.producer_run_attempt }}
          path: .linux-packages
          merge-multiple: true
      - name: Resolve published nightly tag and version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$(gh release list --exclude-drafts --limit 20 --json tagName,isPrerelease,publishedAt --jq '[.[] | select(.isPrerelease)] | sort_by(.publishedAt) | last | .tagName // ""')"
          test -n "$tag" || { echo "::error::no published nightly prerelease tag found"; exit 1; }
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install signing and OCI tools
        uses: storytold/craft-common-actions/actions/install-apt-packages@f5141455aac7b2eb4708aa259d8ffcdf10fde939
        with:
          packages: rpm debsigs skopeo binutils
      - name: Push Flatpak OCI layouts to GHCR and Docker Hub (dated and nightly tags)
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          REGISTRY: ghcr.io/${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          REGISTRY="${REGISTRY,,}"
          creds="${GITHUB_ACTOR:-storytold}:$GITHUB_TOKEN"
          for arch in x86_64 aarch64; do
            layouts=(.linux-packages/*-linux-"${arch}"-oci)
            for layout in "${layouts[@]}"; do
              [ -d "$layout" ] || continue
              base="$(basename "$layout" -oci)"
              echo "==> Pushing to $REGISTRY:$RELEASE_VERSION-$arch"
              skopeo copy --format oci --dest-creds "$creds" "oci:$layout" "docker://$REGISTRY:$RELEASE_VERSION-$arch"
              echo "==> Pushing to $REGISTRY:nightly-$arch"
              skopeo copy --format oci --dest-creds "$creds" "oci:$layout" "docker://$REGISTRY:nightly-$arch"
              skopeo inspect --raw --creds "$creds" "docker://$REGISTRY:$RELEASE_VERSION-$arch" >".linux-packages/$base.oci-manifest.json"
              if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
                dh_registry="docker.io/storytold/${REGISTRY##*/}"
                dh_creds="$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN"
                echo "==> Pushing to $dh_registry:$RELEASE_VERSION-$arch"
                skopeo copy --format oci --dest-creds "$dh_creds" "oci:$layout" "docker://$dh_registry:$RELEASE_VERSION-$arch"
                echo "==> Pushing to $dh_registry:nightly-$arch"
                skopeo copy --format oci --dest-creds "$dh_creds" "oci:$layout" "docker://$dh_registry:nightly-$arch"
              fi
              rm -rf "$layout"
            done
          done
      - name: Import the Linux signing key
        id: key
        uses: storytold/craft-common-actions/actions/import-signing-key@f5141455aac7b2eb4708aa259d8ffcdf10fde939
        with:
          key: ${{ secrets.LINUX_SIGNING_KEY }}
      - name: Sign Linux packages and update SHA256SUMS.txt
        env:
          SIGNING_ENABLED: ${{ steps.key.outputs.enabled }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          cd .linux-packages
          if [ "$SIGNING_ENABLED" = "true" ]; then
            OCI_REGISTRY="ghcr.io/${GITHUB_REPOSITORY,,}" ../.nightly-tools/actions/draft-release/sign-linux.sh .
          fi
          rm -f SHA256SUMS.txt SHA256SUMS.txt.asc
          gh release download "$TAG" --pattern SHA256SUMS.txt --output existing-sums.txt || true
          {
            if [ -f existing-sums.txt ]; then cat existing-sums.txt; fi
            sha256sum -- * | grep -v 'existing-sums\.txt$' || true
          } | awk '!seen[$2]++' > SHA256SUMS.txt
          rm -f existing-sums.txt
          if [ "$SIGNING_ENABLED" = "true" ]; then
            gpg --batch --yes --local-user "$SIGNING_FPR" --armor --detach-sign -o SHA256SUMS.txt.asc SHA256SUMS.txt
            gpgv --quiet --keyring "$SIGNING_PUBKEY" SHA256SUMS.txt.asc SHA256SUMS.txt
          fi
      - name: Upload Linux packages to the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(.linux-packages/*)
          [ "${#files[@]}" -gt 0 ] || exit 0
          gh release upload "$TAG" --clobber "${files[@]}"

  notify-website:
    name: Trigger website repo version bump
    needs: [validate, publish, publish-linux-packages]
    if: >-
      !cancelled() && needs.validate.result == 'success' && needs.validate.outputs.admitted == 'true' &&
      needs.publish.result == 'success' &&
      (!inputs.publish-linux-packages || needs.publish-linux-packages.result == 'success') &&
      github.repository == 'storytold/photocraft' && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/release' && github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check out only the actual release execution source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-source
          persist-credentials: false
      - name: Bind protected policy and actual immutable defining workflow
        shell: bash
        env:
          DEFINING_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_SHA: ${{ job.workflow_sha }}
        run: |
          test "$(git -C .release-source rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -I -B - <<'PY'
          import json, os, re
          p = os.environ['TOOLING_REVISION']
          assert re.fullmatch('[0-9a-f]{40}', p) and p != '0'*40
          assert os.environ['DEFINING_REPOSITORY'] == 'storytold/craft-common-actions'
          assert os.environ['DEFINING_SHA'] == p
          config = json.load(open('.release-source/.github/nightly-signing-policy.json'))
          assert config['schema']=='craft-nightly-release-policy/v3'
          assert config['signer_tooling_revision'] == p
          PY
      - name: Trigger website repo version bump
        env:
          GH_TOKEN: ${{ secrets.ARTCRAFT_SERVICES_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::ARTCRAFT_SERVICES_DISPATCH_TOKEN is not set; skipping storytold/artcraft-services update-craft-release-versions.yml dispatch."
            exit 0
          fi
          if ! gh workflow run update-craft-release-versions.yml --repo storytold/artcraft-services; then
            echo "::warning::Failed to dispatch update-craft-release-versions.yml on storytold/artcraft-services."
          fi
