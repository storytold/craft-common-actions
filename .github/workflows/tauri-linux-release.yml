name: Tauri Linux release
on:
  workflow_call:
    secrets:
      LINUX_SIGNING_KEY:
        required: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-22.04}
          - {arch: aarch64, runner: ubuntu-22.04-arm}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      SQLX_OFFLINE: 'true'
      VITE_ENVIRONMENT_TYPE: production
      TAURI_FRONTEND_PATH: ${{ github.workspace }}/frontend
      TAURI_APP_PATH: ${{ github.workspace }}/crates/desktop/artcraft
    steps:
      - uses: actions/checkout@v4
      - uses: storytold/craft-common-actions/actions/install-apt-packages@main
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libclang-dev cmake nasm rpm
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: tauri-linux-${{ matrix.arch }}
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: ./node_modules/.bin/nx run artcraft:build
        working-directory: frontend
      - uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        with:
          projectPath: crates/desktop/artcraft
          args: --bundles deb,rpm,appimage --config '{"build":{"beforeBuildCommand":""}}'
      - name: Collect packages
        run: |
          mkdir -p dist/release
          find target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} dist/release/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "value=$(jq -r .version crates/desktop/artcraft/tauri.conf.json)" >> "$GITHUB_OUTPUT"
      - name: Require signing key
        env:
          SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
        run: test -n "$SIGNING_KEY"
      - uses: storytold/craft-common-actions/actions/draft-release@main
        with:
          version: ${{ steps.version.outputs.value }}
          app-title: ArtCraft Studio
          tag-prefix: artcraft-linux-v
          github-token: ${{ secrets.GITHUB_TOKEN }}
          signing-key: ${{ secrets.LINUX_SIGNING_KEY }}
