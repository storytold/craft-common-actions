name: "Packaging lint"

on:
  workflow_call:
    inputs:
      actionlint-version:
        description: "Version of actionlint to install"
        type: string
        required: false
        default: "1.7.12"
      extra-checks-script:
        description: "Optional repository-local Bash script for app-specific packaging checks"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run packaging lint
        uses: storytold/craft-common-actions/actions/packaging-lint@main
        with:
          actionlint-version: ${{ inputs.actionlint-version }}
      - name: App-specific packaging checks
        if: inputs.extra-checks-script != ''
        env:
          CHECKS_SCRIPT: ${{ inputs.extra-checks-script }}
        run: |
          case "$CHECKS_SCRIPT" in
            ""|/*|../*|*/../*|*/..)
              echo "::error::extra-checks-script must be a relative path inside the repository"
              exit 1
              ;;
          esac
          if [ ! -f "$CHECKS_SCRIPT" ]; then
            echo "::error::extra-checks-script was not found: $CHECKS_SCRIPT"
            exit 1
          fi
          bash -- "$CHECKS_SCRIPT"
