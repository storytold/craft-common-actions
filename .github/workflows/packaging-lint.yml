name: "Packaging lint"

on:
  workflow_call:
    inputs:
      actionlint-version:
        description: "Version of actionlint to install"
        type: string
        required: false
        default: "1.7.12"
      extra-checks-script:
        description: "Optional repository-local Bash script for app-specific packaging checks"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.amazontrust.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            *.github.com:443
            *.githubusercontent.com:443
            *.microsoft.com:443
            *.ubuntu.com:80
            *.ubuntu.com:443
            api.github.com:443
            archive.ubuntu.com:80
            archive.ubuntu.com:443
            azure.archive.ubuntu.com:80
            azure.archive.ubuntu.com:443
            github.com:443
            *.dotsrc.org:443
            *.kernel.org:443
            mirrors.dotsrc.org:443
            mirrors.edge.kernel.org:443
            objects.githubusercontent.com:443
            packages.microsoft.com:443
            release-assets.githubusercontent.com:443
            security.ubuntu.com:80
            security.ubuntu.com:443
            security.ubuntu.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run packaging lint
        uses: storytold/craft-common-actions/actions/packaging-lint@main
        with:
          actionlint-version: ${{ inputs.actionlint-version }}
      - name: App-specific packaging checks
        if: inputs.extra-checks-script != ''
        env:
          CHECKS_SCRIPT: ${{ inputs.extra-checks-script }}
        run: bash -- "$CHECKS_SCRIPT"
