name: unreached-rs test

on:
  pull_request:
    paths:
      - actions/unreached-rs/**
      - tests/test_unreached_rs.py
      - .github/workflows/test-unreached-rs.yml
  push:
    branches: [main]
    paths:
      - actions/unreached-rs/**
      - tests/test_unreached_rs.py
      - .github/workflows/test-unreached-rs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: block
          allowed-endpoints: >
            *.amazontrust.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            api.github.com:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: unreached-rs unit tests
        run: python3 -m unittest tests/test_unreached_rs.py
