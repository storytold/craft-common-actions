name: "FreeBSD"

on:
  workflow_call:
    inputs:
      architectures:
        description: 'JSON architecture array'
        type: string
        required: false
        default: ""
      craft-fonts-ref:
        description: "The commit ref for storytold/craft-fonts (optional)"
        type: string
        required: false
        default: ""
      require-craft-fonts:
        description: "Require the supplied craft-fonts checkout during builds and tests"
        type: boolean
        required: false
        default: false
      freebsd-release:
        description: "FreeBSD OS release version to run in the VM"
        type: string
        required: false
        default: "15.1-STABLE"
      cargo-test-extra-args:
        description: "Extra arguments to append to cargo test (optional)"
        type: string
        required: false
        default: ""
      cargo-build-extra-args:
        description: "Extra arguments to append to cargo build (optional)"
        type: string
        required: false
        default: ""
      skip-tests:
        description: "Skip running tests"
        type: boolean
        required: false
        default: false
      run-package-check:
        description: "Run packaging script"
        type: boolean
        required: false
        default: false
      custom-test-command:
        description: "Custom test commands to run instead of default cargo test"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  freebsd:
    name: FreeBSD x86_64 (Cross-Compile)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Check out craft-fonts
        if: inputs.craft-fonts-ref != ''
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: ${{ inputs.craft-fonts-ref }}

      - name: Extract FreeBSD Sysroot
        run: |
          wget -q --max-redirect=0 https://download.freebsd.org/releases/amd64/15.0-RELEASE/base.txz
          mkdir -p freebsd-sysroot
          tar -xf base.txz -C freebsd-sysroot ./lib/ ./usr/lib/ ./usr/include/ ./libexec/ 2>/dev/null || true
          rm -f base.txz
          # Create symlinks for C++ dynamic libraries to prevent linking failures
          ln -sf ../usr/lib/libcxxrt.so.1 freebsd-sysroot/lib/libcxxrt.so.1 2>/dev/null || true
          ln -sf ../usr/lib/libc++.so.1 freebsd-sysroot/lib/libc++.so.1 2>/dev/null || true

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config
          rustup target add x86_64-unknown-freebsd

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: true

      # Host (proc-macros, build scripts) and FreeBSD target artifacts share this cache.
      # The prefix encodes the sysroot release so a base.txz bump invalidates it.
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          prefix-key: v1-freebsd-15.0-x86_64
          shared-key: cross-compile
          workspaces: . -> target
          cache-on-failure: true

      - name: Cross Compile Workspace (Build Only)
        run: |
          set -eu
          SYSROOT_PATH="${{ github.workspace }}/freebsd-sysroot"
          
          export PKG_CONFIG_ALLOW_CROSS=1
          export PKG_CONFIG_SYSROOT_DIR="$SYSROOT_PATH"
          
          export CC_x86_64_unknown_freebsd=clang
          export CXX_x86_64_unknown_freebsd=clang++
          
          export CFLAGS="--target=x86_64-unknown-freebsd --sysroot=$SYSROOT_PATH"
          export CXXFLAGS="--target=x86_64-unknown-freebsd --sysroot=$SYSROOT_PATH"
          
          export CARGO_TARGET_X86_64_UNKNOWN_FREEBSD_LINKER=clang
          export CARGO_TARGET_X86_64_UNKNOWN_FREEBSD_RUSTFLAGS="-Clink-arg=--target=x86_64-unknown-freebsd -Clink-arg=--sysroot=$SYSROOT_PATH -Clink-arg=-fuse-ld=lld -Clink-arg=-L$SYSROOT_PATH/lib -Clink-arg=-L$SYSROOT_PATH/usr/lib"
          
          # Dynamically check if craft-fonts exists
          if [ -d craft-fonts ]; then
            export CRAFT_FONTS_DIR="$PWD/craft-fonts"
          fi
          
          if [ "${{ inputs.require-craft-fonts }}" = "true" ]; then
            if [ ! -d craft-fonts ]; then
              echo "error: required craft-fonts checkout is missing" >&2
              exit 1
            fi
            export CRAFT_FONTS_REQUIRED=1
          fi
          
          # Use release profile and strip debug info to save disk space
          export CARGO_PROFILE_DEV_DEBUG=0
          export CARGO_PROFILE_TEST_DEBUG=0
          
          cargo build --release --workspace --locked ${{ inputs.cargo-build-extra-args }}

      - name: Run Tests in FreeBSD VM
        if: inputs.skip-tests != true
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: '15.1'
          usesh: true
          prepare: |
            pkg install -y bash git curl pkgconf cmake python3 libxkbcommon wayland libX11 libXcursor libXrandr libXi libxcb mesa-libs vulkan-loader gtk3 fontconfig freetype2 alsa-lib dejavu
          run: |
            set -eu
            # Because vmactions syncs the workspace, the target directory is already here
            # We only need to run the tests, not rebuild
            if [ "${{ inputs.custom-test-command }}" != "" ]; then
              ${{ inputs.custom-test-command }}
            else
              cargo test --workspace --locked ${{ inputs.cargo-test-extra-args }}
            fi

      - name: Package
        if: inputs.run-package-check
        run: |
          # Match the official packaging logic
          if [ -f packaging/freebsd/package.sh ]; then
            CARGO_BUILD_JOBS=4 bash packaging/freebsd/package.sh
          else
            # If no packaging script exists, execute the original default manual packaging logic
            VERSION=$(grep -m 1 '^version' Cargo.toml | awk -F'"' '{print $2}' || echo "0.10.0")
            NAME="${{ inputs.app-name }}-${VERSION}-freebsd-x86_64"
            mkdir -p "dist/release/$NAME"
            mkdir -p "dist/release/$NAME/icons"
            
            find target/x86_64-unknown-freebsd/debug -maxdepth 1 -type f -executable -name "${{ inputs.app-name }}*" -exec cp {} "dist/release/$NAME/" \;
            cp README.md LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md "dist/release/$NAME/" 2>/dev/null || true
            cp packaging/linux/ai.storyteller.${{ inputs.app-name }}.desktop "dist/release/$NAME/" 2>/dev/null || true
            cp -R assets/app-icon/hicolor "dist/release/$NAME/icons/" 2>/dev/null || true
            
            tar -C dist/release -czf "dist/release/$NAME.tar.gz" "$NAME"
            rm -rf "dist/release/$NAME"
          fi