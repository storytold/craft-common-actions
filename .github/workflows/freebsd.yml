name: "FreeBSD"

on:
  workflow_call:
    inputs:
      architectures:
        description: 'JSON architecture array'
        type: string
        required: false
        default: ""
      craft-fonts-ref:
        # The suite's craft-fonts pin, as in release.yml.
        description: "The commit ref for storytold/craft-fonts. Defaults to the suite's pin; empty builds without craft-fonts"
        type: string
        required: false
        default: "bfcbf714e45a3ea8e98f88ab2b7971372a576414"
      require-craft-fonts:
        description: "Require the supplied craft-fonts checkout during builds and tests"
        type: boolean
        required: false
        default: false
      freebsd-release:
        description: "FreeBSD OS release version to run in the VM"
        type: string
        required: false
        default: "15.1-STABLE"
      cargo-test-extra-args:
        description: "Extra arguments to append to cargo test (optional)"
        type: string
        required: false
        default: ""
      cargo-build-extra-args:
        description: "Extra arguments to append to cargo build (optional)"
        type: string
        required: false
        default: ""
      skip-tests:
        description: "Skip running tests"
        type: boolean
        required: false
        default: false
      run-package-check:
        description: "Run packaging script"
        type: boolean
        required: false
        default: false
      custom-test-command:
        description: "Custom test commands to run instead of default cargo test"
        type: string
        required: false
        default: ""
      app-name:
        description: "App name for packaging"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  freebsd:
    name: FreeBSD ${{ matrix.arch }} (Cross-Compile)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architectures != '' && inputs.architectures || ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && '["x86_64"]' || '["x86_64","aarch64"]')) }}
        profile: [debug]
    
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Check out craft-fonts
        if: inputs.craft-fonts-ref != ''
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: ${{ inputs.craft-fonts-ref }}

      - name: Extract FreeBSD Sysroot
        run: |
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            URL="https://download.freebsd.org/releases/amd64/15.0-RELEASE/base.txz"
          else
            URL="https://download.freebsd.org/releases/arm64/aarch64/15.0-RELEASE/base.txz"
          fi
          echo "Downloading sysroot from $URL..."
          curl -fL --retry 3 --connect-timeout 30 --max-time 600 -o base.txz "$URL"
          mkdir -p freebsd-sysroot
          tar -xf base.txz -C freebsd-sysroot ./lib/ ./usr/lib/ ./usr/include/ ./libexec/
          rm -f base.txz
          # Create symlinks for C++ dynamic libraries to prevent linking failures
          ln -sf ../usr/lib/libcxxrt.so.1 freebsd-sysroot/lib/libcxxrt.so.1 2>/dev/null || true
          ln -sf ../usr/lib/libc++.so.1 freebsd-sysroot/lib/libc++.so.1 2>/dev/null || true


      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: true

      - name: Detect required extra libs
        id: detect-libs
        run: |
          if grep -qE 'name = "(alsa-sys|alsa|wayland-sys|libpulse-sys|x11-sys)"' Cargo.lock; then
            echo "needs_extra_libs=true" >> $GITHUB_OUTPUT
          else
            echo "needs_extra_libs=false" >> $GITHUB_OUTPUT
          fi

      - name: Restore FreeBSD Extra Packages
        if: steps.detect-libs.outputs.needs_extra_libs == 'true'
        id: cache-pkgs
        uses: actions/cache@v4
        with:
          path: packages
          key: freebsd-pkgs-${{ matrix.arch }}-v1

      - name: Fetch FreeBSD Third-party Packages via VM
        if: steps.detect-libs.outputs.needs_extra_libs == 'true' && steps.cache-pkgs.outputs.cache-hit != 'true'
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: '15.1'
          usesh: true
          copyback: true
          prepare: |
            pkg update -f
          run: |
            set -eu
            if [ "${{ matrix.arch }}" = "x86_64" ]; then
              ABI="FreeBSD:15:amd64"
            else
              ABI="FreeBSD:15:aarch64"
            fi
            # Fetch packages and all dependencies
            env ABI=$ABI pkg fetch -y -d alsa-lib wayland libX11 libXcursor libXrandr libXi libxcb mesa-libs vulkan-loader gtk3 fontconfig freetype2 || { echo 'Error: pkg fetch failed'; exit 1; }
            mkdir -p $GITHUB_WORKSPACE/packages
            cp /var/cache/pkg/*.pkg $GITHUB_WORKSPACE/packages/

      - name: Extract Packages into Sysroot
        if: steps.detect-libs.outputs.needs_extra_libs == 'true'
        run: |
          if [ -d packages ]; then
            for pkg in packages/*.pkg; do
              tar -xf "$pkg" -C freebsd-sysroot --exclude '+*'
            done
          fi

      - name: Setup Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld pkg-config
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            rustup target add aarch64-unknown-freebsd
          else
            rustup target add x86_64-unknown-freebsd
          fi

      # Use actions/cache with explicit restore/save to ensure the target directory is cached even on failure.
      - name: Restore Cargo artifacts
        id: cache-cargo
        uses: actions/cache/restore@v4
        with:
          path: target
          key: v1-cargo-${{ matrix.arch }}-${{ matrix.profile }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            v1-cargo-${{ matrix.arch }}-${{ matrix.profile }}-

      - name: Cross Compile Workspace (Build Only)
        run: |
          set -eu
          SYSROOT_PATH="${{ github.workspace }}/freebsd-sysroot"
          TARGET_TRIPLE="${{ matrix.arch }}-unknown-freebsd"
          
          export PKG_CONFIG_ALLOW_CROSS=1
          export PKG_CONFIG_SYSROOT_DIR="$SYSROOT_PATH"
          export PKG_CONFIG_LIBDIR="$SYSROOT_PATH/usr/local/libdata/pkgconfig:$SYSROOT_PATH/usr/libdata/pkgconfig:$SYSROOT_PATH/usr/lib/pkgconfig"
          export PKG_CONFIG_PATH="$SYSROOT_PATH/usr/local/libdata/pkgconfig:$SYSROOT_PATH/usr/libdata/pkgconfig:$SYSROOT_PATH/usr/lib/pkgconfig"
          
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            export CC_aarch64_unknown_freebsd=clang
            export CXX_aarch64_unknown_freebsd=clang++
            export CARGO_TARGET_AARCH64_UNKNOWN_FREEBSD_LINKER=clang
            export CARGO_TARGET_AARCH64_UNKNOWN_FREEBSD_RUSTFLAGS="-Clink-arg=--target=$TARGET_TRIPLE -Clink-arg=--sysroot=$SYSROOT_PATH -Clink-arg=-fuse-ld=lld -Clink-arg=-L$SYSROOT_PATH/lib -Clink-arg=-L$SYSROOT_PATH/usr/lib"
            export BUILD_STD_ARGS=""
            export CARGO_CMD="cargo"
          else
            export CC_x86_64_unknown_freebsd=clang
            export CXX_x86_64_unknown_freebsd=clang++
            export CARGO_TARGET_X86_64_UNKNOWN_FREEBSD_LINKER=clang
            export CARGO_TARGET_X86_64_UNKNOWN_FREEBSD_RUSTFLAGS="-Clink-arg=--target=$TARGET_TRIPLE -Clink-arg=--sysroot=$SYSROOT_PATH -Clink-arg=-fuse-ld=lld -Clink-arg=-L$SYSROOT_PATH/lib -Clink-arg=-L$SYSROOT_PATH/usr/lib"
            export BUILD_STD_ARGS=""
            export CARGO_CMD="cargo"
          fi
          
          # Scope CFLAGS to the target triple so host-side C builds (e.g., build scripts) aren't polluted
          TRIPLE_UPPER=$(echo $TARGET_TRIPLE | tr 'a-z-' 'A-Z_')
          export CFLAGS_$TRIPLE_UPPER="--target=$TARGET_TRIPLE --sysroot=$SYSROOT_PATH"
          export CXXFLAGS_$TRIPLE_UPPER="--target=$TARGET_TRIPLE --sysroot=$SYSROOT_PATH"
          # Set generic ones for C dependencies that don't respect suffixed variables
          export CFLAGS="--target=$TARGET_TRIPLE --sysroot=$SYSROOT_PATH"
          export CXXFLAGS="--target=$TARGET_TRIPLE --sysroot=$SYSROOT_PATH"
          
          # Dynamically check if craft-fonts exists
          if [ -d craft-fonts ]; then
            export CRAFT_FONTS_DIR="$PWD/craft-fonts"
          fi
          
          if [ "${{ inputs.require-craft-fonts }}" = "true" ]; then
            if [ ! -d craft-fonts ]; then
              echo "error: required craft-fonts checkout is missing" >&2
              exit 1
            fi
            export CRAFT_FONTS_REQUIRED=1
          fi
          
          # Use release profile and strip debug info to save disk space
          export CARGO_PROFILE_DEV_DEBUG=0
          export CARGO_PROFILE_TEST_DEBUG=0
          
          # Build main workspace
          $CARGO_CMD build --release --workspace --target=$TARGET_TRIPLE --locked $BUILD_STD_ARGS ${{ inputs.cargo-build-extra-args }}
          
          # Precompile tests using matrix.profile to test both debug and release parallelly
          if [ "${{ inputs.skip-tests }}" != "true" ]; then
            export CARGO_BUILD_JOBS=3
            if [ "${{ matrix.profile }}" = "release" ]; then
              $CARGO_CMD test --release --workspace --target=$TARGET_TRIPLE --locked --no-run --message-format=json $BUILD_STD_ARGS ${{ inputs.cargo-test-extra-args }} > test-output.json
            else
              $CARGO_CMD test --workspace --target=$TARGET_TRIPLE --locked --no-run --message-format=json $BUILD_STD_ARGS ${{ inputs.cargo-test-extra-args }} > test-output.json
            fi
            jq -r 'select(.reason == "compiler-artifact" and .executable != null and .profile.test == true) | .executable' test-output.json | grep -v "/help-" > test-binaries.txt || true
          fi

      - name: Run Tests in FreeBSD VM
        if: inputs.skip-tests != true
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: ${{ inputs.freebsd-release == '15.1-STABLE' && '15.1' || inputs.freebsd-release }}
          arch: ${{ matrix.arch }}
          usesh: true
          prepare: |
            pkg install -y bash git curl pkgconf cmake python3 libxkbcommon wayland libX11 libXcursor libXrandr libXi libxcb mesa-libs vulkan-loader gtk3 fontconfig freetype2 alsa-lib dejavu rust
          run: |
            set -eu
            # Because vmactions syncs the workspace, the target directory is already here
            # We only need to run the tests, not rebuild
            if [ "${{ inputs.custom-test-command }}" != "" ]; then
              ${{ inputs.custom-test-command }}
            else
              # Execute precompiled test binaries directly to avoid recompilation in VM
              export PATH="$HOME/.cargo/bin:$PATH"
              if [ -f test-binaries.txt ]; then
                while IFS= read -r test_bin; do
                  if [ -x "$test_bin" ]; then
                    if file "$test_bin" | grep -q "${{ matrix.arch }}"; then
                      echo "Running test binary: $test_bin"
                      "$test_bin" || exit 1
                    else
                      echo "Skipping incompatible binary: $test_bin"
                    fi
                  fi
                done < test-binaries.txt
              else
                echo "Error: test-binaries.txt not found!" >&2
                exit 1
              fi
            fi

      - name: Save Cargo artifacts
        if: always() && steps.cache-cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target
          key: v1-cargo-${{ matrix.arch }}-${{ matrix.profile }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Package
        if: inputs.run-package-check
        run: |
          # Match the official packaging logic
          if [ -f packaging/freebsd/package.sh ]; then
            CARGO_BUILD_JOBS=4 bash packaging/freebsd/package.sh
          else
            # If no packaging script exists, execute the original default manual packaging logic
            VERSION=$(grep -m 1 '^version' Cargo.toml | awk -F'"' '{print $2}' || echo "0.10.0")
            NAME="${{ inputs.app-name }}-${VERSION}-freebsd-${{ matrix.arch }}"
            mkdir -p "dist/release/$NAME"
            mkdir -p "dist/release/$NAME/icons"
            
            find target/${{ matrix.arch }}-unknown-freebsd/release -maxdepth 1 -type f -executable -name "${{ inputs.app-name }}*" -exec cp {} "dist/release/$NAME/" \;
            cp README.md LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md "dist/release/$NAME/" 2>/dev/null || true
            cp packaging/linux/ai.storyteller.${{ inputs.app-name }}.desktop "dist/release/$NAME/" 2>/dev/null || true
            cp -R assets/app-icon/hicolor "dist/release/$NAME/icons/" 2>/dev/null || true
            
            tar -C dist/release -czf "dist/release/$NAME.tar.gz" "$NAME"
            rm -rf "dist/release/$NAME"
          fi