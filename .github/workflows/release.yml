          EXACT_ASSET: ${{ steps.plan.outputs.asset }}
        run: |
          set -euo pipefail
          python3 -B .nightly-tools/scripts/nightly_unix.py unpack-private \
            --pending .nightly-tools/nightly-unix-pending.json --platform linux-x86_64 \
            --version "$EXACT_VERSION" --archive "$RUNNER_TEMP/nightly-dist/linux-x86_64/$EXACT_ASSET" \
            --output "$RUNNER_TEMP/nightly-compiler-smoke"
          python3 -B .nightly-tools/scripts/nightly_smoke.py \
            --executable "$RUNNER_TEMP/nightly-compiler-smoke/photocraft" \
            --profile-root "$RUNNER_TEMP/nightly-compiler-profile" --version "$EXACT_VERSION"
      - name: Seal only the exact unsigned compiler bytes
        id: seal
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B .nightly-tools/scripts/nightly_release_entry.py main-seal --platform linux-x86_64 --directory "$RUNNER_TEMP/nightly-dist/linux-x86_64" --plan .unsigned-plan/plan.json --output .unsigned-handoff
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: nightly-unsigned-linux-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: .unsigned-handoff/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  nightly-build-attest-linux:
    if: >-
      inputs.release-phase == 'nightly-build'
    needs: nightly-build-build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    outputs:
      unsigned-sha256: ${{ steps.subject.outputs.unsigned-sha256 }}
    steps:
      # Fresh runner: no app checkout, hooks, payload execution or restored cache.
      - name: Bind defining workflow without loading application code
        env:
          DEFINING_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_SHA: ${{ job.workflow_sha }}
        run: |
          python3 -I -B -c "import os,re; p=os.environ['TOOLING_REVISION']; assert re.fullmatch('[0-9a-f]{40}',p) and p!='0'*40; assert os.environ['DEFINING_REPOSITORY']=='storytold/craft-common-actions'; assert os.environ['DEFINING_SHA']==p"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nightly-tools
          persist-credentials: false
      - name: Require the actual compiler artifact ID and independent compiler hash
        env:
          COMPILER_ARTIFACT: ${{ needs.nightly-build-build-linux.outputs.artifact-id }}
          COMPILER_SHA256: ${{ needs.nightly-build-build-linux.outputs.unsigned-sha256 }}
        run: |
          test "$(git -C .nightly-tools rev-parse HEAD)" = "$TOOLING_REVISION"
          python3 -B .nightly-tools/scripts/nightly_artifacts.py download-contract --artifact-id "$COMPILER_ARTIFACT" --expected-sha256 "$COMPILER_SHA256"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.nightly-build-build-linux.outputs.artifact-id }}
          path: .unsigned
          merge-multiple: true
          digest-mismatch: error
      - name: Independently hash the exact compiler payload and recompute its source identity
        id: subject
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMPILER_SHA256: ${{ needs.nightly-build-build-linux.outputs.unsigned-sha256 }}
        run: python3 -I -B .nightly-tools/scripts/nightly_release_entry.py main-subject --platform linux-x86_64 --directory .unsigned
      - name: Attest actual independently hashed unsigned payload, never a caller digest
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f
        with:
          subject-path: ${{ steps.subject.outputs.subject-path }}

  nightly-build-build-linux-packages:
    if: >-
      inputs.release-phase == 'nightly-build' && (contains(fromJSON(needs.nightly-build-select-platforms.outputs.platforms), 'linux-x86_64') && needs.nightly-build-select-platforms.outputs.linux-package-formats != '[]' && inputs.app-name == 'photocraft' && github.repository == 'storytold/photocraft' && github.ref == 'refs/heads/main')
    name: Linux packages ${{ matrix.arch }}
    needs: [nightly-build-git-sources, nightly-build-select-platforms]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, deb: amd64, target: x86_64-unknown-linux-gnu }
          - { arch: aarch64, runner: ubuntu-22.04-arm, deb: arm64, target: aarch64-unknown-linux-gnu }
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - name: Select Python for nightly helpers
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind immutable defining workflow before any shared code
        env:
          DEFINING_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_SHA: ${{ job.workflow_sha }}
        run: |
          python3 -I -B -c "import os,re; p=os.environ['TOOLING_REVISION']; assert re.fullmatch('[0-9a-f]{40}',p) and p!='0'*40; assert os.environ['DEFINING_REPOSITORY']=='storytold/craft-common-actions'; assert os.environ['DEFINING_SHA']==p"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nightly-tools
          persist-credentials: false
      - name: Prepare exact original-run identity
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C .nightly-tools rev-parse HEAD)" = "$TOOLING_REVISION"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -I -B .nightly-tools/scripts/nightly_release_entry.py main-plan --platform linux-x86_64 --output .unsigned-plan
      - name: Export the app's build variables
        uses: storytold/craft-common-actions/actions/export-app-build-env@f5141455aac7b2eb4708aa259d8ffcdf10fde939
        with:
          app-name: ${{ inputs.app-name }}
          version: ${{ steps.plan.outputs.version }}
          date: ${{ steps.plan.outputs.build-date }}
      - uses: storytold/craft-common-actions/actions/checkout-craft-fonts@f5141455aac7b2eb4708aa259d8ffcdf10fde939
        with:
          ref: ${{ inputs.craft-fonts-ref }}
      - uses: storytold/craft-common-actions/actions/checkout-craft-i18n@f5141455aac7b2eb4708aa259d8ffcdf10fde939
      - uses: storytold/craft-common-actions/actions/install-linux-deps@f5141455aac7b2eb4708aa259d8ffcdf10fde939
        with:
          deb-arch: ${{ matrix.deb }}
          nfpm-version: 2.47.0
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils librsvg2-common skopeo
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - id: rust
        uses: storytold/craft-common-actions/actions/rust-channel@f5141455aac7b2eb4708aa259d8ffcdf10fde939
        with:
          targets: ${{ matrix.target }}
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          targets: ${{ steps.rust.outputs.targets }}
          components: ${{ steps.rust.outputs.components }}
      - name: Build and package (AppImage, deb, rpm, tar.gz) in isolated nightly mode
        env:
          PHOTOCRAFT_BUILD_CHANNEL: nightly-v1
          PHOTOCRAFT_VERSION: ${{ steps.plan.outputs.version }}
          PHOTOCRAFT_OVERRIDE_VERSION: ${{ steps.plan.outputs.version }}
          PHOTOCRAFT_BUILD_SHA: ${{ steps.plan.outputs.source-commit }}
          PHOTOCRAFT_BUILD_DATE: ${{ steps.plan.outputs.build-date }}
          LINUX_PACKAGE_FORMATS: ${{ needs.nightly-build-select-platforms.outputs.linux-package-formats }}
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: '1'
        run: |
          set -euo pipefail
          pkg_formats="$(python3 -I -B -c "import json,os; fmts=set(json.loads(os.environ['LINUX_PACKAGE_FORMATS'])); out=[f for f in ('appimage','deb','rpm') if f in fmts]; out.append('tar'); print(' '.join(out))")"
          arch_tar_args=()
          if python3 -I -B -c "import json,os,sys; sys.exit(0 if 'arch' in json.loads(os.environ['LINUX_PACKAGE_FORMATS']) else 1)"; then
            # This private handoff contains the Arch-only launcher; other formats use dist/release.
            arch_tar_args=(--arch-tar-dir dist/arch-nightly)
          fi
          packaging/linux/package.sh --formats "$pkg_formats" "${arch_tar_args[@]}"
      - name: Build Flatpak bundle and OCI layout
        if: contains(fromJSON(needs.nightly-build-select-platforms.outputs.linux-package-formats), 'flatpak') || contains(fromJSON(needs.nightly-build-select-platforms.outputs.linux-package-formats), 'oci')
        env:
          PHOTOCRAFT_BUILD_CHANNEL: nightly-v1
          PHOTOCRAFT_VERSION: ${{ steps.plan.outputs.version }}
          PHOTOCRAFT_BUILD_SHA: ${{ steps.plan.outputs.source-commit }}
          PHOTOCRAFT_BUILD_DATE: ${{ steps.plan.outputs.build-date }}
          VERSION: ${{ steps.plan.outputs.version }}
          ARCH: ${{ matrix.arch }}
          LINUX_PACKAGE_FORMATS: ${{ needs.nightly-build-select-platforms.outputs.linux-package-formats }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=()
          for f in dist/release/*-"${VERSION}"-linux-"${ARCH}".tar.gz; do
            case "${f##*/}" in *-cli-*|*-server-*) ;; *) tarballs+=("$f") ;; esac
          done
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::expected one app tarball for ${VERSION} in dist/release, found ${#tarballs[@]}: ${tarballs[*]}"
            exit 1
          fi
          base="$(basename "${tarballs[0]}" .tar.gz)"
          if python3 -I -B -c "import json,os,sys; sys.exit(0 if 'oci' in json.loads(os.environ['LINUX_PACKAGE_FORMATS']) else 1)"; then
            test -x packaging/linux/flatpak-oci.sh || { echo "::error::packaging/linux/flatpak-oci.sh is missing or not executable"; exit 1; }
            packaging/linux/flatpak-oci.sh "${tarballs[0]}"
            test -d "dist/release/$base-oci" || { echo "::error::expected OCI layout dist/release/$base-oci not found"; exit 1; }
            python3 -I -B - "dist/release/$base-oci" "dist/release/$base.oci-manifest.json" <<'PY'
          import hashlib, json, pathlib, shutil, sys
          layout, out = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          index = json.loads((layout / "index.json").read_text(encoding="utf-8"))
          manifests = index.get("manifests", [])
          assert len(manifests) == 1, f"expected 1 OCI manifest, got {len(manifests)}"
          digest = manifests[0]["digest"]
          assert digest.startswith("sha256:") and len(digest) == 71
          blob = layout / "blobs" / "sha256" / digest.split(":", 1)[1]
          shutil.copyfile(blob, out)
          assert hashlib.sha256(out.read_bytes()).hexdigest() == digest.split(":", 1)[1]
          manifest_obj = json.loads(blob.read_bytes())
          cfg_hex = manifest_obj["config"]["digest"].split(":", 1)[1]
          cfg_obj = json.loads((layout / "blobs" / "sha256" / cfg_hex).read_bytes())
          ref_label = cfg_obj.get("config", {}).get("Labels", {}).get("org.flatpak.ref", "")
          assert ref_label.startswith("app/ai.storyteller.photocraft.nightly/"), f"expected nightly Flatpak app ID, got {ref_label!r}"
          PY
            if python3 -I -B -c "import json,os,sys; sys.exit(0 if 'flatpak' not in json.loads(os.environ['LINUX_PACKAGE_FORMATS']) else 1)"; then
              rm -f "dist/release/$base.flatpak"
            fi
          else
            packaging/linux/flatpak-bundle.sh --no-test "${tarballs[0]}"
          fi
          if python3 -I -B -c "import json,os,sys; sys.exit(0 if 'flatpak' in json.loads(os.environ['LINUX_PACKAGE_FORMATS']) else 1)"; then
            test -f "dist/release/$base.flatpak" && test -s "dist/release/$base.flatpak" || {
              echo "::error::expected Flatpak bundle dist/release/$base.flatpak not found or empty"
              exit 1
            }
          fi
      - name: Find tarball for Arch package
        id: tarball
        if: contains(fromJSON(needs.nightly-build-select-platforms.outputs.linux-package-formats), 'arch')
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          shopt -s nullglob
          tarballs=()
          for f in dist/arch-nightly/*-"${VERSION}"-linux-"${ARCH}".tar.gz; do
            case "${f##*/}" in *-cli-*|*-server-*) ;; *) tarballs+=("$f") ;; esac
          done
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::expected one app tarball for ${VERSION} in dist/arch-nightly, found ${#tarballs[@]}: ${tarballs[*]}"
            exit 1
          fi
          echo "path=${tarballs[0]}" >> "$GITHUB_OUTPUT"
      - name: Build x86_64 Arch package with reviewed tooling revision and smoke-test side-by-side install
        if: matrix.arch == 'x86_64' && contains(fromJSON(needs.nightly-build-select-platforms.outputs.linux-package-formats), 'arch')
        env:
          TARBALL: ${{ steps.tarball.outputs.path }}
          TARGET_ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.plan.outputs.version }}
          GITHUB_ACTION_PATH: ${{ github.workspace }}/.nightly-tools/actions/arch-package
        run: |
          set -euo pipefail
          bash .nightly-tools/actions/arch-package/run.sh
          smoke_dir="$(mktemp -d .arch-side-by-side.XXXXXX)"
          trap 'rm -rf "$PWD/$smoke_dir"' EXIT
          # The container's non-root builder has a different UID from the runner.
          chmod 0755 "$smoke_dir"
          # The stable fixture must use the ordinary payload, not the Arch nightly launcher.
          cp "dist/release/photocraft-${VERSION}-linux-x86_64.tar.gz" "$smoke_dir/photocraft-0.0.1-linux-x86_64.tar.gz"
          chmod 0644 "$smoke_dir/photocraft-0.0.1-linux-x86_64.tar.gz"
          TARBALL="$smoke_dir/photocraft-0.0.1-linux-x86_64.tar.gz" \
            TARGET_ARCH="x86_64" \
            OUTPUT_DIR="$smoke_dir/out" \
            PKGREL="1" \
            ARCH_LICENSE="LicenseRef-Proprietary" \
            bash .nightly-tools/actions/arch-package/run.sh
          cp "dist/release/photocraft-${VERSION}-linux-x86_64.pkg.tar.zst" "$smoke_dir/out/"
          docker run --rm -v "$PWD/$smoke_dir/out:/pkgs:ro" \
            archlinux:base-devel@sha256:949ecb1661609ab7e8f6854ba03efd62792e7a796313738e94b040c095c20d91 \
            bash -euxc 'pacman -U --noconfirm --assume-installed glibc=2.39 --assume-installed gcc-libs=14.1 --assume-installed hicolor-icon-theme=0.18 --assume-installed libxkbcommon=1.7 --assume-installed libxkbcommon-x11=1.7 --assume-installed vulkan-icd-loader=1.3 /pkgs/photocraft-0.0.1-linux-x86_64.pkg.tar.zst /pkgs/photocraft-*-nightly.*-linux-x86_64.pkg.tar.zst && pacman -Qi ai.storyteller.photocraft ai.storyteller.photocraft.nightly && test -x /usr/bin/photocraft && test -x /usr/bin/photocraft-nightly'
          rm -rf "$smoke_dir"
          trap - EXIT
      - name: Upload aarch64 tarball handoff for Arch package job
        if: matrix.arch == 'aarch64' && contains(fromJSON(needs.nightly-build-select-platforms.outputs.linux-package-formats), 'arch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-linux-arch-aarch64-tarball-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.tarball.outputs.path }}
          if-no-files-found: error
          retention-days: 14
      - name: Smoke-test x86_64 nightly binary channel isolation before removing tarball
        if: matrix.arch == 'x86_64'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pkg-smoke"
          tar -xzf dist/release/photocraft-"${VERSION}"-linux-x86_64.tar.gz -C "$RUNNER_TEMP/pkg-smoke" --strip-components=1
          python3 -B .nightly-tools/scripts/nightly_smoke.py \
            --executable "$RUNNER_TEMP/pkg-smoke/bin/photocraft" \
            --profile-root "$RUNNER_TEMP/pkg-smoke-profile" --version "$VERSION"
      - name: Remove duplicate unsigned tarballs after packaging
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          shopt -s nullglob
          rm -f dist/release/*-"${VERSION}"-linux-"${ARCH}".tar.gz
      - name: Verify built Linux package versions and nightly identities
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in dist/release/*; do
            name="$(basename "$f")"
            case "$name" in
              *-"${VERSION}"-linux-"${ARCH}".deb)
                test "$(dpkg-deb -f "$f" Package)" = "photocraft-nightly" || { echo "::error::$name is not Package: photocraft-nightly"; exit 1; }
                ;;
              *-"${VERSION}"-linux-"${ARCH}".rpm)
                test "$(rpm -qp --qf '%{NAME}' "$f")" = "photocraft-nightly" || { echo "::error::$name is not Name: photocraft-nightly"; exit 1; }
                ;;
              *-"${VERSION}"-linux-"${ARCH}".pkg.tar.zst)
                tar --zstd -xOf "$f" .PKGINFO | grep -Fx 'pkgname = ai.storyteller.photocraft.nightly' >/dev/null || { echo "::error::$name is not pkgname = ai.storyteller.photocraft.nightly"; exit 1; }
                ;;
              *-"${VERSION}"-linux-"${ARCH}".*) ;;
              *-"${VERSION}"-linux-"${ARCH}"-oci) ;;
              *) echo "::error::unexpected package or version mismatch in $name (expected *-${VERSION}-linux-${ARCH}.*)"; exit 1 ;;
            esac
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.arch == 'x86_64' || needs.nightly-build-select-platforms.outputs.linux-package-formats != '["arch"]'
        with:
          name: nightly-linux-packages-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  nightly-build-build-linux-arch-arm:
    if: >-
      inputs.release-phase == 'nightly-build' && (contains(fromJSON(needs.nightly-build-select-platforms.outputs.platforms), 'linux-x86_64') && contains(fromJSON(needs.nightly-build-select-platforms.outputs.linux-package-formats), 'arch') && inputs.app-name == 'photocraft' && github.repository == 'storytold/photocraft' && github.ref == 'refs/heads/main')
    name: Arch Linux aarch64
    needs: [nightly-build-select-platforms, nightly-build-build-linux-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind immutable defining workflow before shared packaging code
        env:
          DEFINING_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_SHA: ${{ job.workflow_sha }}
        run: |
          python3 -I -B -c "import os,re; p=os.environ['TOOLING_REVISION']; assert re.fullmatch('[0-9a-f]{40}',p) and p!='0'*40; assert os.environ['DEFINING_REPOSITORY']=='storytold/craft-common-actions'; assert os.environ['DEFINING_SHA']==p"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nightly-tools
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-linux-arch-aarch64-tarball-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/linux
          if-no-files-found: error
          digest-mismatch: error
      - name: Find aarch64 tarball
        id: tarball
        run: |
          test "$(git -C .nightly-tools rev-parse HEAD)" = "$TOOLING_REVISION"
          shopt -s nullglob
          tarballs=()
          for f in dist/linux/*-linux-aarch64.tar.gz; do
            case "${f##*/}" in *-cli-*|*-server-*) ;; *) tarballs+=("$f") ;; esac
          done
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::expected one aarch64 tarball in dist/linux, found ${#tarballs[@]}: ${tarballs[*]}"
            exit 1
          fi
          echo "path=${tarballs[0]}" >> "$GITHUB_OUTPUT"
      - name: Build aarch64 Arch package with reviewed tooling revision
        env:
          TARBALL: ${{ steps.tarball.outputs.path }}
          TARGET_ARCH: aarch64
          GITHUB_ACTION_PATH: ${{ github.workspace }}/.nightly-tools/actions/arch-package
        run: |
          bash .nightly-tools/actions/arch-package/run.sh
          for f in dist/release/*.pkg.tar.zst; do
            tar --zstd -xOf "$f" .PKGINFO | grep -Fx 'pkgname = ai.storyteller.photocraft.nightly' >/dev/null || { echo "::error::$f is not pkgname = ai.storyteller.photocraft.nightly"; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-linux-arch-aarch64-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

  nightly-build-attest-linux-packages:
    if: >-
      inputs.release-phase == 'nightly-build' && (!cancelled() && contains(fromJSON(needs.nightly-build-select-platforms.outputs.platforms), 'linux-x86_64') && needs.nightly-build-select-platforms.outputs.linux-package-formats != '[]' && needs.nightly-build-build-linux-packages.result == 'success' && (!contains(fromJSON(needs.nightly-build-select-platforms.outputs.linux-package-formats), 'arch') || needs.nightly-build-build-linux-arch-arm.result == 'success') && inputs.app-name == 'photocraft' && github.repository == 'storytold/photocraft' && github.ref == 'refs/heads/main')
    needs: [nightly-build-select-platforms, nightly-build-build-linux-packages, nightly-build-build-linux-arch-arm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
