  release:
    if: >-
      inputs.release-phase == 'standard' && (!inputs.dry-run && !cancelled() && !contains(needs.*.result, 'failure'))
    timeout-minutes: 10
    name: Draft GitHub Release
    needs: [version, macos, windows, linux, linux-riscv64, flatpak, arch, freebsd, web, server]
    runs-on: ubuntu-24.04
    environment: ${{ !inputs.dry-run && 'release' || '' }}
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: storytold/craft-common-actions/actions/draft-release@main
        with:
          version: ${{ needs.version.outputs.version }}
          app-title: ${{ inputs.app-title }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          signing-key: ${{ github.ref == 'refs/heads/release' && secrets.LINUX_SIGNING_KEY || '' }}
      - name: Publish the release
        if: inputs.publish && !inputs.dry-run && github.ref == 'refs/heads/release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.version.outputs.version }}
          CANCELLED: ${{ contains(needs.*.result, 'cancelled') }}
        run: |
          set -euo pipefail
          refuse() {
            echo "::error::$1"
            echo "Not published: $1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          if [ "$CANCELLED" != false ]; then
            refuse "a build job was cancelled: $TAG stays a draft"
          fi
          now="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          # The most recently published release; gh lists by creation, not publication.
          last="$(gh release list --exclude-drafts --exclude-pre-releases --limit 50 --json tagName,publishedAt --jq 'sort_by(.publishedAt) | last | .tagName // ""')"
          if [ -n "$last" ] && [ "$last" != "$TAG" ]; then
            before="$(gh release view "$last" --json assets --jq '.assets | length')"
            if [ "$now" -lt "$before" ]; then
              refuse "$TAG has $now assets where $last had $before: it stays a draft"
            fi
          fi
          gh release edit "$TAG" --draft=false
          echo "Published $TAG ($now assets)." >> "$GITHUB_STEP_SUMMARY"
      - name: Trigger website repo version bump
        if: inputs.publish && !inputs.dry-run && github.ref == 'refs/heads/release'
        env:
          GH_TOKEN: ${{ secrets.ARTCRAFT_SERVICES_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::ARTCRAFT_SERVICES_DISPATCH_TOKEN is not set; skipping storytold/artcraft-services update-craft-release-versions.yml dispatch."
            exit 0
          fi
          if ! gh workflow run update-craft-release-versions.yml --repo storytold/artcraft-services; then
            echo "::warning::Failed to dispatch update-craft-release-versions.yml on storytold/artcraft-services."
          fi

  # nightly-build: original trust boundary; no dependencies on other phases.
  nightly-build-git-sources:
    if: >-
      inputs.release-phase == 'nightly-build' && (inputs.app-name == 'photocraft' && github.repository == 'storytold/photocraft' && github.ref == 'refs/heads/main')
    name: Git dependencies come from storytold
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Git dependencies come from storytold
        run: |
          set -euo pipefail
          test -f Cargo.lock || { echo "Cargo.lock is missing"; exit 1; }
          # Source replacement, patches and path overrides in cargo config never show up
          # in Cargo.lock. Parsed rather than grepped: TOML has many spellings of one key.
          # Cargo still reads the legacy .cargo/config.
          python3 - <<'PY'
          import os, sys, tomllib
          for path in (".cargo/config", ".cargo/config.toml"):
              if not os.path.exists(path):
                  continue
              config = tomllib.load(open(path, "rb"))
              replaced = [name for name, source in config.get("source", {}).items()
                          if isinstance(source, dict) and "replace-with" in source]
              if replaced or "patch" in config or "paths" in config:
                  print(f"{path} replaces, patches or overrides a source")
                  sys.exit(1)
          PY
          # Check locked git origins first: cargo metadata resolves and can fetch them.
          python3 - <<'PY'
          import sys, tomllib
          lock = tomllib.load(open("Cargo.lock", "rb"))
          bad = sorted({p["source"] for p in lock.get("package", [])
                        if p.get("source", "").startswith("git+")
                        and not p["source"].startswith("git+https://github.com/storytold/")})
          if bad:
              print("Git dependencies outside github.com/storytold:", *bad, sep="\n")
              sys.exit(1)
          PY
          # Fails when Cargo.lock is out of date with the manifests.
          cargo metadata --locked --format-version 1 > /dev/null


  nightly-build-select-platforms:
    if: >-
      inputs.release-phase == 'nightly-build' && (inputs.app-name == 'photocraft' && github.repository == 'storytold/photocraft' && github.ref == 'refs/heads/main')
    # Validate the caller's list once. Build jobs then match exact array elements; a bare
    # JSON string such as "not-linux-x86_64" can never substring-match a platform.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      platforms: ${{ steps.select.outputs.platforms }}
      linux-package-formats: ${{ steps.select-packages.outputs.formats }}
    steps:
      - name: Require a JSON array of distinct supported platform IDs
        id: select
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          python3 -I -B - <<'PY'
          import json, os, sys
          supported = {'linux-x86_64', 'macos-aarch64', 'windows-x86_64'}
          try:
              value = json.loads(os.environ['PLATFORMS'])
          except ValueError:
              sys.exit('platforms must be a JSON array of supported platform IDs')
          if not (isinstance(value, list) and value and all(isinstance(item, str) and item in supported for item in value)):
              sys.exit('platforms must be a non-empty JSON array of supported platform IDs')
          if len(set(value)) != len(value):
              sys.exit('platforms must not repeat a platform')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('platforms='+json.dumps(sorted(value), separators=(',', ':'))+'\n')
          PY
      - name: Validate optional Linux package formats
        id: select-packages
        env:
          PLATFORMS: ${{ steps.select.outputs.platforms }}
          LINUX_PACKAGE_FORMATS: ${{ inputs.linux-package-formats }}
        run: |
          python3 -I -B - <<'PY'
          import json, os, sys
          supported = {'deb', 'rpm', 'appimage', 'flatpak', 'oci', 'arch'}
          platforms = json.loads(os.environ['PLATFORMS'])
          try:
              fmts = json.loads(os.environ['LINUX_PACKAGE_FORMATS'])
          except ValueError:
              sys.exit('linux-package-formats must be a JSON array')
          if not (isinstance(fmts, list) and all(isinstance(f, str) and f in supported for f in fmts) and len(set(fmts)) == len(fmts)):
              sys.exit('linux-package-formats must be a JSON array of distinct supported formats')
          if fmts and 'linux-x86_64' not in platforms:
              sys.exit('linux-package-formats requires linux-x86_64 in platforms')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              stream.write('formats='+json.dumps(sorted(fmts), separators=(',', ':'))+'\n')
          PY

  nightly-build-build:
    if: >-
      inputs.release-phase == 'nightly-build' && (inputs.app-name == 'photocraft' && github.repository == 'storytold/photocraft' && github.ref == 'refs/heads/main' && contains(fromJSON(needs.nightly-build-select-platforms.outputs.platforms), 'windows-x86_64'))
    needs: [nightly-build-git-sources, nightly-build-select-platforms]
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      unsigned-sha256: ${{ steps.seal.outputs.unsigned-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind immutable defining workflow before any shared code
        shell: pwsh
        env:
          DEFINING_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_SHA: ${{ job.workflow_sha }}
        run: |
          python -I -B -c "import os,re; p=os.environ['TOOLING_REVISION']; assert re.fullmatch('[0-9a-f]{40}',p) and p!='0'*40; assert os.environ['DEFINING_REPOSITORY']=='storytold/craft-common-actions'; assert os.environ['DEFINING_SHA']==p"
          if ($LASTEXITCODE -ne 0) { throw 'unreviewed defining workflow' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nightly-tools
          persist-credentials: false
      - name: Prepare exact original-run identity without editing source
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ((git -C .nightly-tools rev-parse HEAD) -cne $env:TOOLING_REVISION) { throw 'tooling checkout differs' }
          python -I -B .nightly-tools/scripts/nightly_release_entry.py main-plan --platform windows-x86_64 --output .unsigned-plan
          if ($LASTEXITCODE -ne 0) { throw 'unsigned producer identity refused' }
      - uses: storytold/craft-common-actions/actions/checkout-craft-fonts@f5141455aac7b2eb4708aa259d8ffcdf10fde939
        with:
          ref: ${{ inputs.craft-fonts-ref }}
      - uses: storytold/craft-common-actions/actions/checkout-craft-i18n@f5141455aac7b2eb4708aa259d8ffcdf10fde939
      - id: rust
        uses: storytold/craft-common-actions/actions/rust-channel@f5141455aac7b2eb4708aa259d8ffcdf10fde939
        with:
          targets: x86_64-pc-windows-msvc
      - uses: step-security/dtolnay-rust-toolchain@8dd607977d06adf4ed49b190381e74c17a9dd25f # v1.0.0
        with:
          toolchain: ${{ steps.rust.outputs.toolchain }}
          targets: ${{ steps.rust.outputs.targets }}
          components: ${{ steps.rust.outputs.components }}
      # No platform secrets, environment, OIDC permission, cache, or version mutation.
      - name: Compile unsigned package only
        shell: pwsh
        env:
          PHOTOCRAFT_BUILD_CHANNEL: nightly-v1
          PHOTOCRAFT_VERSION: ${{ steps.plan.outputs.version }}
          PHOTOCRAFT_BUILD_SHA: ${{ steps.plan.outputs.source-commit }}
          PHOTOCRAFT_BUILD_DATE: ${{ steps.plan.outputs.build-date }}
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: '1'
          DIST: dist
        run: |
          pwsh -NoProfile -File packaging/windows/package.ps1 -Arch x64 -Nightly -BuildOnly
          if ($LASTEXITCODE -ne 0) { throw 'unsigned compiler failed' }
      - name: Smoke only in the credentialless compiler job
        shell: pwsh
        env:
          EXACT_VERSION: ${{ steps.plan.outputs.version }}
          EXACT_ASSET: ${{ steps.plan.outputs.unsigned-asset }}
        run: |
          $unpack = Join-Path $env:RUNNER_TEMP 'nightly-compiler-smoke'
          $profile = Join-Path $env:RUNNER_TEMP 'nightly-compiler-profile'
          Expand-Archive -LiteralPath (Join-Path 'dist' $env:EXACT_ASSET) -DestinationPath $unpack
          python -B .nightly-tools/scripts/nightly_smoke.py --executable (Join-Path $unpack 'photocraft.exe') --profile-root $profile --version $env:EXACT_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'unsigned GUI smoke failed' }
      - name: Seal only the exact unsigned compiler bytes
        id: seal
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -I -B .nightly-tools/scripts/nightly_release_entry.py main-seal --platform windows-x86_64 --directory dist --plan .unsigned-plan/plan.json --output .unsigned-handoff
          if ($LASTEXITCODE -ne 0) { throw 'compiler handoff refused' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: nightly-unsigned-windows-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: .unsigned-handoff/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
