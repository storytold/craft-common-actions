  freebsd:
    name: FreeBSD ${{ matrix.arch }}
    if: inputs.has-freebsd
    needs: [version]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # aarch64 is in the default freebsd-architectures; callers can narrow it (#39).
        arch: ${{ fromJSON(inputs.freebsd-architectures) }}
    env:
      APP_NAME: ${{ inputs.app-name }}
      CARGO_HOME: /var/tmp/craft-cargo
      CARGO_TARGET_DIR: /var/tmp/craft-target
      CARGO_BUILD_JOBS: 4
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_DATE: ${{ needs.version.outputs.date }}
      BUILD_SHA: ${{ github.sha }}
      CADCRAFT_VERSION: ${{ needs.version.outputs.version }}
      CADCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      CADCRAFT_BUILD_SHA: ${{ github.sha }}
      ARTCRAFT_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
      ARTCRAFT_LAUNCHER_BUILD_DATE: ${{ needs.version.outputs.date }}
      ARTCRAFT_LAUNCHER_BUILD_SHA: ${{ github.sha }}
      DECKCRAFT_VERSION: ${{ needs.version.outputs.version }}
      DECKCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      DECKCRAFT_BUILD_SHA: ${{ github.sha }}
      DESIGNCRAFT_VERSION: ${{ needs.version.outputs.version }}
      DESIGNCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      DESIGNCRAFT_BUILD_SHA: ${{ github.sha }}
      EFFECTCRAFT_VERSION: ${{ needs.version.outputs.version }}
      EFFECTCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      EFFECTCRAFT_BUILD_SHA: ${{ github.sha }}
      FILMCRAFT_VERSION: ${{ needs.version.outputs.version }}
      FILMCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      FILMCRAFT_BUILD_SHA: ${{ github.sha }}
      GRIDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      GRIDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      GRIDCRAFT_BUILD_SHA: ${{ github.sha }}
      LIGHTCRAFT_VERSION: ${{ needs.version.outputs.version }}
      LIGHTCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      LIGHTCRAFT_BUILD_SHA: ${{ github.sha }}
      PDFCRAFT_VERSION: ${{ needs.version.outputs.version }}
      PDFCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      PDFCRAFT_BUILD_SHA: ${{ github.sha }}
      PHOTOCRAFT_VERSION: ${{ needs.version.outputs.version }}
      PHOTOCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      PHOTOCRAFT_BUILD_SHA: ${{ github.sha }}
      SOUNDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      SOUNDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      SOUNDCRAFT_BUILD_SHA: ${{ github.sha }}
      VECTORCRAFT_VERSION: ${{ needs.version.outputs.version }}
      VECTORCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      VECTORCRAFT_BUILD_SHA: ${{ github.sha }}
      WORDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      WORDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      WORDCRAFT_BUILD_SHA: ${{ github.sha }}
      FIGCRAFT_VERSION: ${{ needs.version.outputs.version }}
      FIGCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      FIGCRAFT_BUILD_SHA: ${{ github.sha }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - name: Check the FreeBSD architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          # The guest is always x86_64 and only aarch64 is cross-compiled: any other value
          # would build x86_64 binaries and package them under its own name.
          case "$ARCH" in
            x86_64 | aarch64) ;;
            *)
              echo "::error::unsupported FreeBSD architecture '$ARCH' in freebsd-architectures; use x86_64 or aarch64"
              exit 1
              ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out craft-fonts
        if: inputs.craft-fonts-ref != ''
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: ${{ inputs.craft-fonts-ref }}
      - name: Check out craft-i18n
        uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main
      - name: Start the FreeBSD VM
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: ${{ inputs.freebsd-release == '15.1-STABLE' && '15.1' || inputs.freebsd-release }}
          # Always an x86_64 guest, which KVM accelerates: aarch64 is cross-compiled in it,
          # because an emulated aarch64 guest takes over 5 hours for most apps (#39).
          usesh: true
          cpu: 4
          mem: 12288
          copyback: false
          envs: "APP_NAME CARGO_HOME CARGO_TARGET_DIR CARGO_INCREMENTAL CARGO_BUILD_JOBS VERSION BUILD_DATE BUILD_SHA INPUT_VERSION CADCRAFT_VERSION CADCRAFT_BUILD_DATE CADCRAFT_BUILD_SHA ARTCRAFT_LAUNCHER_VERSION ARTCRAFT_LAUNCHER_BUILD_DATE ARTCRAFT_LAUNCHER_BUILD_SHA DECKCRAFT_VERSION DECKCRAFT_BUILD_DATE DECKCRAFT_BUILD_SHA DESIGNCRAFT_VERSION DESIGNCRAFT_BUILD_DATE DESIGNCRAFT_BUILD_SHA EFFECTCRAFT_VERSION EFFECTCRAFT_BUILD_DATE EFFECTCRAFT_BUILD_SHA FILMCRAFT_VERSION FILMCRAFT_BUILD_DATE FILMCRAFT_BUILD_SHA GRIDCRAFT_VERSION GRIDCRAFT_BUILD_DATE GRIDCRAFT_BUILD_SHA LIGHTCRAFT_VERSION LIGHTCRAFT_BUILD_DATE LIGHTCRAFT_BUILD_SHA PDFCRAFT_VERSION PDFCRAFT_BUILD_DATE PDFCRAFT_BUILD_SHA PHOTOCRAFT_VERSION PHOTOCRAFT_BUILD_DATE PHOTOCRAFT_BUILD_SHA SOUNDCRAFT_VERSION SOUNDCRAFT_BUILD_DATE SOUNDCRAFT_BUILD_SHA VECTORCRAFT_VERSION VECTORCRAFT_BUILD_DATE VECTORCRAFT_BUILD_SHA WORDCRAFT_VERSION WORDCRAFT_BUILD_DATE WORDCRAFT_BUILD_SHA FIGCRAFT_VERSION FIGCRAFT_BUILD_DATE FIGCRAFT_BUILD_SHA"
          prepare: |
            # Keep rustup/proxies outside the Cargo data cache.
            unset CARGO_HOME CARGO_TARGET_DIR
            if [ "${{ matrix.arch }}" = aarch64 ]; then
              # The host compiler and the aarch64 standard library come from the amd64 and
              # aarch64 lang/rust packages, which must be the same build. "latest" can build
              # them days apart; the quarterly branch keeps them in step.
              mkdir -p /usr/local/etc/pkg/repos
              printf 'FreeBSD-ports: { url: "https://pkg.FreeBSD.org/${ABI}/quarterly" }\n' > /usr/local/etc/pkg/repos/FreeBSD.conf
              pkg update -f -q
            fi
            pkg install -y bash git curl pkgconf cmake python3 libxkbcommon wayland libX11 libXcursor libXrandr libXi libxcb mesa-libs vulkan-loader gtk3 fontconfig freetype2 alsa-lib
            # aarch64-unknown-freebsd is a tier-3 Rust target: rustup publishes no toolchain
            # or standard library for it ("installer for platform not found"), so use
            # FreeBSD's lang/rust package.
            if [ "${{ matrix.arch }}" = aarch64 ]; then
              pkg install -y rust
            else
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            fi
      # Keep this step identical to the one in freebsd.yml; tests/test_freebsd.py checks it.
      - name: Set up the aarch64 cross toolchain
        if: matrix.arch == 'aarch64'
        shell: freebsd {0}
        run: |
          set -eu
          # Stable Rust, no -Zbuild-std: the aarch64 standard library is copied from FreeBSD's
          # aarch64 lang/rust package, and C code links with base clang and lld against an
          # arm64 sysroot (base.txz plus the libraries the prepare step installs).
          target=aarch64-unknown-freebsd
          X=/var/tmp/craft-cross
          S=$X/sysroot
          mkdir -p "$X/db" "$X/cache" "$S"
          release=$(freebsd-version -u | sed 's/-p[0-9]*$//')
          P="-o ABI=FreeBSD:${release%%.*}:aarch64 -o OSVERSION=$(uname -U) -o PKG_DBDIR=$X/db -o PKG_CACHEDIR=$X/cache -o IGNORE_OSVERSION=yes"
          pkg $P update -q
          host=$(pkg query %v rust)
          cross=$(pkg $P rquery %v rust)
          if [ "$host" != "$cross" ]; then
            echo "error: lang/rust is $host for amd64 but $cross for aarch64; the standard library must match the compiler" >&2
            exit 1
          fi
          pkg $P fetch -y -q rust
          # pkg links each name-version.pkg to its hashed file.
          tar -xf "$X/cache/rust-$cross.pkg" -C "$X" --include "*usr/local/lib/rustlib/$target/*"
          cp -R "$X/usr/local/lib/rustlib/$target" /usr/local/lib/rustlib/
          base=https://download.freebsd.org/releases/arm64/aarch64/$release
          fetch -q -o "$X/MANIFEST" "$base/MANIFEST"
          fetch -q -o "$X/base.txz" "$base/base.txz"
          if [ "$(awk '$1 == "base.txz" { print $2 }' "$X/MANIFEST")" != "$(sha256 -q "$X/base.txz")" ]; then
            echo "error: arm64 base.txz does not match its MANIFEST" >&2
            exit 1
          fi
          tar -xf "$X/base.txz" -C "$S" ./lib ./usr/lib ./usr/include ./usr/libdata
          # The libraries the prepare step installs; the build tools and fonts stay host-only.
          pkg $P fetch -y -q -d libxkbcommon wayland libX11 libXcursor libXrandr libXi libxcb mesa-libs vulkan-loader gtk3 fontconfig freetype2 alsa-lib
          for p in "$X"/cache/*.pkg; do
            [ ! -L "$p" ] || continue
            case "$p" in */rust-*) continue ;; esac
            tar -xf "$p" -C "$S" --exclude '+*'
          done
          for tool in cc c++; do
            printf '#!/bin/sh\nexec %s --target=%s%s --sysroot=%s -fuse-ld=lld -I%s/usr/local/include -L%s/usr/local/lib -Wl,-rpath-link,%s/usr/local/lib "$@"\n' \
              "$tool" "$target" "${release%%-*}" "$S" "$S" "$S" "$S" > "$X/$tool"
            chmod +x "$X/$tool"
          done
          cat > "$X/env" <<EOF
          export CARGO_BUILD_TARGET=$target
          export CARGO_TARGET_AARCH64_UNKNOWN_FREEBSD_LINKER=$X/cc
          export CC_aarch64_unknown_freebsd=$X/cc CXX_aarch64_unknown_freebsd=$X/c++ AR_aarch64_unknown_freebsd=/usr/bin/ar
          export PKG_CONFIG_ALLOW_CROSS=1 PKG_CONFIG_SYSROOT_DIR=$S PKG_CONFIG_LIBDIR=$S/usr/local/libdata/pkgconfig:$S/usr/libdata/pkgconfig
          EOF
          rustc --print target-libdir --target "$target"
      - name: Restore FreeBSD release Cargo cache
        id: cargo-cache
        continue-on-error: true
        timeout-minutes: 10
        uses: storytold/craft-common-actions/actions/freebsd-cargo-cache@main
        with:
          profile: release
          configuration: ${{ toJSON(inputs) }}
          source-hash: ${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/build.rs', '.cargo/**', 'rust-toolchain*', 'packaging/**', '.github/workflows/release.yml') }}
      - name: Build and package
        shell: freebsd {0}
        run: |
          set -eu
          # Only rustup writes this; the lang/rust package installs into /usr/local/bin.
          [ ! -f "$HOME/.cargo/env" ] || . "$HOME/.cargo/env"
          # A failed restore may leave partial files. Rebuild from an empty cache.
          if [ "${{ steps.cargo-cache.outcome }}" = failure ]; then
            rm -rf /var/tmp/craft-target /var/tmp/craft-cargo/registry /var/tmp/craft-cargo/git
          fi
          git config --global --add safe.directory "*"
          # Before the cross environment: xtask has to run on the guest.
          if [ -n "$INPUT_VERSION" ]; then cargo xtask version set "$VERSION" || cargo run -q -p xtask -- version set "$VERSION"; fi
          # Written by "Set up the aarch64 cross toolchain": cargo then builds for aarch64.
          [ ! -f /var/tmp/craft-cross/env ] || . /var/tmp/craft-cross/env
          # Cargo puts a cross build's binaries under target/<triple>/release.
          rel="${CARGO_BUILD_TARGET:+$CARGO_BUILD_TARGET/}release"
          export CRAFT_FONTS_DIR="$PWD/craft-fonts" CRAFT_FONTS_REQUIRED=1
          if [ -f craft-i18n.rev ]; then export CRAFT_I18N_DIR="$PWD/craft-i18n" CRAFT_I18N_REQUIRED=1; fi
          if [ -f packaging/freebsd/package.sh ]; then
            bash packaging/freebsd/package.sh
          else
            set -- -p "$APP_NAME"
            if cargo metadata --format-version 1 --no-deps | python3 -c 'import json, sys; sys.exit(not any(p["name"] == sys.argv[1] for p in json.load(sys.stdin)["packages"]))' "$APP_NAME-cli"; then
              set -- "$@" -p "$APP_NAME-cli"
            fi
            cargo build --release --locked "$@"
            name="$APP_NAME-$VERSION-freebsd-${{ matrix.arch }}"
            mkdir -p "dist/release/$name"
            cp "target/$rel/$APP_NAME" "dist/release/$name/" 2>/dev/null || cp "/var/tmp/craft-target/$rel/$APP_NAME" "dist/release/$name/"
            if [ -f "target/$rel/$APP_NAME-cli" ]; then
              cp "target/$rel/$APP_NAME-cli" "dist/release/$name/"
            elif [ -f "/var/tmp/craft-target/$rel/$APP_NAME-cli" ]; then
              cp "/var/tmp/craft-target/$rel/$APP_NAME-cli" "dist/release/$name/"
            fi
            cp README.md LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md "dist/release/$name/" 2>/dev/null || true
            if [ -f "packaging/linux/ai.storyteller.$APP_NAME.desktop" ]; then
              cp "packaging/linux/ai.storyteller.$APP_NAME.desktop" "dist/release/$name/"
            fi
            mkdir -p "dist/release/$name/icons"
            cp -R assets/app-icon/hicolor "dist/release/$name/icons/" 2>/dev/null || true
            tar -C dist/release -czf "dist/release/$name.tar.gz" "$name"
            rm -rf "dist/release/$name"
          fi
          # The guest is x86_64 either way: a package.sh that names its archive after uname -m
          # instead of CARGO_BUILD_TARGET would ship an x86_64-labelled aarch64 build, or worse.
          found=
          for archive in dist/release/*-freebsd-*.tar.gz; do
            [ -f "$archive" ] || continue
            case "$archive" in
              *-freebsd-${{ matrix.arch }}.tar.gz) found=1 ;;
              *)
                echo "error: $archive is not a FreeBSD ${{ matrix.arch }} archive; packaging/freebsd/package.sh must honor CARGO_BUILD_TARGET" >&2
                exit 1
                ;;
            esac
          done
          if [ -z "$found" ]; then
            echo "error: no FreeBSD ${{ matrix.arch }} archive was produced" >&2
            exit 1
          fi
      - name: Copy release archives from the VM
        run: |
          mkdir -p dist/release
          rsync -a --timeout=1800 --rsync-path='env PATH=/usr/local/bin:/usr/bin:/bin rsync' \
            -e 'ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=60 -o ConnectTimeout=120' \
            "freebsd:$GITHUB_WORKSPACE/dist/release/" dist/release/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-freebsd-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error
      - name: Save FreeBSD release Cargo cache
        if: github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && steps.cargo-cache.outputs.key != '' && steps.cargo-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 10
        uses: storytold/craft-common-actions/actions/freebsd-cargo-cache@main
        with:
          phase: save
          profile: release
          configuration: ${{ toJSON(inputs) }}
          source-hash: ${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/build.rs', '.cargo/**', 'rust-toolchain*', 'packaging/**', '.github/workflows/release.yml') }}
          key: ${{ steps.cargo-cache.outputs.key }}


  web:
    timeout-minutes: 90
    name: Web (wasm)
    if: inputs.has-web
    needs: [version]
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_DATE: ${{ needs.version.outputs.date }}
      BUILD_SHA: ${{ github.sha }}
      CADCRAFT_VERSION: ${{ needs.version.outputs.version }}
      CADCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      CADCRAFT_BUILD_SHA: ${{ github.sha }}
      ARTCRAFT_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
      ARTCRAFT_LAUNCHER_BUILD_DATE: ${{ needs.version.outputs.date }}
      ARTCRAFT_LAUNCHER_BUILD_SHA: ${{ github.sha }}
      DECKCRAFT_VERSION: ${{ needs.version.outputs.version }}
      DECKCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      DECKCRAFT_BUILD_SHA: ${{ github.sha }}
      DESIGNCRAFT_VERSION: ${{ needs.version.outputs.version }}
      DESIGNCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      DESIGNCRAFT_BUILD_SHA: ${{ github.sha }}
      EFFECTCRAFT_VERSION: ${{ needs.version.outputs.version }}
      EFFECTCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      EFFECTCRAFT_BUILD_SHA: ${{ github.sha }}
      FILMCRAFT_VERSION: ${{ needs.version.outputs.version }}
      FILMCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      FILMCRAFT_BUILD_SHA: ${{ github.sha }}
      GRIDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      GRIDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      GRIDCRAFT_BUILD_SHA: ${{ github.sha }}
      LIGHTCRAFT_VERSION: ${{ needs.version.outputs.version }}
      LIGHTCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      LIGHTCRAFT_BUILD_SHA: ${{ github.sha }}
      PDFCRAFT_VERSION: ${{ needs.version.outputs.version }}
      PDFCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      PDFCRAFT_BUILD_SHA: ${{ github.sha }}
      PHOTOCRAFT_VERSION: ${{ needs.version.outputs.version }}
      PHOTOCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      PHOTOCRAFT_BUILD_SHA: ${{ github.sha }}
      SOUNDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      SOUNDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      SOUNDCRAFT_BUILD_SHA: ${{ github.sha }}
      VECTORCRAFT_VERSION: ${{ needs.version.outputs.version }}
      VECTORCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      VECTORCRAFT_BUILD_SHA: ${{ github.sha }}
      WORDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      WORDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      WORDCRAFT_BUILD_SHA: ${{ github.sha }}
      FIGCRAFT_VERSION: ${{ needs.version.outputs.version }}
      FIGCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      FIGCRAFT_BUILD_SHA: ${{ github.sha }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-web
      - uses: storytold/craft-common-actions/actions/install-trunk@main
        with:
          trunk-version: ${{ inputs.trunk-version }}
      - name: Check out craft-fonts
        if: inputs.web-craft-fonts && inputs.craft-fonts-ref != ''
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: ${{ inputs.craft-fonts-ref }}
      - name: Check out craft-i18n
        uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main
      - name: Apply version override
        if: inputs.version != ''
        run: cargo xtask version set "$VERSION"
      - name: Build and zip
        if: ${{ !(inputs.web-craft-fonts && inputs.craft-fonts-ref != '') }}
        run: packaging/web/package.sh
      - name: Build and zip (with craft-fonts)
        if: inputs.web-craft-fonts && inputs.craft-fonts-ref != ''
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/web/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-web
          path: dist/release/*
          if-no-files-found: error

  linux-riscv64:
    timeout-minutes: 90
    name: Linux riscv64
    if: inputs.has-riscv64
    needs: [version]
    # Not 22.04 like the other Linux jobs: Ubuntu never built jammy's ncurses security update for
    # riscv64, so the amd64 and riscv64 libtinfo6 can't match and the cross deps don't install (#44).
    runs-on: ubuntu-24.04
    env:
      # Built on 24.04, the binaries need GLIBC_2.39. The deb and rpm declare it only where the
      # app's nfpm.yaml reads ${GLIBC_FLOOR}; an app still hard-coding 2.35 keeps declaring 2.35.
      GLIBC_FLOOR: "2.39"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_DATE: ${{ needs.version.outputs.date }}
      BUILD_SHA: ${{ github.sha }}
      CADCRAFT_VERSION: ${{ needs.version.outputs.version }}
      CADCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      CADCRAFT_BUILD_SHA: ${{ github.sha }}
      ARTCRAFT_LAUNCHER_VERSION: ${{ needs.version.outputs.version }}
      ARTCRAFT_LAUNCHER_BUILD_DATE: ${{ needs.version.outputs.date }}
      ARTCRAFT_LAUNCHER_BUILD_SHA: ${{ github.sha }}
      DECKCRAFT_VERSION: ${{ needs.version.outputs.version }}
      DECKCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      DECKCRAFT_BUILD_SHA: ${{ github.sha }}
      DESIGNCRAFT_VERSION: ${{ needs.version.outputs.version }}
      DESIGNCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      DESIGNCRAFT_BUILD_SHA: ${{ github.sha }}
      EFFECTCRAFT_VERSION: ${{ needs.version.outputs.version }}
      EFFECTCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      EFFECTCRAFT_BUILD_SHA: ${{ github.sha }}
      FILMCRAFT_VERSION: ${{ needs.version.outputs.version }}
      FILMCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      FILMCRAFT_BUILD_SHA: ${{ github.sha }}
      GRIDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      GRIDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      GRIDCRAFT_BUILD_SHA: ${{ github.sha }}
      LIGHTCRAFT_VERSION: ${{ needs.version.outputs.version }}
      LIGHTCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      LIGHTCRAFT_BUILD_SHA: ${{ github.sha }}
      PDFCRAFT_VERSION: ${{ needs.version.outputs.version }}
      PDFCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      PDFCRAFT_BUILD_SHA: ${{ github.sha }}
      PHOTOCRAFT_VERSION: ${{ needs.version.outputs.version }}
      PHOTOCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      PHOTOCRAFT_BUILD_SHA: ${{ github.sha }}
      SOUNDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      SOUNDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      SOUNDCRAFT_BUILD_SHA: ${{ github.sha }}
      VECTORCRAFT_VERSION: ${{ needs.version.outputs.version }}
      VECTORCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      VECTORCRAFT_BUILD_SHA: ${{ github.sha }}
      WORDCRAFT_VERSION: ${{ needs.version.outputs.version }}
      WORDCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      WORDCRAFT_BUILD_SHA: ${{ github.sha }}
      FIGCRAFT_VERSION: ${{ needs.version.outputs.version }}
      FIGCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      FIGCRAFT_BUILD_SHA: ${{ github.sha }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out craft-fonts
        if: inputs.craft-fonts-ref != ''
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: ${{ inputs.craft-fonts-ref }}
      - name: Check out craft-i18n
        uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: riscv64gc-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-linux-riscv64
      - name: Apply version override
        if: inputs.version != ''
        run: cargo xtask version set "$VERSION"
      - uses: storytold/craft-common-actions/actions/install-riscv64-cross@main
      - name: Install nfpm (SHA256-verified)
        uses: storytold/craft-common-actions/actions/install-nfpm@main
        with:
          nfpm-version: ${{ inputs.nfpm-version }}
          deb-arch: amd64
      - name: Build and package (deb, rpm, tar.gz)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          PKG_CONFIG_SYSROOT_DIR: /
          PKG_CONFIG_PATH: /usr/lib/riscv64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          PKG_CONFIG_ALLOW_CROSS: "1"
          CROSS_ARCH: riscv64
          CROSS_TARGET: riscv64gc-unknown-linux-gnu
          CROSS_COMPILE: riscv64-linux-gnu-
          EMULATOR: qemu-riscv64
          QEMU_LD_PREFIX: /usr/riscv64-linux-gnu
        run: packaging/linux/package.sh --formats "deb rpm tar"
      - name: Check the packages
        run: |
          dpkg-deb --info dist/release/*-linux-riscv64.deb 2>/dev/null || true
          dpkg-deb --contents dist/release/*-linux-riscv64.deb 2>/dev/null | grep -E 'usr/bin/|metainfo|applications' || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-riscv64
          path: dist/release/*
          if-no-files-found: error

  server:
    timeout-minutes: 90
    name: Server Linux ${{ matrix.arch }}
    if: inputs.has-server
    needs: [version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_DATE: ${{ needs.version.outputs.date }}
      BUILD_SHA: ${{ github.sha }}
      FIGCRAFT_VERSION: ${{ needs.version.outputs.version }}
      FIGCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      FIGCRAFT_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out craft-i18n
        uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-server-${{ matrix.arch }}
      - name: Apply version override
        if: inputs.version != ''
        run: cargo xtask version set "$VERSION" || cargo run --locked -q -p xtask -- version set "$VERSION" || true
      - name: Build and package (tar.gz)
        run: packaging/server/package.sh
      - name: Check the archive
        shell: bash
        env:
          APP_NAME: ${{ inputs.app-name }}
        run: |
          tar -tzf "dist/release/$APP_NAME-server-$VERSION-linux-${{ matrix.arch }}.tar.gz" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-server-linux-${{ matrix.arch }}
          path: dist/release/*.tar.gz
          if-no-files-found: error

  launcher-qualification:
    if: inputs.launcher-qualification
    needs: [version, macos, windows, linux]
    uses: ./.github/workflows/launcher-qualification.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    timeout-minutes: 10
    name: Draft GitHub Release
    if: "inputs.create-draft && !cancelled() && !contains(needs.*.result, 'failure') && (!inputs.launcher-qualification || needs.launcher-qualification.result == 'success')"
    needs: [version, macos, windows, linux, linux-riscv64, flatpak, arch, freebsd, web, server, launcher-qualification]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: storytold/craft-common-actions/actions/draft-release@main
        with:
          version: ${{ needs.version.outputs.version }}
          app-title: ${{ inputs.app-title }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          launcher-qualification: ${{ inputs.launcher-qualification }}
