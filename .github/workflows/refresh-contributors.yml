name: Refresh release contributors

on:
  workflow_call:
    outputs:
      artifact-name:
        description: Contributor snapshot to pass to the release workflow
        value: ${{ jobs.refresh.outputs.artifact-name }}

permissions:
  contents: read
  pull-requests: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact-name: contributor-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refresh contributor credits for this release commit
        # Use the generator paired with this workflow revision, including pinned/forked calls.
        uses: $/actions/refresh-contributors
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Save the refreshed snapshot for all release builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contributor-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: contributors/contributors.json
          if-no-files-found: error
          retention-days: 7
