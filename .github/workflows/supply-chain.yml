name: "Supply chain"

on:
  workflow_call:
    inputs:
      version:
        description: "Resolved release version without a leading v (needs.release.outputs.version)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  attest:
    name: SBOM and signatures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: false

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p subjects
          find artifacts -type f -print0 > "$PWD/release-files"
          if [ ! -s "$PWD/release-files" ]; then
            echo "::error::no release files were downloaded"
            exit 1
          fi
          while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            if [ -e "subjects/$base" ]; then
              echo "::error::duplicate release file name: $base"
              exit 1
            fi
            cp "$file" "subjects/$base"
          done < "$PWD/release-files"

      - name: Generate the CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: subjects
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          dependency-snapshot: "false"

      - name: Sign the release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: subjects/*

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: subjects/*
          sbom-path: sbom.cyclonedx.json

      - name: Attach the SBOM to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout here, so gh has no git remote to find the repository from.
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="v${VERSION#v}"
          gh release upload "$tag" sbom.cyclonedx.json --clobber
