name: Trigger website repo version bump after nightly publish
# Runs outside the release-ref signer so website dispatch failures or missing
# tokens can never fail a signer run or block later nightly admissions.
on:
  workflow_call:
    secrets:
      ARTCRAFT_SERVICES_DISPATCH_TOKEN:
        required: false
permissions: {}
jobs:
  notify-website:
    name: Trigger website repo version bump
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    continue-on-error: true
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Trigger website repo version bump
        env:
          GH_TOKEN: ${{ secrets.ARTCRAFT_SERVICES_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::ARTCRAFT_SERVICES_DISPATCH_TOKEN is not set; skipping storytold/artcraft-services update-craft-release-versions.yml dispatch."
            exit 0
          fi
          if ! gh workflow run update-craft-release-versions.yml --repo storytold/artcraft-services; then
            echo "::warning::Failed to dispatch update-craft-release-versions.yml on storytold/artcraft-services."
          fi
