        with:
          artifact-ids: ${{ inputs.unsigned-artifact-id }}
          path: .nightly-unsigned
          merge-multiple: true
          digest-mismatch: error
      - name: Required isolated signing and verification (never run application code)
        id: sign
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IDENTITY_SHA256: ${{ inputs.identity-sha256 }}
          UNSIGNED_SHA256: ${{ inputs.unsigned-sha256 }}
          EXACT_VERSION: ${{ inputs.version }}
          ASSET: ${{ inputs.asset }}
        run: |
          python3 -B .nightly-tools/scripts/nightly_signing.py sign --platform macos-aarch64             --registry .nightly-tools/nightly-apps.json --source . --version "$EXACT_VERSION"             --pending .nightly-tools/nightly-unix-pending.json             --identity-directory .nightly-input --identity-sha256 "$IDENTITY_SHA256"             --archive ".nightly-unsigned/$ASSET" --unsigned-sha256 "$UNSIGNED_SHA256"             --asset "$ASSET" --output ".nightly-signed/$ASSET" --receipt-directory .nightly-signing
