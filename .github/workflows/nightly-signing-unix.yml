name: Isolated pending Unix nightly signing
# Called only by nightly-unix.yml after the secret-free build, and only with production-signing.
on:
  workflow_call:
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      KEYCHAIN_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      LINUX_SIGNING_KEY:
        required: false
    inputs:
      manual-actors:
        description: "Reviewed literal JSON logins in caller source; accidental-use guard only; empty disables manual runs and re-runs"
        type: string
        default: '[]'
      tooling-revision:
        type: string
        required: true
      platform:
        type: string
        required: true
      app-name:
        type: string
        required: true
      version:
        type: string
        required: true
      identity-artifact-id:
        type: string
        required: true
      identity-sha256:
        type: string
        required: true
      unsigned-artifact-id:
        type: string
        required: true
      unsigned-sha256:
        type: string
        required: true
      asset:
        type: string
        required: true
      linux-signing-fingerprint:
        description: "Reviewed full uppercase primary fingerprint of the stable Linux key, committed in caller source; never a repository variable"
        type: string
        default: ''
      production-signing:
        description: "Opt in to production-signed nightly artifacts (and their publication). Off unless the caller sets true; a caller existing is not consent to sign."
        type: boolean
        default: false
      apple-team-id:
        description: "Reviewed literal Apple Developer team ID from caller source (public); empty refuses macOS signing"
        type: string
        default: ''
    outputs:
      artifact-id:
        value: ${{ jobs.linux.outputs.artifact-id || jobs.macos.outputs.artifact-id }}
      sha256:
        value: ${{ jobs.linux.outputs.sha256 || jobs.macos.outputs.sha256 }}
      receipt-artifact-id:
        value: ${{ jobs.linux.outputs.receipt-artifact-id || jobs.macos.outputs.receipt-artifact-id }}
      receipt-sha256:
        value: ${{ jobs.linux.outputs.receipt-sha256 || jobs.macos.outputs.receipt-sha256 }}
permissions:
  contents: read
env:
  TOOLING_REVISION: ${{ inputs.tooling-revision }}
  NIGHTLY_REVIEWED_POLICY_SHA256: ${{ vars.NIGHTLY_REVIEWED_POLICY_SHA256 }}
jobs:
  linux:
    if: >-
      inputs.production-signing == true && inputs.platform == 'linux-x86_64' && inputs.app-name == 'photocraft' && github.repository == 'storytold/photocraft' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && github.run_attempt == '1') ||
       ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
        contains(fromJSON(inputs.manual-actors), github.triggering_actor)))
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    environment: nightly-signing
    permissions:
      contents: read
    env:
      NIGHTLY_LINUX_SIGNING_FINGERPRINT: ${{ inputs.linux-signing-fingerprint }}
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.sign.outputs.sha256 }}
      receipt-artifact-id: ${{ steps.receipt.outputs.artifact-id }}
      receipt-sha256: ${{ steps.sign.outputs.receipt-sha256 }}
    steps:
      - name: Select Python for nightly helpers
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Check out exact trusted application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind app-reviewed tooling to the defining job before shared checkout
        shell: bash
        env:
          DEFINING_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          python -I -B - <<'PY'
          import json, os, pathlib, re
          pin=os.environ['TOOLING_REVISION']
          assert re.fullmatch('[0-9a-f]{40}',pin) and pin!='0'*40, 'reviewed immutable tooling SHA required'
          assert os.environ['DEFINING_WORKFLOW_REPOSITORY']=='storytold/craft-common-actions', 'unexpected defining workflow repository'
          assert os.environ['DEFINING_WORKFLOW_SHA']==pin, 'app-reviewed input must equal the defining job workflow SHA'
          path=pathlib.Path('.github/nightly-publication-policy.json')
          assert path.is_file() and not path.is_symlink(), 'app publication policy unresolved'
          with path.open('rb') as stream: data=stream.read(262145)
          assert len(data)<=262144, 'publication policy exceeds bound'
          def unique(pairs):
              result={}
              for key,value in pairs:
                  if key in result: raise ValueError('duplicate app-policy key')
                  result[key]=value
              return result
          config=json.loads(data,object_pairs_hook=unique)
          assert config.get('schema') in ('craft-nightly-publication-policy/v1','craft-nightly-publication-policy/v2') and config.get('tooling_revision')==pin, 'tooling pin differs from app-reviewed policy'
          if config['schema'].endswith('/v2'):
              import hashlib
              expected=os.environ.get('NIGHTLY_REVIEWED_POLICY_SHA256','')
              digest=hashlib.sha256(json.dumps(config,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
              assert re.fullmatch('[0-9a-f]{64}',expected) and digest==expected, 'independent reviewed baseline policy digest required'
          PY
      - name: Check out the defining job's own immutable tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nightly-tools
          persist-credentials: false
      - name: Verify exact tooling checkout
        shell: bash
        run: test "$(git -C .nightly-tools rev-parse HEAD)" = "$TOOLING_REVISION"
      - name: Admit scheduled first attempt or reviewed current manual actor before credentials or mutation
        shell: bash
        env:
          NIGHTLY_MANUAL_ACTORS: ${{ inputs.manual-actors }}
        run: python -I -B .nightly-tools/scripts/nightly_invocation.py
      - name: Require exact numeric IDs and independent producer hashes before download
        shell: bash
        env:
          IDENTITY_ID: ${{ inputs.identity-artifact-id }}
          IDENTITY_SHA256: ${{ inputs.identity-sha256 }}
        run: |
          set -euo pipefail
          python -B .nightly-tools/scripts/nightly_artifacts.py download-contract --artifact-id "$IDENTITY_ID" --expected-sha256 "$IDENTITY_SHA256"
      - name: Download exact identity artifact ID, never a name replacement
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.identity-artifact-id }}
          path: .nightly-input
          merge-multiple: true
          digest-mismatch: error
      - name: Verify independent identity producer bytes before adapter/build logic
        shell: bash
        env:
          IDENTITY_SHA256: ${{ inputs.identity-sha256 }}
        run: python -B .nightly-tools/scripts/nightly_artifacts.py verify --kind identity --directory .nightly-input --expected-sha256 "$IDENTITY_SHA256"
      - name: Refuse missing actual app adapter or reviewed signing trust configuration
        run: python3 -B .nightly-tools/scripts/nightly_signing.py adapter --platform linux-x86_64 --source .
      - name: Require exact unsigned upload ID and independent build hash
        env:
          UNSIGNED_ID: ${{ inputs.unsigned-artifact-id }}
          UNSIGNED_SHA256: ${{ inputs.unsigned-sha256 }}
        run: python3 -B .nightly-tools/scripts/nightly_artifacts.py download-contract --artifact-id "$UNSIGNED_ID" --expected-sha256 "$UNSIGNED_SHA256"
      - name: Download original unsigned producer artifact only
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ inputs.unsigned-artifact-id }}
          path: .nightly-unsigned
          merge-multiple: true
          digest-mismatch: error
      - name: Required isolated signing and verification (never run application code)
        id: sign
        env:
          LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
          IDENTITY_SHA256: ${{ inputs.identity-sha256 }}
          UNSIGNED_SHA256: ${{ inputs.unsigned-sha256 }}
          EXACT_VERSION: ${{ inputs.version }}
          ASSET: ${{ inputs.asset }}
        run: |
          python3 -B .nightly-tools/scripts/nightly_signing.py sign --platform linux-x86_64             --registry .nightly-tools/nightly-apps.json --source . --version "$EXACT_VERSION"             --pending .nightly-tools/nightly-unix-pending.json             --identity-directory .nightly-input --identity-sha256 "$IDENTITY_SHA256"             --archive ".nightly-unsigned/$ASSET" --unsigned-sha256 "$UNSIGNED_SHA256"             --asset "$ASSET" --output ".nightly-signed/$ASSET" --receipt-directory .nightly-signing
      - name: Upload final verified signed package and required signature support
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          include-hidden-files: true
          name: signed-nightly-linux-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: .nightly-signed/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload independently bound signing receipt
        id: receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          include-hidden-files: true
          name: nightly-signing-linux-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: .nightly-signing/nightly-signing.json
          if-no-files-found: error
          retention-days: 14

  macos:
    if: >-
      inputs.production-signing == true && inputs.platform == 'macos-aarch64' && inputs.app-name == 'photocraft' && github.repository == 'storytold/photocraft' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && github.run_attempt == '1') ||
       ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
        contains(fromJSON(inputs.manual-actors), github.triggering_actor)))
    runs-on: macos-15
    timeout-minutes: 120
    environment: nightly-signing
    permissions:
      contents: read
    env:
      NIGHTLY_APPLE_TEAM_ID: ${{ inputs.apple-team-id }}
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.sign.outputs.sha256 }}
      receipt-artifact-id: ${{ steps.receipt.outputs.artifact-id }}
      receipt-sha256: ${{ steps.sign.outputs.receipt-sha256 }}
    steps:
      - name: Select Python for nightly helpers
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Check out exact trusted application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bind app-reviewed tooling to the defining job before shared checkout
        shell: bash
        env:
          DEFINING_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          DEFINING_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          python -I -B - <<'PY'
          import json, os, pathlib, re
          pin=os.environ['TOOLING_REVISION']
          assert re.fullmatch('[0-9a-f]{40}',pin) and pin!='0'*40, 'reviewed immutable tooling SHA required'
          assert os.environ['DEFINING_WORKFLOW_REPOSITORY']=='storytold/craft-common-actions', 'unexpected defining workflow repository'
          assert os.environ['DEFINING_WORKFLOW_SHA']==pin, 'app-reviewed input must equal the defining job workflow SHA'
          path=pathlib.Path('.github/nightly-publication-policy.json')
          assert path.is_file() and not path.is_symlink(), 'app publication policy unresolved'
          with path.open('rb') as stream: data=stream.read(262145)
          assert len(data)<=262144, 'publication policy exceeds bound'
          def unique(pairs):
              result={}
              for key,value in pairs:
                  if key in result: raise ValueError('duplicate app-policy key')
                  result[key]=value
              return result
          config=json.loads(data,object_pairs_hook=unique)
          assert config.get('schema') in ('craft-nightly-publication-policy/v1','craft-nightly-publication-policy/v2') and config.get('tooling_revision')==pin, 'tooling pin differs from app-reviewed policy'
          if config['schema'].endswith('/v2'):
              import hashlib
              expected=os.environ.get('NIGHTLY_REVIEWED_POLICY_SHA256','')
              digest=hashlib.sha256(json.dumps(config,sort_keys=True,separators=(',',':'),allow_nan=False).encode()).hexdigest()
              assert re.fullmatch('[0-9a-f]{64}',expected) and digest==expected, 'independent reviewed baseline policy digest required'
          PY
      - name: Check out the defining job's own immutable tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .nightly-tools
          persist-credentials: false
      - name: Verify exact tooling checkout
        shell: bash
        run: test "$(git -C .nightly-tools rev-parse HEAD)" = "$TOOLING_REVISION"
      - name: Admit scheduled first attempt or reviewed current manual actor before credentials or mutation
        shell: bash
        env:
          NIGHTLY_MANUAL_ACTORS: ${{ inputs.manual-actors }}
        run: python -I -B .nightly-tools/scripts/nightly_invocation.py
      - name: Require exact numeric IDs and independent producer hashes before download
        shell: bash
        env:
          IDENTITY_ID: ${{ inputs.identity-artifact-id }}
          IDENTITY_SHA256: ${{ inputs.identity-sha256 }}
        run: |
          set -euo pipefail
          python -B .nightly-tools/scripts/nightly_artifacts.py download-contract --artifact-id "$IDENTITY_ID" --expected-sha256 "$IDENTITY_SHA256"
      - name: Download exact identity artifact ID, never a name replacement
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
