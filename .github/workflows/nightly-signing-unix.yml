        run: python -B .nightly-tools/scripts/nightly_artifacts.py verify --kind identity --directory .nightly-input --expected-sha256 "$IDENTITY_SHA256"
      - name: Refuse missing actual app adapter or reviewed signing trust configuration
        run: python3 -B .nightly-tools/scripts/nightly_signing.py adapter --platform macos-aarch64 --source .
      - name: Require exact unsigned upload ID and independent build hash
        env:
          UNSIGNED_ID: ${{ inputs.unsigned-artifact-id }}
          UNSIGNED_SHA256: ${{ inputs.unsigned-sha256 }}
        run: python3 -B .nightly-tools/scripts/nightly_artifacts.py download-contract --artifact-id "$UNSIGNED_ID" --expected-sha256 "$UNSIGNED_SHA256"
      - name: Download original unsigned producer artifact only
