name: cli-package-check test

on:
  pull_request:
    paths:
      - actions/cli-package-check/**
      - tests/test_cli_package_check.py
      - .github/workflows/test-cli-package-check.yml
  push:
    branches: [main]
    paths:
      - actions/cli-package-check/**
      - tests/test_cli_package_check.py
      - .github/workflows/test-cli-package-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            *.amazontrust.com:80
            esm.ubuntu.com:443
            motd.ubuntu.com:443
            api.github.com:443
            github.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CLI package check unit tests
        run: python3 -m unittest tests/test_cli_package_check.py
