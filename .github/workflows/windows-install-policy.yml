name: Windows installation policy

on:
  workflow_call:
    inputs:
      packaging-directory:
        description: App packaging directory containing install-policy.json and WiX sources
        type: string
        required: false
        default: packaging/windows

permissions:
  contents: read

jobs:
  policy:
    name: Windows installation policy (no app build)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # $/ is this workflow's own repository and commit, so a caller always runs the action from
      # the same revision as the workflow, whether it calls @main or pins a commit.
      - uses: $/actions/windows-install-policy
        with:
          packaging-directory: ${{ inputs.packaging-directory }}
