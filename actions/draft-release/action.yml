name: "Draft GitHub Release"
description: "Collects release artifacts, computes sha256 checksums, and creates or updates a draft GitHub Release"

inputs:
  version:
    description: "Release version string without 'v' prefix"
    required: true
  app-title:
    description: "Human-readable application name"
    required: true
  prerelease:
    description: "Whether release is marked as prerelease"
    required: false
    default: "false"
  github-token:
    description: "GitHub token for authenticating gh CLI"
    required: true
  launcher-qualification:
    description: "Require same-run, same-commit launcher lifecycle reports matching every tested artifact hash"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Checkout the exact qualification contract
      if: inputs.launcher-qualification == 'true'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Download all release artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: release-*
        path: artifacts
        merge-multiple: true

    - name: Download same-run launcher qualification evidence
      if: inputs.launcher-qualification == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: launcher-qualification-*
        path: qualification
        # Keep logs separated: each platform has identically named step files.
        merge-multiple: false

    - name: Verify candidate bytes before any release mutation
      if: inputs.launcher-qualification == 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        python3 packaging/e2e/verify_release.py --artifacts artifacts --reports qualification \
          --version "$VERSION" --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID"

    - name: Compute checksums
      shell: bash
      working-directory: artifacts
      run: |
        sha256sum -- * | tee SHA256SUMS.txt

    - name: Create or update draft release
      shell: bash
      working-directory: artifacts
      env:
        VERSION: ${{ inputs.version }}
        APP_TITLE: ${{ inputs.app-title }}
        PRERELEASE: ${{ inputs.prerelease }}
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
      run: |
        tag="v$VERSION"
        title="$APP_TITLE v$VERSION"
        pre=()
        if [ "$PRERELEASE" = "true" ]; then pre=(--prerelease); fi
        if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
          if [ "$draft" != "true" ]; then
            echo "::error::Release $tag is already published. Bump the version (cargo xtask version set) before pushing to release."
            exit 1
          fi
          echo "Updating draft $tag: replacing its assets"
          gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
            gh release delete-asset "$tag" "$asset" --yes
          done
          gh release edit "$tag" --draft --title "$title" --target "$GITHUB_SHA" --prerelease="$PRERELEASE"
          gh release upload "$tag" --clobber -- *
        else
          echo "Creating draft $tag"
          gh release create "$tag" --draft --title "$title" --target "$GITHUB_SHA" --generate-notes "${pre[@]}" -- *
        fi
        {
          echo "Draft release **$title** at \`${GITHUB_SHA::9}\`:"
          echo
          sed 's/^/    /' SHA256SUMS.txt
        } >>"$GITHUB_STEP_SUMMARY"
