name: Check house rules
description: >-
  Fail unless the AGENTS.md craft-agents block matches craft-contrib at the commit it names, and that
  commit is on main. The retired house-rules blocks (RFC-0006) fail. An intact older commit warns only when the normalized standards file changed on main.

inputs:
  working-directory:
    description: "Directory that contains AGENTS.md"
    required: false
    default: "."
  source:
    description: "Checkout of storytold/craft-contrib with main history"
    required: true
  require-rust:
    description: "Ignored: it applied only to the retired house-rules blocks"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: House rules match craft-contrib
      shell: bash
      env:
        CHECK_PATH: ${{ github.action_path }}/house_rules.py
        WORKSPACE_DIR: ${{ inputs.working-directory }}
        SOURCE_DIR: ${{ inputs.source }}
        REQUIRE_RUST: ${{ inputs.require-rust }}
      run: |
        set -euo pipefail
        args=(python3 "$CHECK_PATH" check --directory "$WORKSPACE_DIR" --source "$SOURCE_DIR")
        if [ "$REQUIRE_RUST" = "true" ]; then
          args+=(--require-rust)
        fi
        "${args[@]}"
