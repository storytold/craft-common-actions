name: "Install Linux Build and Packaging Dependencies"
description: "Installs Linux system dependencies, libraries, and nfpm packaging tool on Ubuntu runners"

inputs:
  deb-arch:
    description: "Debian architecture for nfpm package (e.g. amd64 or arm64)"
    required: false
    default: "amd64"
  nfpm-version:
    description: "Version of nfpm to install"
    required: false
    default: "2.48.0"

runs:
  using: "composite"
  steps:
    - name: Install build and packaging tools
      shell: bash
      run: |
        # A mirror list that reaches beyond ubuntu.com, so an outage there does not stop the job.
        sudo "$GITHUB_ACTION_PATH/../configure-apt-mirrors/configure-apt-mirrors.sh"
        sudo apt-get update
        # scap finds pipewire and dbus headers through pkg-config, and its bindgen step needs libclang
        sudo apt-get install -y --no-install-recommends \
          libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
          libasound2-dev libpipewire-0.3-dev libdbus-1-dev libclang-dev pkg-config \
          desktop-file-utils appstream python3-yaml zsync

    - uses: storytold/craft-common-actions/actions/install-nfpm@main
      with:
        nfpm-version: ${{ inputs.nfpm-version }}
        deb-arch: ${{ inputs.deb-arch }}
