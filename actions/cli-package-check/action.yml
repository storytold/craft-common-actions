name: "CLI package check"
description: >-
  Fails unless a Linux or FreeBSD package of a Craft CLI installs bash, zsh and fish completions and
  a man page for the CLI and each subcommand (RFC-0018 rules 1.9 and 2.7). Reads only the package's file list.

inputs:
  package:
    description: "The package archive: a tar archive of any compression, a FreeBSD .pkg, a .deb or an .rpm"
    required: true
  cli:
    description: "The binary name, for example photocraft-cli"
    required: true
  subcommands:
    description: "Subcommands that need a man page, separated by spaces"
    required: false
    default: ""
  binary:
    description: "A built CLI whose --help lists its subcommands under 'Commands:' (they are added to subcommands). Optional"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Completions and man pages are installed
      shell: bash
      env:
        CHECK_PATH: ${{ github.action_path }}/check_cli_package.py
        PACKAGE: ${{ inputs.package }}
        CLI: ${{ inputs.cli }}
        SUBCOMMANDS: ${{ inputs.subcommands }}
        BINARY: ${{ inputs.binary }}
      run: |
        set -euo pipefail
        read -r -d '' -a subs <<< "$SUBCOMMANDS" || true
        if [ -n "$BINARY" ]; then
          # clap prints "Commands:", then one command per line, indented, until a blank line;
          # its own `help` command has no man page of its own.
          help=$("$BINARY" --help)
          found=$(awk '/^Commands:[[:space:]]*$/ {on=1; next} on && NF==0 {exit} on && $1 != "help" {print $1}' <<< "$help")
          if [ -z "$found" ]; then
            echo "::error::no 'Commands:' block in '$BINARY --help'"
            exit 1
          fi
          read -r -d '' -a more <<< "$found" || true
          subs+=("${more[@]}")
        fi
        args=(python3 "$CHECK_PATH" --cli "$CLI")
        for s in "${subs[@]}"; do
          args+=(--subcommand "$s")
        done
        case "$PACKAGE" in
          *.deb) list=$(dpkg-deb --fsys-tarfile "$PACKAGE" | tar -t) ;;
          *.rpm) list=$(rpm -qlp "$PACKAGE") ;;
          *)     list=$(tar -tf "$PACKAGE") ;;
        esac
        "${args[@]}" <<< "$list"
