name: "Install RISC-V 64 Cross-Compilation Dependencies"
description: "Configures Ubuntu ports repository and installs cross-compilation packages for riscv64gc-unknown-linux-gnu"

runs:
  using: "composite"
  steps:
    - name: Install cross-compilation dependencies
      shell: bash
      run: |
        . /etc/os-release
        sudo dpkg --add-architecture riscv64
        # Pin the existing (archive.ubuntu.com) sources to amd64; riscv64 comes from ports.
        if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
          sudo sed -i '/^Types: deb/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
        fi
        if [ -f /etc/apt/sources.list ]; then
          sudo sed -i 's/^deb /deb [arch=amd64] /g' /etc/apt/sources.list
          sudo sed -i 's/^deb-src /deb-src [arch=amd64] /g' /etc/apt/sources.list
        fi
        for suite in "$VERSION_CODENAME" "$VERSION_CODENAME-updates" "$VERSION_CODENAME-security"; do
          echo "deb [arch=riscv64] https://ports.ubuntu.com/ubuntu-ports $suite main universe restricted multiverse"
        done | sudo tee /etc/apt/sources.list.d/riscv64.list
        # Multi-Arch: same packages (libc6, linux-libc-dev, zlib1g, ...) must match across amd64 and
        # riscv64. ports.ubuntu.com publishes a suite as soon as archive.ubuntu.com does, but the
        # runner's amd64 mirror (azure.archive.ubuntu.com) lags for hours, leaving apt without a
        # matching pair: it reports "held broken packages" and names a dependency such as
        # linux-libc-dev:riscv64 that "is not going to be installed". Read amd64 from the primary
        # for every suite, security included, so both sides always offer the same versions.
        for suite in "$VERSION_CODENAME" "$VERSION_CODENAME-updates"; do
          echo "deb [arch=amd64] https://archive.ubuntu.com/ubuntu $suite main universe restricted multiverse"
        done | sudo tee /etc/apt/sources.list.d/amd64-primary.list
        echo "deb [arch=amd64] https://security.ubuntu.com/ubuntu $VERSION_CODENAME-security main universe restricted multiverse" \
          | sudo tee /etc/apt/sources.list.d/amd64-security.list
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu libc6-dev-riscv64-cross libc6-dev:riscv64 qemu-user \
          libxkbcommon-dev:riscv64 libwayland-dev:riscv64 libx11-dev:riscv64 libxrandr-dev:riscv64 \
          libxi-dev:riscv64 libgl1-mesa-dev:riscv64 libasound2-dev:riscv64 pkg-config \
          desktop-file-utils appstream
