name: "Install RISC-V 64 Cross-Compilation Dependencies"
description: "Configures Ubuntu ports repository and installs cross-compilation packages for riscv64gc-unknown-linux-gnu"

runs:
  using: "composite"
  steps:
    - name: Install cross-compilation dependencies
      shell: bash
      run: |
        sudo dpkg --add-architecture riscv64
        # amd64 and riscv64 from one pair of mirrors serving the same snapshot, with fallbacks
        # outside ubuntu.com; the script explains the choice.
        sudo "$GITHUB_ACTION_PATH/select-mirrors.sh"
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu libc6-dev-riscv64-cross libc6-dev:riscv64 qemu-user \
          libxkbcommon-dev:riscv64 libwayland-dev:riscv64 libx11-dev:riscv64 libxrandr-dev:riscv64 \
          libxi-dev:riscv64 libgl1-mesa-dev:riscv64 libasound2-dev:riscv64 pkg-config \
          desktop-file-utils appstream
