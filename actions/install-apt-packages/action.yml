name: "Install apt packages (cached)"
description: "Installs Ubuntu packages with apt-get, keeping the downloaded .deb files in the Actions cache so later runs skip the mirror download"

inputs:
  packages:
    description: "Packages to install, separated by spaces or newlines"
    required: true
  save:
    description: "When to save the cache: 'default-branch' (pushes to the default branch only, so PRs restore but never write), 'always' or 'never'"
    required: false
    default: "default-branch"

runs:
  using: "composite"
  steps:
    - name: Compute the cache key
      id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        # No globbing: an unquoted token like foo* must not expand to workspace filenames.
        set -f
        list=$(printf -- '%s\n' $PACKAGES | sort -u | tr '\n' ' ')
        # Tokens become apt-get operands: a leading dash would be an option (-o runs commands).
        for pkg in $list; do
          if [[ ! "$pkg" =~ ^[A-Za-z0-9][A-Za-z0-9.+:=~_-]*$ ]]; then
            echo "::error::install-apt-packages: invalid package name '$pkg'"
            exit 1
          fi
        done
        if [ -z "${list// /}" ]; then
          echo "::error::install-apt-packages: no packages given"
          exit 1
        fi
        hash=$(printf '%s' "$list" | sha256sum | cut -d ' ' -f 1)
        # A new runner image restores the previous image's files through the prefix; apt
        # downloads only the packages that changed, and the default branch saves the new key.
        prefix="apt-debs-v1-${ImageOS:-unknown}-$hash-"
        echo "list=$list" >> "$GITHUB_OUTPUT"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=$prefix${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Restore downloaded packages
      id: restore
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cache/craft-apt-debs
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}

    - name: Install packages
      shell: bash
      env:
        PACKAGE_LIST: ${{ steps.key.outputs.list }}
        # Seconds one attempt at a mirror download may take, and how many attempts are made.
        APT_NETWORK_TIMEOUT: "300"
        APT_NETWORK_ATTEMPTS: "3"
      run: |
        set -euo pipefail
        debs="$HOME/.cache/craft-apt-debs"
        mkdir -p "$debs/partial"
        # The man-db trigger rebuilds the manual page index after every install; CI never reads it.
        sudo rm -f /var/lib/man-db/auto-update
        # A slow or stalled mirror connection is retried instead of holding the job for minutes.
        # The cache directory belongs to the runner user, so downloads run as root rather than as
        # apt's _apt sandbox user, which could not write there.
        opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30
              -o "Dir::Cache::Archives=$debs" -o APT::Keep-Downloaded-Packages=true
              -o APT::Sandbox::User=root)
        # Acquire timeouts don't end a connection that stays open and sends nothing: one such
        # stall held a job for 58 minutes until its own timeout. So each mirror download also has
        # a wall-clock limit and is retried. Only downloads are limited; dpkg is never killed.
        network() {
          local attempt status
          for ((attempt = 1; ; attempt++)); do
            status=0
            sudo timeout --kill-after=30 "$APT_NETWORK_TIMEOUT" apt-get "${opts[@]}" "$@" || status=$?
            [ "$status" -eq 0 ] && return 0
            if [ "$attempt" -ge "$APT_NETWORK_ATTEMPTS" ]; then
              echo "::error::install-apt-packages: apt-get $1 failed $attempt times (last exit $status)"
              return "$status"
            fi
            echo "::warning::install-apt-packages: apt-get $1 attempt $attempt exited $status (124: over ${APT_NETWORK_TIMEOUT}s); retrying"
            sleep 5
          done
        }
        network update
        # shellcheck disable=SC2086 # the list is split into package names on purpose
        network install -y --no-install-recommends --download-only -- $PACKAGE_LIST
        # Everything is downloaded: this only unpacks and configures, with no mirror to wait on.
        # shellcheck disable=SC2086
        sudo apt-get "${opts[@]}" install -y --no-install-recommends -- $PACKAGE_LIST
        sudo apt-get "${opts[@]}" autoclean
        sudo chown -R "$(id -u):$(id -g)" "$debs"

    - name: Save downloaded packages
      if: >-
        steps.restore.outputs.cache-hit != 'true'
        && (inputs.save == 'always'
            || (inputs.save == 'default-branch'
                && github.event_name == 'push'
                && github.ref_name == github.event.repository.default_branch))
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cache/craft-apt-debs
        key: ${{ steps.key.outputs.key }}
