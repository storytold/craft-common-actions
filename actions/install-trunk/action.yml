name: "Install Trunk"
description: "Downloads and installs Trunk for WebAssembly packaging with SHA256 checksum verification"

inputs:
  trunk-version:
    description: "Version of Trunk to install"
    required: false
    default: "0.21.14"

runs:
  using: "composite"
  steps:
    - name: Install trunk
      shell: bash
      env:
        TRUNK_VERSION: ${{ inputs.trunk-version }}
      run: |
        version="$TRUNK_VERSION"
        # Restrict the version to a single safe release-tag component. This keeps
        # the value from carrying slashes or other URL path-traversal segments
        # that could redirect downloads to an attacker-controlled repository. The
        # bash regex anchors the whole string, so values containing a newline are
        # rejected (unlike a line-oriented grep check).
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::invalid trunk-version '$version'"
          exit 1
        fi
        tar_url="https://github.com/trunk-rs/trunk/releases/download/v${version}/trunk-x86_64-unknown-linux-gnu.tar.gz"
        curl --proto '=https' --proto-redir =https -fsSL -o "$RUNNER_TEMP/trunk.tar.gz" "$tar_url"
        case "$version" in
          "0.21.14")
            expected="f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b"
            ;;
          *)
            curl --proto '=https' --proto-redir =https -fsSL -o "$RUNNER_TEMP/trunk.sha256" "$tar_url.sha256"
            expected=$(awk '{print $1}' "$RUNNER_TEMP/trunk.sha256")
            ;;
        esac
        echo "$expected  $RUNNER_TEMP/trunk.tar.gz" | sha256sum -c -
        tar -xz -C "$HOME/.cargo/bin" -f "$RUNNER_TEMP/trunk.tar.gz" trunk
        trunk --version
