# RECIPE ONLY: independent app .github/workflows/nightly-diagnostics.yml.
# Never put this job in the dedicated installable Photo caller's run.
name: Independent nightly diagnostics
on:
  workflow_dispatch:
# No automatic cross-run dispatch, token, cron or health subsystem is introduced.
permissions: {}
jobs:
  diagnostic:
    permissions:
      contents: write
      packages: write
    uses: storytold/craft-common-actions/.github/workflows/nightly-diagnostics.yml@REVIEWED_PUBLISHED_TOOLING_SHA_REQUIRED
    with:
      tooling-revision: REVIEWED_PUBLISHED_TOOLING_SHA_REQUIRED
      app-name: photocraft
      app-title: PhotoCraft
      # Known unadmitted apps use their own catalog app-name/app-title here.
      # All legacy platform/fonts/credits inputs remain available on the callee.
