# RECIPE ONLY: copy to Photo's .github/workflows/nightly.yml only after review,
# a real published tooling SHA, approved policy, and explicit activation authority.
# This example outside .github/workflows is not an active caller.
name: Dedicated Photo nightly
# Schedule-only recommendation. This inert event map selects NO cron.
# During separately approved activation, replace it with an app-reviewed schedule.
# Photo/QA must choose that cadence from measured whole-CI duration.
on: {}
permissions: {}
jobs:
  nightly:
    if: ${{ false }} # Source-only recipe; explicit first-run approval and real published pins required.
    # Complete STATIC reusable-call ceiling, even while attest/publish are false.
    # Each actual native runner job below the call separately grants contents:read.
    permissions:
      contents: write
      actions: read
      checks: read
      id-token: write
      attestations: write
    uses: storytold/craft-common-actions/.github/workflows/nightly.yml@REVIEWED_PUBLISHED_TOOLING_SHA_REQUIRED
    secrets:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
    with:
      tooling-revision: REVIEWED_PUBLISHED_TOOLING_SHA_REQUIRED
      app-name: photocraft
      app-title: PhotoCraft
      force: false
      manual-actors: '[]' # Manual runs and all re-runs stay denied until separately reviewed.
